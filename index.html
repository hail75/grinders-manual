<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Study companion for The Grinder’s Manual: lessons, quizzes, a range trainer on a real table and math drills.">
<meta name="theme-color" content="#0a111d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grinder’s Manual">
<title>Grinder’s Manual Trainer</title>
<style>
@font-face{font-family:"Fraunces";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/fraunces-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Fraunces";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/fraunces-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/instrument-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/instrument-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/instrument-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/instrument-sans-latin-700-normal.woff2") format("woff2")}
/* Palette: felt green, cream cards, gold accents (shared with Hold'em Drill). Every colour is a token with light and dark values. */
/* Palette: Midnight & Brass. Navy is the primary (the variables keep the name "felt": the table, primary buttons,
   the hero card), brass is the accent. Right and wrong have their own teal-green and brick-red, tuned to sit with navy,
   and never borrow the primary colour. Every colour has a light and a dark value. */
:root{
  --bg:#eaeff6; --surface:#ffffff; --surface-2:#f3f6fa; --ink:#121c2c; --muted:#536079; --line:#cbd4e1; --track:#d3dbe7;
  --felt:#1d3a5e; --felt-2:#2a5283; --felt-3:#132845; --felt-ink:#ffffff; --gold:#c9973f; --gold-ink:#33240a;
  --accent:#2a5283; --good:#17795e; --good-bg:#e0f1ea; --good-mark:#1c8a6a; --bad:#b93b36; --bad-bg:#f9e3e0; --bad-mark:#c8463e;
  --warn:#8a5a00; --warn-bg:#fbefd2;
  --card:#fffdf8; --card-ink:#141b26; --card-red:#c4262d; --txt-red:#c4262d;
  --card-edge:0 0 0 1px rgba(18,28,44,.22),0 2px 0 rgba(18,28,44,.28),0 6px 14px rgba(18,28,44,.22);
  --shadow:0 1px 2px rgba(18,28,44,.06),0 6px 20px rgba(18,28,44,.08);
  --cell-fold:#dde4ee; --cell-fold-ink:#67748a; --cell-call:#2e8b7f;
  --cell-r1:#1d3a5e; --cell-r2:#4c72a6; --cell-r3:#a8bedb; --cell-r3-ink:#1d3a5e; --cell-c1:#2e8b7f; --cell-c2:#5fb2a6; --cell-c3:#b3dcd5; --cell-c3-ink:#134d45;
  --hud-green:#1f8a4c; --hud-red:#c2372f; --hud-blue:#2f72d6; --hud-purple:#8a4fd1; --hud-pink:#d1489a;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --nav-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a111d; --surface:#121c2c; --surface-2:#0e1726; --ink:#e6ecf5; --muted:#98a6bd; --line:#22324b; --track:#2a3a55;
    --felt:#1f4673; --felt-2:#2c5d93; --felt-3:#12294a; --felt-ink:#f4f8ff; --gold:#d9a84c;
    --accent:#8fb4e6; --good:#6fd3b0; --good-bg:#11302b; --good-mark:#23a37e; --bad:#ff9189; --bad-bg:#3a1d24; --bad-mark:#d9534a;
    --warn:#f0c46a; --warn-bg:#3a2d12; --txt-red:#ff8a8f;
    --card-edge:0 2px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.18); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --cell-fold:#19253a; --cell-fold-ink:#7d8ca5; --cell-call:#2a7d72;
  --cell-r1:#3f78c2; --cell-r2:#2f5a92; --cell-r3:#24416a; --cell-r3-ink:#c9d8ee; --cell-c1:#2fa290; --cell-c2:#237a6d; --cell-c3:#1b5951; --cell-c3-ink:#c5ece6;
    --hud-green:#5fd38a; --hud-red:#ff7a6e; --hud-blue:#6aa6ff; --hud-purple:#b68cff; --hud-pink:#ff7cc3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a111d; --surface:#121c2c; --surface-2:#0e1726; --ink:#e6ecf5; --muted:#98a6bd; --line:#22324b; --track:#2a3a55;
  --felt:#1f4673; --felt-2:#2c5d93; --felt-3:#12294a; --felt-ink:#f4f8ff; --gold:#d9a84c;
  --accent:#8fb4e6; --good:#6fd3b0; --good-bg:#11302b; --good-mark:#23a37e; --bad:#ff9189; --bad-bg:#3a1d24; --bad-mark:#d9534a;
  --warn:#f0c46a; --warn-bg:#3a2d12; --txt-red:#ff8a8f;
  --card-edge:0 2px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.18); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --cell-fold:#19253a; --cell-fold-ink:#7d8ca5; --cell-call:#2a7d72;
  --cell-r1:#3f78c2; --cell-r2:#2f5a92; --cell-r3:#24416a; --cell-r3-ink:#c9d8ee; --cell-c1:#2fa290; --cell-c2:#237a6d; --cell-c3:#1b5951; --cell-c3-ink:#c5ece6;
  --hud-green:#5fd38a; --hud-red:#ff7a6e; --hud-blue:#6aa6ff; --hud-purple:#b68cff; --hud-pink:#ff7cc3;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums}
#app{max-width:600px;margin:0 auto;padding:10px max(14px,env(safe-area-inset-left,0px)) calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;text-decoration:none;color:inherit}
.logo{flex:none;width:32px;height:32px;display:block}
.top h1{font-family:var(--sans);font-weight:700;letter-spacing:-.01em;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:40px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 13px;white-space:nowrap;text-decoration:none}
.pill b{font-family:var(--serif);font-size:15px;color:var(--ink)}
.pill.hot b{color:var(--gold)}
.iconbtn{flex:none;position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.iconbtn::after{content:"";position:absolute;inset:-2px}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-current="page"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}

/* Bottom navigation (phone), left rail (wide screen) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(0px,calc((100% - 600px)/2)) env(safe-area-inset-bottom,0px)}
.nav .rail-brand,.nav .rail-set{display:none}
.nav button{font-size:11px;font-weight:600;min-height:var(--nav-h);border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;padding:0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Common blocks */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec span{text-transform:none;letter-spacing:0;font-weight:500}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;line-height:1.2;padding:0 20px;min-height:52px;border-radius:14px;border:0;
  background:linear-gradient(180deg,var(--felt-2),var(--felt));color:var(--felt-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--felt) 30%,transparent);text-decoration:none}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--gold) 25%,transparent)}
.btn.wide{width:100%}
.btn.sm{min-height:44px;min-width:96px;font-size:14.5px;font-weight:600;padding:0 16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}
.bar{height:8px;background:var(--track);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;min-width:0;border-radius:8px;background:var(--felt-2);transition:width .3s}
.bar i.low{background:var(--bad-mark)} .bar i.mid{background:var(--gold)}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.done{background:var(--good-bg);border-color:var(--good);color:var(--good)}
/* Sticky action bar: sits above the bottom nav on a phone while the page scrolls. */
.actions{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px;margin:14px -14px 0;padding:14px 14px 12px;
  background:linear-gradient(transparent,var(--bg) 32%)}
.actions .btn{flex:1}
.actions .btn.alt{flex:0 0 34%}

/* Segmented controls and chip rows */
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:3px;border-radius:999px}
.seg button{flex:1;min-height:38px;border:0;background:none;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);padding:0 8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding:8px 2px 4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap;scroll-snap-align:start}
.chip[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink);font-weight:600}
.chip small{opacity:.7;margin-left:4px}

/* Home */
.welcome{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;color:#eef3fa;margin-top:6px;
  background:radial-gradient(120% 100% at 50% 0%,var(--felt-2) 0%,var(--felt) 55%,var(--felt-3) 100%);box-shadow:var(--shadow)}
.welcome::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 2px,transparent 2px 5px)}
.welcome>*{position:relative;z-index:1}
.welcome .eyebrow{color:var(--gold)}
.welcome h2{font-size:25px;margin:6px 0 4px;color:#fff}
.welcome p{color:rgba(238,243,250,.82);font-size:15px}
.welcome .bar{background:rgba(0,0,0,.25);margin:14px 0 6px} .welcome .bar i{background:var(--gold)}
.welcome .meta{display:flex;justify-content:space-between;font-size:13px;color:rgba(238,243,250,.8)}
.welcome .btn{margin-top:14px;background:var(--card);color:#121c2c;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px;min-height:80px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.tile b{font-family:var(--serif);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.25}
.tile.alert b{color:var(--bad)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;margin-top:6px;padding:12px 14px;min-height:72px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink)}
.lnum{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;border:2px solid var(--line);color:var(--muted)}
.lrow.done .lnum{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.lrow.next .lnum{border-color:var(--gold);color:var(--gold)}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.lrow .lt small{display:block;font-size:13px;color:var(--muted);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lrow .lm{flex:none;text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* Lesson */
.backlink{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 4px;border:0;background:none;color:var(--muted);font-size:14.5px;font-weight:600;text-decoration:none}
.lhead h2{font-size:27px;margin:2px 0 0}
.steps{display:flex;gap:4px;margin:14px 0 6px}
.steps button{flex:1;height:28px;border:0;background:none;padding:0;display:flex;align-items:center}
.steps button::before{content:"";display:block;width:100%;height:6px;border-radius:6px;background:var(--track)}
.steps button.seen::before{background:var(--felt-2)}
.steps button.on::before{background:var(--gold);height:8px}
.stepname{font-size:13px;color:var(--muted);font-weight:600}
.lesson{display:block}
.toc{display:none}
.reading{margin-top:12px}
.reading h3{font-size:22px;margin-bottom:10px}
.lede{font-size:17px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.block p{margin:0 0 12px} .block p:last-child{margin-bottom:0}
.block ul,.block ol{margin:0 0 12px;padding-left:22px} .block li{margin-bottom:6px}
.block li::marker{color:var(--muted)}
.key{border:1.5px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);padding:10px 14px;border-radius:12px;margin:12px 0;font-weight:500}
.key>b:first-child{font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;color:var(--muted);margin-bottom:2px}
.formula{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);padding:8px 12px;border-radius:10px;display:inline-block;font-size:14px}
.tbl{overflow-x:auto;margin:8px 0 14px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2)}
td:first-child{white-space:nowrap}
td.num,th.num{font-family:var(--serif);text-align:right;white-space:nowrap}
.gb{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0 14px;font-size:14px}
.gb div{padding:8px 12px;border-bottom:1px solid var(--line);line-height:1.35}
.gb div:nth-last-child(-n+2){border-bottom:0}
.gb .h{font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.gb .g{background:var(--good-bg)} .gb .b{background:var(--bad-bg)}
.gb .h.g{color:var(--good)} .gb .h.b{color:var(--bad)}
.flop{display:inline-flex;gap:3px;vertical-align:middle;margin:0 2px}
.pc.mini{width:27px;height:37px;border-radius:5px;font-size:14px;line-height:1;box-shadow:0 0 0 1px rgba(18,28,44,.2),0 1px 2px rgba(18,28,44,.2)}
.pc.mini small{font-size:12px}
.ttypes{display:grid;gap:8px;margin:10px 0 12px}
.ttypes>div{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.ttypes b{font-size:14.5px;min-width:96px}
.ttypes span:not(.flop):not(.pc){flex-basis:100%;font-size:14px;color:var(--muted);line-height:1.45}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:10px 0 12px;border-radius:10px;overflow:hidden}
.spec span{padding:8px 5px;font-size:12.5px;font-weight:700;text-align:center;line-height:1.25}
.spec small{display:block;font-weight:500;font-size:11px;opacity:.85;margin-top:2px}
.spec span:nth-child(1){background:var(--bad-bg);color:var(--bad)} .spec span:nth-child(2){background:var(--warn-bg);color:var(--warn)}
.spec span:nth-child(3){background:color-mix(in srgb,var(--gold) 22%,var(--surface));color:var(--ink)} .spec span:nth-child(4){background:var(--good-bg);color:var(--good)}
.block .chk{list-style:none;padding-left:0}
.chk li{position:relative;padding-left:28px}
.chk li[data-v="+"]::before{content:"✓";position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:50%;background:var(--good-mark);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.elast{margin:10px 0 12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.elast svg{display:block;width:100%;max-width:420px;margin:0 auto}
.elast .eax{stroke:var(--line);stroke-width:1.5}
.elast .ce{fill:none;stroke:var(--bad-mark);stroke-width:3;stroke-linecap:round}
.elast .ci{fill:none;stroke:var(--felt-2);stroke-width:3;stroke-linecap:round}
.elast text{font-size:9px;fill:var(--muted);font-family:var(--sans)}
.elast figcaption{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.elast figcaption i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.elast .sw-ce{background:var(--bad-mark)} .elast .sw-ci{background:var(--felt-2)}
.block blockquote{margin:10px 0 14px;padding:10px 14px;border-left:3px solid var(--bad-mark);background:var(--bad-bg);border-radius:0 10px 10px 0;font-style:italic;color:var(--ink)}
.stat-pill{font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;color:#fff;white-space:nowrap}

/* Interactive tools inside lessons */
.tool{background:var(--surface-2);border:1.5px dashed var(--line);border-radius:16px;padding:14px;margin:16px 0 4px}
.tool h3{font-size:17px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.tool h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--gold)}
.field{display:flex;flex-direction:column;gap:4px;min-width:130px;flex:1}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
input[type=range]{width:100%;accent-color:var(--felt-2);min-height:32px}
select,input[type=number]{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:0 10px;min-height:44px;color:var(--ink);font:inherit;font-size:16px;width:100%}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-family:var(--serif);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted)}
.verdict{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:15px;border:1.5px solid transparent}
.verdict.good{background:var(--good-bg);color:var(--good);border-color:var(--good)} .verdict.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)} .verdict.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.flow{display:flex;flex-direction:column;gap:10px}
.flow .q{font-weight:600}
.tool .btn{min-height:44px;min-width:96px;font-size:14.5px;font-weight:600;padding:0 16px;border-radius:12px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}

/* Quiz and drill questions */
.qcard{margin-top:12px}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--track)}
.dots i.r{background:var(--good-mark)} .dots i.w{background:var(--bad-mark)} .dots i.c{outline:2px solid var(--gold);outline-offset:1px}
.qt{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.35;margin:10px 0 14px}
.opts{display:grid;gap:8px}
.opt{font-size:16px;text-align:left;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);min-height:52px;display:flex;gap:12px;align-items:center;transition:transform .08s,border-color .15s,background .15s;line-height:1.35}
.opt .k{flex:none;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;width:26px;height:26px;display:grid;place-items:center}
.opt.right{border-color:var(--good);background:var(--good-bg)} .opt.right .k{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.why{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);font-size:15px;line-height:1.5;animation:pop .18s ease-out}
.why.good{background:var(--good-bg);border-color:var(--good)} .why.bad{background:var(--bad-bg);border-color:var(--bad)}
.why .vi{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:var(--good-mark)}
.why.bad .vi{background:var(--bad-mark)}
.why b{display:block;font-size:16px}
.why.good b{color:var(--good)} .why.bad b{color:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.result{text-align:center;border-radius:20px;padding:24px 16px;border:1.5px solid var(--line);margin-top:12px}
.result.good{background:var(--good-bg);border-color:var(--good)} .result.bad{background:var(--bad-bg);border-color:var(--bad)} .result.warn{background:var(--warn-bg);border-color:var(--warn)}
.result small{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.result b{display:block;font-family:var(--serif);font-size:48px;line-height:1.1;margin:4px 0}
.result p{font-size:15.5px;max-width:42ch;margin:0 auto}
.missed{margin-top:12px}
.missed div{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:6px;font-size:14.5px}
.missed div b{display:block;font-weight:600;margin-bottom:2px}
.missed div span{color:var(--good);font-weight:600}

/* The table: oval felt, seats around it, chips in front, cards below */
.spot{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 12px 14px;box-shadow:var(--shadow);margin-top:8px}
.shead{display:flex;align-items:center;gap:8px;min-height:24px}
.shead .topic{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.shead .stag{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:10px}
.shead .stag b{font-family:var(--serif);color:var(--ink)}
.ptable{position:relative;height:190px;margin-top:4px}
.oval{position:absolute;left:5%;right:5%;top:13%;bottom:13%;border-radius:999px;
  background:radial-gradient(90% 120% at 50% 35%,var(--felt-2) 0%,var(--felt) 55%,var(--felt-3) 100%);
  box-shadow:0 0 0 5px #3b2a1a,0 0 0 6.5px color-mix(in srgb,var(--gold) 45%,transparent),inset 0 0 26px rgba(0,0,0,.35)}
.oval::after{content:"";position:absolute;inset:14px 18%;border-radius:999px;border:1px solid rgba(255,255,255,.07)}
.tcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.pot{display:flex;flex-direction:column;align-items:center;line-height:1;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pot small{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#c4d3ea}
.pot b{font-size:19px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
.st{position:absolute;transform:translate(-50%,-50%);min-width:46px;padding:3px 7px 2px;border-radius:11px;text-align:center;line-height:1.15;background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:2}
.st b{display:block;font-size:12px;white-space:nowrap}
.st i{display:block;font-style:normal;font-size:10px;min-height:11px;color:var(--muted);white-space:nowrap}
.st.you{background:var(--card);color:#121c2c;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 2px 6px rgba(0,0,0,.3)}
.st.you i{color:#536079;font-weight:700}
.st.fold{opacity:.45}
.st.acted{border-color:var(--gold)}
.st.acted i{color:var(--ink);font-weight:700}
.dbtn{position:absolute;top:-8px;right:-7px;width:16px;height:16px;border-radius:50%;background:#fbf7ec;color:#121c2c;border:1px solid #121c2c;font-size:9px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.stk{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 4px rgba(0,0,0,.45);white-space:nowrap;z-index:1}
.stk::before{content:"";flex:none;width:13px;height:13px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.stk.d1::before{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2016%2016'%3E%3Ccircle%20cx%3D'8'%20cy%3D'8'%20r%3D'7.6'%20fill%3D'%23f4efe2'%2F%3E%3Ccircle%20cx%3D'8'%20cy%3D'8'%20r%3D'6.3'%20fill%3D'none'%20stroke%3D'%233d6fb5'%20stroke-width%3D'2.5'%20stroke-dasharray%3D'3.3%203.3'%2F%3E%3Ccircle%20cx%3D'8'%20cy%3D'8'%20r%3D'3.4'%20fill%3D'none'%20stroke%3D'%233d6fb5'%20stroke-opacity%3D'.75'%20stroke-width%3D'.9'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
.stk.d2::before{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2016%2016'%3E%3Ccircle%20cx%3D'8'%20cy%3D'8'%20r%3D'7.6'%20fill%3D'%23c8372d'%2F%3E%3Ccircle%20cx%3D'8'%20cy%3D'8'%20r%3D'6.3'%20fill%3D'none'%20stroke%3D'%23fff'%20stroke-width%3D'2.5'%20stroke-dasharray%3D'3.3%203.3'%2F%3E%3Ccircle%20cx%3D'8'%20cy%3D'8'%20r%3D'3.4'%20fill%3D'none'%20stroke%3D'%23fff'%20stroke-opacity%3D'.75'%20stroke-width%3D'.9'%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
.hand{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
.pc{width:52px;height:72px;border-radius:9px;background:var(--card);color:var(--card-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.05;box-shadow:var(--card-edge)}
.pc.deal{animation:deal .22s ease-out both}
.pc.deal+.pc.deal{animation-delay:.05s}
.pc.r{color:var(--card-red)}
.pc .ten{letter-spacing:-1.5px}
.pc small{font-size:22px;font-family:var(--sans);font-weight:500}
@keyframes deal{from{opacity:0;transform:translateY(-8px) rotate(-3deg)}to{opacity:1;transform:none}}
.badge{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--gold);border:1.5px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:8px;padding:1px 8px;margin-left:4px}
.sinfo{text-align:center;font-size:14.5px;color:var(--muted);margin-top:10px;line-height:1.4}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .opt{position:relative;justify-content:center;font-weight:700;font-size:17px;min-height:52px;padding:0 44px}
.acts.n3{grid-template-columns:repeat(3,1fr);gap:6px} .acts.n3 .opt{font-size:16px;padding:0 34px}
.acts .opt .k{position:absolute;left:12px;top:50%;margin-top:-13px}
.acts .opt.go{background:linear-gradient(180deg,var(--felt-2),var(--felt));border-color:var(--felt);color:var(--felt-ink)}
.acts .opt.go .k{background:transparent;border-color:rgba(255,255,255,.5);color:var(--felt-ink)}
.acts .opt.go.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.acts .opt.go.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.acts .opt.go.right .k,.acts .opt.go.wrong .k{border-color:currentColor;color:inherit}

/* Press feedback. Touch browsers apply :active late or not at all, so JS adds .press the moment a finger
   (or mouse) goes down and removes it on release or scroll; :active stays as a fallback.
   After an answer the picked option pops (or shakes when wrong) and both picked and right options get a mark. */
.opt,.btn,.chip,.seg button,.peek,.tile,.lrow,.prow,.nextrow,.iconbtn,.pill{touch-action:manipulation}
.btn,.chip,.seg button,.peek,.tile,.lrow,.prow,.iconbtn{transition:transform .12s ease,filter .12s,background .15s,border-color .15s}
.opt:not(:disabled):active,.opt.press:not(:disabled){transform:scale(.97);border-color:var(--felt-2);background:color-mix(in srgb,var(--felt-2) 14%,var(--surface-2));box-shadow:inset 0 0 0 1px var(--felt-2)}
.acts .opt.go:not(:disabled):active,.acts .opt.go.press:not(:disabled){background:linear-gradient(180deg,var(--felt),var(--felt-3));box-shadow:none}
.btn:not(:disabled):active,.btn.press:not(:disabled){transform:scale(.97);filter:brightness(.9)}
.peek:active,.peek.press,.chip:active,.chip.press,.seg button.press,.iconbtn.press,
.tile:active,.tile.press,.lrow:active,.lrow.press,.prow:active,.prow.press{transform:scale(.97);filter:brightness(.95)}
.opt.picked{animation:pick .4s cubic-bezier(.25,1.7,.5,1)}
.opt.wrong.picked{animation:shake .4s ease-out}
@keyframes pick{0%{transform:scale(.92)}100%{transform:none}}
@keyframes shake{0%{transform:scale(.95)}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}100%{transform:none}}
.opt.right::after,.opt.wrong::after{flex:none;margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;line-height:1;color:#fff}
.opt.right::after{content:"✓";background:var(--good-mark)}
.opt.wrong::after{content:"✗";background:var(--bad-mark)}
.opt.right.picked::after,.opt.wrong.picked::after{animation:mark .35s cubic-bezier(.25,1.7,.5,1) .05s both}
@keyframes mark{0%{transform:scale(0)}100%{transform:none}}
.acts .opt.right::after,.acts .opt.wrong::after{margin:0}
.acts .opt.right{color:var(--good)} .acts .opt.wrong{color:var(--bad)}
/* Touch screens: no keyboard hints */
@media (hover:none) and (pointer:coarse){.opt .k{display:none}.acts .opt,.acts.n3 .opt{padding:0 8px}.kbd-only{display:none!important}}
@media (max-width:440px){#v-ranges>.seg button{font-size:12.5px;padding:0 9px}}
/* Trainer: group row scrolls on phones; post-flop spots */
.gseg{overflow-x:auto;scrollbar-width:none}
.gseg::-webkit-scrollbar{display:none}
.gseg button{flex:1 0 auto}
.rvtag{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-size:10.5px;letter-spacing:.06em}
.ptable.post{height:206px}
.pboard{display:flex;gap:3px;margin-top:5px}
.pboard .pc.mini{width:29px;height:40px;font-size:15px}
.pfhud{text-align:center;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.pfhud b{color:var(--ink)}
.acts.pacts .opt{min-height:56px;font-size:16px}
.acts .opt .ol{display:flex;flex-direction:column;align-items:center;line-height:1.15;white-space:nowrap}
.acts .opt .ol small{font-size:12px;font-weight:600;opacity:.72;margin-top:2px;font-variant-numeric:tabular-nums}
.why .verd{display:inline;font-size:inherit}
.why .wnot,.why .wprin{display:block;margin-top:8px}
.why .wnot b{display:inline;font-size:inherit;color:inherit}
.why .wprin{color:var(--muted);font-style:italic}
.chk li[data-v="-"]::before{content:"✗";position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:50%;background:var(--bad-mark);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
#rt-chart .chk{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:7px;font-size:14px}
.pread{margin:4px 0 0;font-size:14.5px;line-height:1.5}
.fmeter{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fmeter div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.fmeter span{font-size:12px;color:var(--muted)}
.fmeter b{font-family:var(--serif);font-size:20px}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}
.zones span{text-align:center;padding:7px 4px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.zones span small{display:block;font-size:11px;font-weight:500}
.zones span.on{border-color:var(--felt-2);background:color-mix(in srgb,var(--felt-2) 14%,var(--surface));color:var(--ink)}
.qflow{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px;font-size:14px}
.qflow li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.qflow li b{flex:1;font-weight:600}
.qflow .yn{font-weight:800;font-size:12.5px;padding:2px 9px;border-radius:999px;color:#fff;background:var(--good-mark)}
.qflow li.n .yn{background:var(--bad-mark)}
.qflow li.end{border-color:var(--felt-2);background:color-mix(in srgb,var(--felt-2) 12%,var(--surface))}
.qflow li.end b{font-weight:800}


/* Range chart */
.rg{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;user-select:none}
.rc{font-size:8.5px;font-weight:600;text-align:center;padding:5px 0;border-radius:3px;line-height:1.1;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;background:var(--cell-fold);color:var(--cell-fold-ink)}
@media (min-width:400px){.rc{font-size:9.5px}}
.rc.in{background:var(--cell-r1);color:#fff}
.rc.in2{background:var(--cell-r2);color:#fff}
.rc.in3{background:var(--cell-r3);color:var(--cell-r3-ink)}
.rc.cl{background:var(--cell-c1);color:#fff}
.rc.cl2{background:var(--cell-c2);color:#fff}
.rc.cl3{background:var(--cell-c3);color:var(--cell-c3-ink)}
.rc.dyn{background:repeating-linear-gradient(135deg,var(--cell-fold) 0 4px,var(--cell-r3) 4px 8px);color:var(--cell-fold-ink)}
.rc.nr{background:transparent;color:color-mix(in srgb,var(--muted) 50%,transparent);box-shadow:inset 0 0 0 1px var(--line)}
.rc.cur{outline:2.5px solid var(--gold);outline-offset:0;position:relative;z-index:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 35%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:10px;align-items:center;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .tag{margin-left:auto}
.chartbox{margin-top:12px}
.chartbox .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.chartbox .ch b{font-family:var(--serif);font-size:17px}
.peek{min-height:44px;min-width:96px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:14px;font-weight:600}
.hidden-chart{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:12px}
.note{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.45}

/* Progress: this week, activity, what to work on next, the range trainer by group, math tiles.
   Chapters and quiz scores live on the Course tab only. */
.week{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.week b{display:block;font-family:var(--serif);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.week span{font-size:11.5px;color:var(--muted)}
.wdays{display:flex;gap:6px;margin-top:14px}
.wdays span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.wdays i{display:block;height:8px;border-radius:4px;background:var(--track);margin-bottom:4px}
.wdays i.on{background:var(--felt-2)}
.wdays span.now{color:var(--ink);font-weight:700}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--track)}
.heat i.l1,.heatkey i.l1{background:color-mix(in srgb,var(--felt-2) 30%,var(--track))} .heat i.l2,.heatkey i.l2{background:color-mix(in srgb,var(--felt-2) 55%,var(--track))}
.heat i.l3,.heatkey i.l3{background:color-mix(in srgb,var(--felt-2) 80%,var(--track))} .heat i.l4,.heatkey i.l4{background:var(--felt-2)}
.heat i.today{outline:1.5px solid var(--gold)} .heat i.fut{background:transparent}
.heatkey{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.heatkey i{width:10px;height:10px;border-radius:2px;display:inline-block}
.nextrow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;margin-top:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.nextrow .kind{flex:none;width:58px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.nextrow .what{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.3}
.nextrow .what small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.nextrow .go{flex:none;color:var(--muted);font-size:18px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:6px}
.gcard summary{display:grid;grid-template-columns:minmax(0,1fr) 80px 46px 14px;gap:10px;align-items:center;min-height:56px;padding:6px 12px;cursor:pointer;list-style:none}
.gcard summary::-webkit-details-marker{display:none}
.gcard summary::after{content:"›";color:var(--muted);font-size:18px;transition:transform .15s}
.gcard[open] summary::after{transform:rotate(90deg)}
.gcard .pn{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .pn small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.gcard .pv{font-family:var(--serif);text-align:right;font-variant-numeric:tabular-nums}
.gcard .glist{padding:0 8px 8px}
.gcard .glist .prow{margin-top:4px;background:var(--surface-2)}
.gcard .unplayed{font-size:12.5px;color:var(--muted);padding:8px 4px 2px;line-height:1.6}
.gcard .unplayed a{color:var(--accent);margin-right:10px;white-space:nowrap}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 80px 46px;gap:10px;align-items:center;width:100%;min-height:50px;padding:6px 12px;margin-top:6px;font-size:14.5px;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none}
.prow .pn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pn small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.prow .pv{font-family:var(--serif);text-align:right;font-variant-numeric:tabular-nums}

/* Settings */
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.srow{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow>div{flex:1;min-width:0}
.srow b{display:block;font-weight:600;font-size:15px}
.srow small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.srow .seg{flex:none}
.srow .seg button{min-height:38px;font-size:13px;padding:0 12px}
.danger{color:var(--bad)!important;border-color:var(--bad)!important}
.ver{font-size:13px;color:var(--muted);margin-top:18px;text-align:center;line-height:1.6}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:359px){.top h1{font-size:19px}.tile b{font-size:20px}.week b{font-size:20px}.qt{font-size:18.5px}}
@media (hover:hover){
  .btn:hover:not(:disabled){filter:brightness(1.07)}
  .opt:hover:not(:disabled),.chip:hover,.lrow:hover,.tile:hover,.prow:hover,.peek:hover{border-color:var(--felt-2)}
}
/* Wide screen: navigation becomes a rail on the left; lessons get a contents sidebar; drills go two columns. */
@media (min-width:960px){
  :root{--nav-h:0px}
  body{padding-left:228px}
  #app{max-width:1060px;padding:24px 36px 48px}
  .top{margin-bottom:6px} .top h1{font-size:28px} .top .brand .logo{display:none} .top .setbtn{display:none}
  .nav{right:auto;top:0;bottom:0;width:228px;display:flex;flex-direction:column;gap:4px;padding:22px 12px 16px;border-top:0;border-right:1px solid var(--line)}
  .nav .rail-brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-family:var(--sans);font-weight:700;font-size:18px;line-height:1.15}
  .nav .rail-brand svg{width:38px;height:38px;flex:none}
  .nav .rail-brand small{display:block;font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted)}
  .nav .rail-set{display:flex;margin-top:auto}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;min-height:46px;padding:0 14px;border-radius:12px}
  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button[aria-current="page"]{background:var(--surface-2)}
  .nav button[aria-current="page"]::before{top:24%;bottom:24%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .actions{position:static;margin:16px 0 0;padding:0;background:none}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
  .home-grid .tiles{margin-top:0}
  .chapters{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
  .lesson{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
  .toc{display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}
  .toc button{border:0;background:none;text-align:left;padding:8px 12px;border-radius:10px;color:var(--muted);font-size:14px;min-height:38px}
  .toc button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
  .toc button.seen::after{content:" ✓";color:var(--accent)}
  .toc hr{border:0;border-top:1px solid var(--line);margin:8px 0}
  .lesson-main{max-width:720px}
  .lhead h2{font-size:34px}
  .drill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:24px;align-items:start}
  .drill>.left{position:sticky;top:20px}
  .drill .chartbox{margin-top:8px}
  .ptable{height:230px}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* Grinder's Manual Trainer. One file, no build step, no dependencies.
   Everything above the UI marker is plain data and pure functions (the tests load it in Node). */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>(Math.round(x*1000)/10).toFixed(1).replace(/\.0$/,'')+'%';

/* ---------- ranges (from the book's charts) ---------- */
const R="AKQJT98765432";
function allHands(){const o=[];for(let i=0;i<13;i++)for(let j=0;j<13;j++)o.push(cellName(i,j));return o;}
function cellName(i,j){if(i===j)return R[i]+R[j];return j>i?R[i]+R[j]+'s':R[j]+R[i]+'o';}
const combos=h=>h.length===2?6:(h[2]==='s'?4:12);
const L=s=>s.trim().split(/\s+/);
const RANGES={
  UTG:L("AA KK QQ JJ TT 99 88 77 AKs AQs AJs ATs KQs KJs KTs QJs QTs JTs T9s AKo AQo AJo KQo"),
  HJ:L("AA KK QQ JJ TT 99 88 77 66 AKs AQs AJs ATs A9s A8s A7s A6s A5s A4s A3s A2s KQs KJs KTs QJs QTs JTs T9s 98s AKo AQo AJo ATo KQo KJo"),
  CO:L("AA KK QQ JJ TT 99 88 77 66 55 44 33 22 AKs AQs AJs ATs A9s A8s A7s A6s A5s A4s A3s A2s KQs KJs KTs K9s K8s QJs QTs Q9s JTs J9s T9s T8s 98s 97s 87s 76s 65s AKo AQo AJo ATo A9o KQo KJo KTo QJo QTo JTo T9o"),
  BU:L("AA KK QQ JJ TT 99 88 77 66 55 44 33 22 AKs AQs AJs ATs A9s A8s A7s A6s A5s A4s A3s A2s KQs KJs KTs K9s K8s K7s K6s K5s K4s K3s K2s QJs QTs Q9s Q8s Q7s Q6s Q5s Q4s Q3s Q2s JTs J9s J8s J7s J6s T9s T8s T7s T6s 98s 97s 96s 87s 86s 76s 75s 65s 64s 54s 53s 43s 32s AKo AQo AJo ATo A9o A8o A7o A6o A5o A4o A3o A2o KQo KJo KTo K9o K8o QJo QTo Q9o Q8o JTo J9o J8o T9o T8o 98o 87o"),
  SB:L("AA KK QQ JJ TT 99 88 77 66 55 44 33 22 AKs AQs AJs ATs A9s A8s A7s A6s A5s A4s A3s A2s KQs KJs KTs K9s K8s K7s K6s K5s K4s K3s K2s QJs QTs Q9s Q8s Q7s JTs J9s J8s J7s T9s T8s T7s 98s 97s 87s 86s 76s 75s 65s 54s 43s AKo AQo AJo ATo A9o A8o A7o A6o A5o A4o A3o A2o KQo KJo KTo K9o QJo QTo Q9o JTo J9o T9o T8o 98o 87o"),
};
const CALLS={
  'UTG>HJ':L("AA KK QQ JJ TT 99 88 77 66 AKs AQs AJs KQs AKo AQo"),
  'UTG>CO':L("QJs 55"),
  'UTG>BU':L("ATs KJs JTs T9s 44 33 22"),
  'HJ>CO':L("AA KK QQ JJ TT 99 88 77 66 AKs AQs AJs ATs KQs KJs QJs JTs T9s AKo AQo AJo KQo"),
  'HJ>BU':L("QTs 98s 55 44 33 22"),
  'CO>BU':L("AA KK QQ JJ TT 99 88 77 66 AKs AQs AJs ATs A9s A8s KQs KJs KTs QJs QTs JTs T9s 98s 87s AKo AQo AJo ATo KQo KJo"),
  'BB>UTG':L("AA KK QQ JJ TT 99 88 77 66 AKs AQs AJs KQs AKo AQo"),
  'BB>HJ':L("ATs KJs QJs JTs T9s AJo KQo"),
  'BB>CO':L("A9s KTs QTs 98s ATo KJo"),
};
// Drill modes: action label, set of "in" hands, info
const MODES={
  'open-UTG':{grp:'Open',label:'UTG open',seat:'UTG',vill:null,act:'Raise 3x',set:RANGES.UTG,info:'Folded to you UTG. Default range, no fish to hunt, no light 3-bettors.'},
  'open-HJ':{grp:'Open',label:'HJ open',seat:'HJ',vill:null,act:'Raise 3x',set:RANGES.HJ,info:'Folded to you in the HJ. Default table.'},

  'open-BU':{grp:'Open',label:'BU open',seat:'BU',vill:null,act:'Raise 2x',set:RANGES.BU,info:'Folded to you on the BU with no reads on the blinds.'},

  'call-HJvUTG':{grp:'Flat',label:'HJ vs UTG',seat:'HJ',vill:'UTG',act:'Call',set:CALLS['UTG>HJ'],info:'UTG opens 3x. You are in the HJ.'},
  'call-COvUTG':{grp:'Flat',label:'CO vs UTG',seat:'CO',vill:'UTG',act:'Call',set:[...CALLS['UTG>HJ'],...CALLS['UTG>CO']],info:'UTG opens 3x, folds to you in the CO.'},

  'call-COvHJ':{grp:'Flat',label:'CO vs HJ',seat:'CO',vill:'HJ',act:'Call',set:CALLS['HJ>CO'],info:'HJ opens 3x. You are in the CO.'},
  'call-BUvHJ':{grp:'Flat',label:'BU vs HJ',seat:'BU',vill:'HJ',act:'Call',set:[...CALLS['HJ>CO'],...CALLS['HJ>BU']],info:'HJ opens 3x, folds to you on the BU.'},
  'call-BUvCO':{grp:'Flat',label:'BU vs CO',seat:'BU',vill:'CO',act:'Call',set:CALLS['CO>BU'],info:'CO opens 3x. You are on the BU.'},

  'bb-CO':{grp:'BB defend',label:'BB vs CO',seat:'BB',vill:'CO',act:'Call',set:[...CALLS['BB>UTG'],...CALLS['BB>HJ'],...CALLS['BB>CO']],info:'CO opens 3x, folds to you in the BB.'},
};
const rangePct=set=>set.reduce((a,h)=>a+combos(h),0)/1326;

/* ---------- more charts from the book (Ch. 2, 6, 10, 11), read cell by cell from its figures ---------- */
/* Each spot: opts are the answers ([key, label]); tiers colour the chart and give each hand its answer: [key, css, legend, hands].
   scene: chips in front of each seat (bets), what they did (did), hero chips (me); after = hero opened and now faces a 3-bet. */
const XMODES={
  'open-UTG-fish':{grp:'Open',label:'UTG · Fish',fig:6,seat:'UTG',info:'Folded to you UTG. The tight table has one big Fish in the BB who rarely folds.',opts:[['y','Raise 3x'],['f','Fold']],base:'UTG',add:L("66 55 44 33 22 A9s A8s A7s A6s A5s A4s A3s A2s 98s 87s ATo KJo")},
  'open-HJ-fish':{grp:'Open',label:'HJ · Fish/Nit',fig:8,seat:'HJ',info:'Folded to you in the HJ. A Fish or a Nit sits in the blinds, and nobody behind 3-bets light.',opts:[['y','Raise 3x'],['f','Fold']],base:'HJ',add:L("55 44 33 22 K9s Q9s J9s T8s 87s 76s KTo QJo")},
  'open-HJ-def':{grp:'Open',label:'HJ · 3-bettor',fig:9,seat:'HJ',info:'Folded to you in the HJ. An aggressive Reg behind you 3-bets light.',opts:[['y','Raise 3x'],['f','Fold']],base:'HJ',drop:L("66 A8s A7s A6s 98s ATo KJo")},
  'open-CO-fish':{grp:'Open',label:'CO · Fish/Nit',fig:11,seat:'CO',info:'Folded to you in the CO. A Fish or a Nit sits in the blinds.',opts:[['y','Raise 3x'],['f','Fold']],base:'CO',add:L("K7s K6s K5s K4s K3s K2s Q8s J8s 86s 75s A8o A7o A6o A5o A4o A3o A2o K9o Q9o J9o")},
  'open-CO-nit':{grp:'Open',label:'CO · BU Nit',fig:12,seat:'CO',info:'Folded to you in the CO. The BU is a Nit, so the CO plays like a second button.',opts:[['y','Raise 2x'],['f','Fold']],base:'CO',add:L("K7s K6s K5s K4s K3s K2s Q8s Q7s Q6s J8s J7s T7s 86s 75s 64s 54s 43s A8o A7o A6o A5o A4o A3o A2o K9o K8o K7o Q9o Q8o Q7o J9o J8o T8o 98o")},
  'open-CO-def':{grp:'Open',label:'CO · 3-bettor',fig:13,seat:'CO',info:'Folded to you in the CO. A light 3-bettor sits behind you.',opts:[['y','Raise 2.5x'],['f','Fold']],base:'CO',drop:L("55 44 33 22 K8s T8s 97s 76s 65s A9o KTo QTo JTo T9o")},
  'call-SBvUTG':{grp:'Flat',label:'SB vs UTG',fig:33,seat:'SB',info:'UTG opens 3x, folds to you in the SB.',opts:[['c','Call'],['f','Fold']],tiers:[['c','in','Call vs UTG',"AA KK QQ JJ TT 99 88 AKs AQs AKo"]],scene:{bets:{UTG:3},did:{UTG:'Raise 3'}}},
  'call-SBvHJ':{grp:'Flat',label:'SB vs HJ',fig:33,seat:'SB',info:'HJ opens 3x, folds to you in the SB.',opts:[['c','Call'],['f','Fold']],tiers:[['c','in','Call vs UTG',"AA KK QQ JJ TT 99 88 AKs AQs AKo"],['c','t2','+ vs HJ',"AJs KQs AQo"]],scene:{bets:{HJ:3},did:{HJ:'Raise 3'}}},

/* Every spot in one shape: opts = the answers [key, label]; tiers = [key, css, legend, hands] colour the chart and
   give each hand its answer (first tier wins, anything else is a fold); ans = hand -> key; pool = the only hands dealt
   (vs-3-bet spots deal only hands from your opening range). The original Ch. 2 and Ch. 6 spots are two-answer spots. */
(function(){
  const callTiers=(k,m)=>{
    let t;
    if(k.startsWith('bb-'))t=[['Call vs UTG',CALLS['BB>UTG']],['+ vs HJ',CALLS['BB>HJ']],['+ vs CO',CALLS['BB>CO']]];
    else if(m.vill==='UTG')t=[['Call from HJ',CALLS['UTG>HJ']],['+ from CO',CALLS['UTG>CO']],['+ from BU',CALLS['UTG>BU']]];
    else if(m.vill==='HJ')t=[['Call from CO',CALLS['HJ>CO']],['+ from BU',CALLS['HJ>BU']]];
    else t=[['Call from BU',CALLS['CO>BU']]];
    return t.map(([lab,hs],i)=>['y',['in','t2','t3'][i],lab,hs.filter(h=>m.set.includes(h))]).filter(x=>x[3].length);
  };
  for(const [k,m] of Object.entries(MODES)){
    if(m.base){
      const b=RANGES[m.base];m.act=m.opts[0][1];
      if(m.add){m.set=[...b,...m.add];m.tiers=[['y','in','Open (default)',b],['y','t2','Open here (dynamic)',m.add]];}
      else{m.set=b.filter(h=>!m.drop.includes(h));m.tiers=[['y','in','Open',m.set],['f','dyn','Fold here (dynamic)',m.drop]];}
    }else if(m.tiers){
      m.tiers=m.tiers.map(([a,c,l,hs])=>[a,c,l,typeof hs==='string'?L(hs):hs]);
      m.set=m.tiers.filter(t=>t[0]!=='f').flatMap(t=>t[3]);m.act=m.opts[0][1];
    }else{
      m.opts=[['y',m.act],['f','Fold']];
      m.tiers=k.startsWith('open-')?[['y','in',m.act,m.set]]:callTiers(k,m);
    }
    // One colour family per action in every chart: navy = raise (open, 3-bet, squeeze, 4-bet, shove), teal = call,
    // grey = fold. A chart's second and third tiers of the same action get lighter shades.
    const fam=key=>key==='f'?'f':/^call/i.test((m.opts.find(o=>o[0]===key)||['',''])[1])?'c':'r',used={r:0,c:0};
    m.tiers=m.tiers.map(([a,c,l,hs])=>{const f=fam(a);if(f==='f')return [a,c==='dyn'?'dyn':'',l,hs];
      const i=Math.min(used[f]++,2);return [a,(f==='r'?['in','in2','in3']:['cl','cl2','cl3'])[i],l,hs];});
    m.ans={};m.tiers.forEach(t=>t[3].forEach(h=>{if(!(h in m.ans))m.ans[h]=t[0];}));
    m.pool=m.pool?Object.keys(m.ans):null;
  }
})();
function answerOf(m,h){return MODES[m].ans[h]||'f';}
function tierOf(m,h){return MODES[m].tiers.find(t=>t[3].includes(h))||null;}

const P=(c,t)=>`<span class="stat-pill" style="background:var(--hud-${c})">${t}</span>`;
const GB=(g,b,hg='Good factors',hb='Bad factors')=>`<div class="gb"><div class="h g">${hg}</div><div class="h b">${hb}</div>${g.map((x,i)=>`<div class="g">${x}</div><div class="b">${b[i]||''}</div>`).join('')}</div>`;
const KEYBOX=(t,b)=>`<div class="key"><b>${t}</b>${b}</div>`;
/* A flop drawn as small cards: FL('K♣ 7♦ 2♥'). */
const FL=s=>`<span class="flop" role="img" aria-label="${s}">${s.split(' ').map(c=>{const r=c.slice(0,-1),u=c.slice(-1);return `<span class="pc mini${u==='♥'||u==='♦'?' r':''}">${r==='T'?'10':r}<small>${u}</small></span>`;}).join('')}</span>`;

const LESSONS=[
{id:'ev',ch:'1',title:'EV: the currency of poker',mins:6,sum:'Why results lie in the short run and how to judge decisions instead.',
blocks:[
['Judge decisions, not results',`<p>A single hand can win or lose money for reasons you don't control. <b>Expected value (EV)</b> is what a decision earns on average over many repetitions, so it's the only stable way to score a play. A raise that's worth +$15 on average is still a good raise on the night it loses $100.</p>${KEYBOX('Core idea','Every recommendation in the manual (ranges, sizings, adjustments) has one goal: pick the line with the <i>highest</i> EV, not just any +EV line.')}`],
['EV vs All-in EV',`<p><b>All-in EV</b> only measures what you'd expect to win in hands that reach an all-in showdown. It ignores the many pots won or lost without showdown, so it's a narrow window on how lucky you've been. Don't obsess over it.</p>`],
['Bottom-up learning',`<p>The book teaches a small set of factors for each common spot and builds on them chapter by chapter. The goal is a thought process that considers only what moves EV in that spot, and ignores what doesn't. Read the chapters in order: later chapters assume the earlier factors.</p>`],
['The other two games',`<ul><li><b>Mental game</b> – tilt is a natural reaction to variance, but it costs EV. Work on it separately (the author recommends Jared Tendler's <i>The Mental Game of Poker</i>).</li><li><b>Practical game</b> – study habits, table selection, session length, bankroll. For beginners the suggested split is roughly <b>50% study, 50% play</b>.</li></ul>`],
],
quiz:[
['You make a +$15 EV raise and lose $100 in the hand. How should you rate the decision?',['A mistake, since it lost money','A good decision; the result is variance','Neutral, since one hand means nothing either way','Only good if All-in EV agrees'],1,'EV is what the action earns on average. The $100 loss is short-term luck.'],
['What does All-in EV leave out?',['Rake','Every pot decided without an all-in showdown','Pre-flop decisions','Bad beats'],1,'It only measures equity in all-in showdowns, so it says nothing about the many non-showdown pots.'],
['Recommended study to play ratio for a beginner?',['10:90','25:75','About 50:50','90:10'],2,'The manual suggests roughly half study, half play while learning.'],
['Which goal does every piece of advice in the manual serve?',['Winning the most pots','Minimising variance','Maximising EV','Avoiding tough spots'],2,'EV is the currency. Pot count and variance are not the target.'],
]},
{id:'open',ch:'2',title:'Opening the pot',mins:14,sum:'Default ranges by seat, open sizes, and the RFE maths behind stealing.',tool:'steal',
blocks:[
['Positions are relative to the button',`<p>UTG, HJ (sometimes called MP), CO, BU, SB, BB. At a short-handed table, name your seat by its distance from the BU: 4-handed, the first player to act is the <b>CO</b>, not UTG.</p>`],
['What makes a hand worth opening',`<p>Three attributes, in order of importance at 100bb:</p><ol><li><b>Good Pair Potential (GPP)</b> – flops strong one-pair hands often. Matters even more when stacks are short.</li><li><b>Versatility (V)</b> – flops draws and different hand types. Matters more as stacks get deeper.</li><li><b>Nut Potential (NP)</b> – makes the nuts sometimes. Grows in value as stacks get deeper.</li></ol><p>That's why T9s beats ATo as a UTG open even though ATo is a 67% all-in favourite: T9s flops unique, versatile hands; ATo flops pairs that are often dominated by AJ/AQ.</p>`],
['Seat by seat',`<div class="tbl"><table><tr><th>Seat</th><th>Default range</th><th>Size</th><th>Main reasons</th></tr>
<tr><td>UTG</td><td class="num">${'~'+pct(rangePct(RANGES.UTG))}</td><td class="num">3x</td><td>Value, thin the field, sometimes win blinds, target weak players</td></tr>
<tr><td>HJ</td><td class="num">${'~'+pct(rangePct(RANGES.HJ))}</td><td class="num">3x</td><td>Value, thin the field, semi-steals</td></tr>
<tr><td>CO</td><td class="num">${'~'+pct(rangePct(RANGES.CO))}</td><td class="num">2.5x</td><td>Value, semi-steals, steals</td></tr>
<tr><td>BU</td><td class="num">${'~'+pct(rangePct(RANGES.BU))}</td><td class="num">2x vs regs</td><td>Fold equity is huge, always in position</td></tr>
<tr><td>SB</td><td class="num">${'~'+pct(rangePct(RANGES.SB))}</td><td class="num">2.5x</td><td>One player to get through, but you're OOP</td></tr></table></div>
<p>Practise these in the <a href="#ranges/open-UTG">Trainer</a>.</p>`],
['Sizing adjustments',`<ul><li>Fishy tables: go to <b>4x</b> (or 5x on very loose tables) from early seats to punish loose calls.</li><li>Aggressive 3-bettors behind: shrink to <b>2.5x</b> UTG so folding to a 3-bet costs less.</li><li>CO with a Nit on the BU: treat the CO as a pseudo-button and open wide with BU sizing.</li><li>BU/CO vs Fish in the blinds: <b>3x</b> or bigger. You want a bigger pot against fit-or-fold or call-too-much players.</li><li>Don't size by hand strength (3x AJo, 4x KK) against aware regs; it's an obvious tell.</li></ul>`],
['Dynamic ranges',`<p>The book draws these adjustments as charts, now in the trainer: <a href="#ranges/open-UTG-fish">UTG fish hunting</a>, <a href="#ranges/open-HJ-fish">HJ</a> and <a href="#ranges/open-CO-fish">CO hunting</a>, <a href="#ranges/open-CO-nit">CO with a Nit on the BU</a>, and the defensive <a href="#ranges/open-HJ-def">HJ</a> and <a href="#ranges/open-CO-def">CO</a> ranges.</p><p>Widen when there's a <b>Fish</b> in the blinds (more implied odds, more value) or a <b>Nit</b> (more fold equity). Tighten when light <b>3-bettors</b> sit behind you: opening then folding to a 3-bet is expensive, and a tighter range is easier to defend.</p>`],
['Required fold equity (RFE)',`<p>How often a steal must win immediately to break even if you'd give up every time it fails:</p><p class="formula">RFE = Risk / (Risk + Potential Gain)</p><p>BU min-raise: risk 2, gain 1.5 (blinds) → 2/3.5 = <b>57%</b>. SB to 2.5x: risk 2 (your 0.5 is already in), gain 1.5 → also <b>57%</b>.</p><p>Fold equity vs two players multiplies: SB folds 76% × BB folds 83% = <b>63%</b> combined.</p>${KEYBOX('Rule of thumb','Because you also win post-flop when called, you can open a bit <i>below</i> RFE. On the BU, being within <b>5–10%</b> is usually fine with neutral factors. From the SB (out of position) use <b>3–7%</b>.')}`],
['Steal factors',GB(['Hand plays well post-flop','Blinds call rather than 3-bet','Blinds are fit-or-fold','Blinds are unaware','You have a skill edge'],['Hand plays badly post-flop','Blinds 3-bet light','Blinds fight back post-flop','Blinds are aware and will adjust','Blinds are tough'])+`<p><b>Vacuum EV vs long-term EV:</b> opening 82o against two aware regs might be +EV today, but opening ~100% invites them to adjust, which costs you future fold equity with your better hands. Against Nits who never adjust, the two are the same thing.</p>`],
],
quiz:[
['You min-raise to 2bb on the BU. What is your RFE?',['33%','43%','57%','67%'],2,'Risk 2 to win 1.5: 2 / (2 + 1.5) ≈ 57%.'],
['SB folds 80% to steals, BB folds 64%. Combined fold equity?',['51%','64%','72%','144%'],0,'Multiply independent probabilities: 0.80 × 0.64 ≈ 51%.'],
['Why does T9s make a better UTG open than ATo despite being an all-in underdog?',['It has more Good Pair Potential','Its pairs are less often dominated, and it has more versatility and nut potential','It wins more often all-in','It is easier to fold'],1,'Ranges are built on post-flop EV at 100bb, not all-in equity.'],
['A light 3-bettor sits on the BU. How should you adjust your CO range?',['Open wider to fight back','Tighten, dropping the weakest steals','Switch to limping','Keep it the same'],1,'Opening then folding to frequent 3-bets bleeds EV; a tighter range is easier to defend.'],
['Default open size on the BU vs regs and nits?',['2x','2.5x','3x','4x'],0,'Smaller sizing lowers RFE, and fold equity is highest on the BU.'],
['Which attribute is MOST important for an opening hand at 100bb?',['Nut potential','Suitedness','Good pair potential','Versatility'],2,'Strong one-pair hands come up often and win a lot, so GPP comes first.'],
]},
{id:'limp',ch:'3',title:'When someone limps',mins:12,sum:'The ISO triangle, the four Fish types, and how big to isolate.',tool:'iso',
blocks:[
['Why open-limping is bad',`<ul><li>Gives up pre-flop fold equity.</li><li>Takes no initiative, so someone else gets to c-bet.</li><li>Invites multiway pots, which devalues your hands.</li><li>Doesn't build the pot with strong hands.</li></ul><p>We exploit limpers by <b>isolating</b> (ISO raising) to get heads-up with the weak player, ideally in position.</p>`],
['The ISO triangle',`<p>Three factors decide whether to ISO. The more of one you have, the less you need of the others.</p><ul><li><b>Frequent strength</b> – how often the hand flops good pairs and good draws. It's the only <i>absolute</i> factor: enough of it justifies an ISO alone (AA, AK, AQ, TT…).</li><li><b>Fold equity</b> – fewer limpers, fewer loose players behind, and fit-or-fold limpers all add fold equity.</li><li><b>Position</b> – the least influential, but often the tie-breaker. IP adds c-bet fold equity, pot control and information.</li></ul>${KEYBOX('Read it like this','Triangle mostly full → ISO. Mostly empty → limp behind or fold.')}`],
['The four Fish types',`<div class="tbl"><table><tr><th>Type</th><th>Looks like</th><th>Plan</th></tr>
<tr><td><b>A · Fit-or-fold</b></td><td>VPIP/PFR like 40/6, folds to c-bets 55–75%</td><td>ISO wide, c-bet a lot. “Build it up, take it down.”</td></tr>
<tr><td><b>B · Station</b></td><td>90/15, 65/3, folds to c-bets ≤45%</td><td>ISO tighter (more frequent strength), then value bet hard</td></tr>
<tr><td><b>C · Aggro</b></td><td>57/38, 44/23, raises c-bets, bluffs air</td><td>Even less fold equity. Need hands with showdown value</td></tr>
<tr><td><b>D · Whale</b></td><td>95/80, 71/4, huge errors</td><td>The exception: ISO very wide and play straightforward value</td></tr></table></div>`],
['Limping behind',`<p>If an ISO is out, compare limping (or completing the SB) with folding using:</p><ol><li><b>Pot odds</b> – completing 0.5bb into 2.5bb is 5:1.</li><li><b>Implied odds</b> – can you flop something big, and will someone pay you?</li><li><b>Post-flop steal potential</b> – fit-or-fold opponents leave pots you can pick up.</li></ol><p>Small pairs and suited connectors often like limping behind multiway; you play them fit-or-fold.</p>`],
['ISO sizing rule',`<p class="formula">ISO = 3bb + 1bb per limper (+1bb if out of position to the limper)</p><ul><li>Loose callers behind: size up, as if there were an extra limper.</li><li>Aggressive 3-bettors behind: size down about 1bb.</li></ul>`],
['The limp flowchart',`<p>The whole chapter fits in one decision chain.</p><ol><li><b>Check the ISO triangle</b>: frequent strength, fold equity, position. Good enough → <b>isolate</b>.</li><li>If not, check the <b>limping triangle</b>: pot odds, implied odds and flop steal potential. Good enough → <b>limp behind</b> (or complete from the SB).</li><li>Neither → <b>fold</b>.</li></ol>${KEYBOX('Fold equity and limpers','Every extra limper cuts fold equity, because all of them must fold. With two or three limpers in, an ISO needs much more frequent strength than with one.')}`],
],
quiz:[
['Which ISO triangle factor can justify an ISO on its own?',['Fold equity','Position','Frequent strength','Number of limpers'],2,'Frequent strength is the absolute factor. AA never needs help from the other two.'],
['One limper, you are in position, standard table. ISO size?',['3bb','4bb','5bb','6bb'],1,'3bb + 1 for the limper. No OOP bonus.'],
['Two limpers, you are in the SB (out of position to them). ISO size?',['4bb','5bb','6bb','7bb'],2,'3 + 2 limpers + 1 for being OOP = 6bb.'],
['A limper is 70/4 and folds to c-bets 35%. Best adjustment?',['ISO wider to exploit','ISO a tighter, high-frequent-strength range and value bet','Never ISO this player','Limp behind with everything'],1,'That is a Station Fish: little fold equity, so you need hands that win at showdown.'],
['Against a Whale the usual triangle logic…',['applies strictly','is relaxed: ISO very wide since the errors are huge','means you should only ISO premiums','says to always limp'],1,'Whales are the exception. Getting heads-up with them is worth bloating some pots.'],
['The ISO triangle looks poor for your hand. What do you check next?',['Nothing: fold','The limping triangle: pot odds, implied odds, flop steal potential','Whether you can 3-bet','The limper’s VPIP only'],1,'If isolating is not good enough, limping behind can still beat folding when the limping triangle is good.'],
]},
{id:'cbet',ch:'4',title:'C-betting',mins:25,sum:'When a light c-bet is right, factor by factor, how big to make it, and when checking is better.',tool:'rfe',toolAt:'Is it the best line?',
blocks:[
['Why c-betting matters',`<p>You raise pre-flop, get called, and see a flop as the aggressor: this is the most common post-flop spot in 6-max. A small mistake in it repeats hundreds of times a week, so it is worth more study than any rare big pot.</p><p>How well your c-bets work also decides how wide you can open and isolate. Ranges in Ch. 2 and 3 assume you play the flop well.</p>${KEYBOX('Light vs value','A <b>value c-bet</b> is made with a hand that worse hands will call (Ch. 5). A <b>light c-bet</b> is made with anything weaker: air, a draw or a weak pair. Most hands miss most flops, so light c-bets are far more common, and they are this chapter.')}<p>Whether a light c-bet is right depends mostly on <b>fold equity</b>, which breaks down into factors, plus a few things beyond fold equity. Check them in this order:</p>`+GB(['Dry texture','Good equity when called','Villain folds a lot','No SDV or vulnerable SDV','Heads-up','Good turn/river prospects','In position'],['Wet texture','Poor equity when called','Villain doesn\'t fold','Stable (invulnerable) SDV','Multiway','No turn/river prospects','Out of position'])],
['Factor 1: board texture',`<p>The more ways a flop can connect with Villain's range, the less often he folds. Texture is the first thing to read.</p><div class="ttypes">
<div><b>1 · Bone dry</b>${FL('K♣ 7♦ 2♥')}${FL('7♠ 7♣ 3♦')}<span>Hard to hit: few draws, few two pairs (nobody plays K7, K2, 72). C-bet with almost any hand, even against players who don't like folding.</span></div>
<div><b>2 · Dry</b>${FL('Q♦ 9♥ 4♣')}${FL('7♠ 6♥ 2♦')}<span>A few more two pairs and straight draws, but still missed by most ranges. Good c-bets when the other factors are reasonable.</span></div>
<div><b>3 · Semi-wet</b>${FL('J♠ 8♠ 6♦')}${FL('A♣ Q♥ 3♥')}<span>Flush draws, more straight draws, more strong pairs. The other factors need to help more.</span></div>
<div><b>4 · Wet</b>${FL('9♥ 8♥ 6♦')}${FL('K♣ J♣ 9♦')}<span>Easy to connect with, often strongly. Light c-bets need several other factors in their favour.</span></div>
<div><b>5 · Soaking</b>${FL('Q♦ J♠ T♠')}${FL('J♣ 9♣ 7♣')}<span>Villain rarely misses. With little or no equity, checking is close to mandatory.</span></div></div>${KEYBOX('Rule of thumb','Type 1 boards can be c-bet with the worst equity. Type 5 boards should almost never be c-bet without good equity to make up for the missing fold equity.')}`],
['Factor 2: equity when called',`<p>Equity can matter even more than texture: with enough of it, a c-bet is right on any board. Equity helps twice:</p><ol><li><b>It lowers the folds you need.</b> When Villain calls, you still win some of the time by improving.</li><li><b>Implied odds.</b> When you hit, you win future bets too, not just the current pot.</li></ol>${KEYBOX('Count outs against his calling range','Your outs only matter when Villain calls. Estimate them against the bulk of the hands that call, usually a pair, not his whole range.')}<p>Example: KJ on ${FL('Q♦ T♣ 4♥')}. Against top pair you have 8 straight outs (any A or 9) and usually 3 kings: call it <b>11 outs, about 42%</b>. That is a clear c-bet, and it builds a pot you will often win big.</p><div class="tbl"><table><tr><th class="num">Outs</th><th>Typical hand</th><th class="num">Equity</th></tr><tr><td class="num">2</td><td>Underpair, or a pair hoping to improve</td><td class="num">8%</td></tr><tr><td class="num">4</td><td>Gutshot</td><td class="num">16%</td></tr><tr><td class="num">6</td><td>Two overcards</td><td class="num">24%</td></tr><tr><td class="num">8</td><td>Open-ended straight draw</td><td class="num">31%</td></tr><tr><td class="num">9</td><td>Flush draw</td><td class="num">35%</td></tr><tr><td class="num">10</td><td>Two overcards + gutshot</td><td class="num">38%</td></tr><tr><td class="num">12</td><td>Flush draw + overcard</td><td class="num">45%</td></tr><tr><td class="num">15</td><td>Flush draw + open-ender</td><td class="num">54%</td></tr></table></div><p>Equity is from the flop to the river. Shortcut: equity ≈ outs × 4 (a little high above 9 outs). Memorise the table rather than calculating at the table.</p><p><b>Same flop, two hands.</b> On ${FL('J♥ T♣ 4♦')}, 77 is ahead of AQ right now, but against a calling range of pairs 77 has 2 dirty outs (under 8%) while AQ has 10 outs, 4 of them to the nuts (about 38%). AQ is the much better c-bet: what matters is equity <i>when called</i>, not who is ahead now.</p>`],
['Factor 3: player type',`<p>Use the Fish types from Ch. 3 and the ${P('red','Fold to F Cbet')} stat. Then ask how his <i>pre-flop range</i> meets this flop.</p><ul><li><b>Wide ranges miss more.</b> A loose player has more junk, so more air and weak pairs on most flops. All else equal, c-bet more against wide ranges.</li><li><b>The fish flop fallacy.</b> “He plays 64s, so he hits 5-3-2.” He can, but his range has far more high cards than low ones, fewer pocket pairs than a Reg's, and it is always easier to flop nothing than something. Low boards miss Fish badly.</li><li><b>Where ranges are strong.</b> A Nit calling on the BU has something like 77-QQ, AK, AQ and suited broadways. On ${FL('K♥ Q♣ J♦')} that range hits hard: check and fold most of your air. On dry ace-high or king-high boards his pocket pairs still fold, so keep c-betting there.</li><li><b>The Aggro Fish.</b> He raises c-bets with any piece and some air (${P('pink','Raise F Cbet')}). Light c-bets lose their fold equity. Don't fight insane aggression with terrible equity: check back weak draws for a free card and wait for a hand to take his stack with.</li></ul>`],
['Factor 4: showdown value',`<p>Showdown value (SDV) is how often your hand wins <i>unimproved</i>. Draws have equity but no SDV. Unlike the other factors, more SDV makes a light c-bet <b>less</b> attractive, until the hand becomes a value bet.</p><div class="spec"><span>No SDV<small>can't win unimproved</small></span><span>Vulnerable SDV<small>wins now, gets weaker</small></span><span>Stable SDV<small>wins now, rarely gets weaker</small></span><span>Value<small>worse hands call</small></span></div><ul><li><b>No SDV</b> (air or a draw): checking gives up, so bet when there is fold equity or equity.</li><li><b>Vulnerable SDV</b> (e.g. third pair on a two-tone board): most turns make it worse. Bet for <b>protection</b>, but only when Villain has many hands with real equity against you <i>and</i> they fold. Bonus: when called and behind you often have about 5 outs to two pair or trips.</li><li><b>Stable SDV</b> (e.g. a medium pair that no turn hurts, against a range with 2 outs or fewer): <b>check</b>. You keep the pot the right size, still value-bet later if needed, and let Villain bluff into you.</li><li><b>Value</b>: bet and build the pot, especially against Fish, and against aware players so your c-betting range isn't all air.</li></ul>`],
['Factor 5: multiway',`<p>Every extra opponent must also fold, so fold equity collapses. A player who folds 60% heads-up might fold 70% in a four-way pot because he knows to tighten up, and still:</p><p class="formula">0.7 × 0.7 × 0.7 = 34%</p><p>Three-way at 65% each: 0.65 × 0.65 = 42%. Multiway pots raise the bar for equity even on the driest boards. It is one more reason to raise and isolate pre-flop rather than limp: thinning the field wins more pots.</p>`],
['Factor 6: turn and river prospects',`<p>The better your later streets, the more you want to start bluffing on the flop:</p><ul><li><b>Turn equity</b>: backdoor flush and straight draws turn into real draws.</li><li><b>Future fold equity</b>: scare cards (overcards, flush cards) that weaken Villain's calls and fit your range.</li></ul><p><b>Poor prospects</b>: a hand with no backdoors on an ace-high or king-high board. When Villain calls he often has the A or K, his SDV is stable, and few turns help your story. <b>Good prospects</b>: a hand that improves on nearly half the turns (flush cards, straight cards, overcards that also scare medium pairs).</p><p>This factor counts less than the others. Use it to tip close spots. And don't plan multi-street bluffs against Fish without a specific read.</p>`],
['Factor 7: position',`<p>In position, a light c-bet is better for two reasons:</p><ol><li>When called, you can take a free card on the turn instead of having to give up, and you see what Villain does first.</li><li>Villain folds more: calling light out of position is less profitable for him.</li></ol><p>Example: against a combative Reg who folds only 40% to c-bets, an overcard with a backdoor flush draw and a backdoor gutshot is just about a c-bet from the BU vs the BB, but probably not from the SB vs the BB.</p>`],
['Putting the factors together',`<p>The skill is weighing all seven at once. A worked spot: you open 2bb on the BU, a Reg in the BB who folds to c-bets fairly often calls, and you have bottom pair with a backdoor flush draw on a very dry flop.</p><ul class="chk"><li data-v="+">Texture: very dry</li><li data-v="+">Equity when called: decent (two pair, trips, backdoor flush)</li><li data-v="+">Villain folds fairly often, more on a dry board</li><li data-v="+">SDV: vulnerable, so it wants protection</li><li data-v="+">Heads-up</li><li data-v="+">Turn prospects: some flush and straight draws</li><li data-v="+">In position</li></ul><p>Everything points the same way: c-bet. Most spots are less clear; count the strong factors (texture, equity, Villain) first and let the weaker ones (turn prospects, position) settle the close ones.</p>`],
['Sizing: small, medium or large',`<p>Small c-bets are often best: RFE is risk ÷ (risk + pot), so a smaller bet needs to work less often. Two forces push the size:</p><ul><li><b>Wetter boards → bigger.</b> You want value in early before scare cards kill your action, your c-betting range on wet boards holds less air (you check more of it) and more strong hands, and bigger bets charge the draws Villain calls with.</li><li><b>Wide c-bet ranges → smaller.</b> On dry boards you bet lots of air, and both players usually have little, so risk the minimum.</li></ul><p>Size for the bulk of your c-betting range.</p><div class="tbl"><table><tr><th>Zone</th><th class="num">Size</th><th>Use on</th></tr><tr><td>Small</td><td class="num">½–⅗ pot</td><td>Dry flops, weak or wide ranges (BU opens)</td></tr><tr><td>Medium</td><td class="num">⅗–⅔ pot</td><td>In between</td></tr><tr><td>Large</td><td class="num">⅔–1× pot</td><td>Wet flops, strong ranges (UTG opens)</td></tr></table></div><p><b>Examples.</b> BU opens 2bb, BB calls, flop ${FL('K♣ 7♦ 2♥')} (pot 4.5bb): you c-bet almost your whole wide range, so ½ pot, 2.25bb. UTG opens 3bb, BU calls, flop ${FL('K♠ J♥ 6♥')} (pot 7.5bb): your range is strong here (AA, KK, JJ, AK, KQ, KJs), so between medium and large, about 5bb.</p>`],
['Balanced vs unbalanced sizing',`<p><b>Against Regs</b>, use one size for your whole range on a given board: top pair, sets and air all bet the same, or an aware player reads your hand from the size.</p><p><b>Against a fit-or-fold Fish</b>, break the balance on purpose. He calls when he connects and folds when he misses, almost whatever the size, and he isn't watching your patterns. So bet <b>big with value</b> to build the pot (e.g. 6.5bb with a set) and <b>small with air</b> to lower your RFE and lose little when he has it (e.g. 3bb into the same pot).</p>`],
['Is it the best line?',`<p>To check a c-bet is +EV, find the RFE for your size and compare it with the folds you expect:</p><p class="formula">½ pot: risk 4.75 to win 9.5 → 4.75 / (4.75 + 9.5) = 33%</p><div class="tbl"><table><tr><th>Bet size</th><th class="num">RFE</th></tr><tr><td>¼ pot</td><td class="num">20%</td></tr><tr><td>⅓ pot</td><td class="num">25%</td></tr><tr><td>½ pot</td><td class="num">33%</td></tr><tr><td>⅔ pot</td><td class="num">40%</td></tr><tr><td>Pot</td><td class="num">50%</td></tr><tr><td>1.5× pot</td><td class="num">60%</td></tr><tr><td>2× pot</td><td class="num">66%</td></tr></table></div><p>Memorise at least ½ pot (33%) and pot (50%). RFE ignores your equity, so lower it for outs: with 9 outs and some implied odds, a c-bet can be +EV with no folds at all.</p>${KEYBOX('+EV is not enough','The goal is the <i>most</i> +EV line. Against an Aggro Fish, a hand with stable SDV wins more by check/calling, because he bets wider than he calls: checking lets him bluff into you. Against a passive player, betting a vulnerable hand beats checking because it protects it and stops him taking the pot on the turn.')}`],
['Three more spots',`<ol><li><b>Multiway, wet board, an Aggro Fish in the pot, 4 outs.</b> Three bad factors, and the equity can't redeem them: fold equity is low now and later. Check, realise your few outs for free, and fold to a bet.</li><li><b>Heads-up in position vs a passive fit-or-fold player, bone-dry board, an underpair with 2 outs.</b> Everything is good except equity. RFE at ½ pot is 33%, and this player folds far more than that on this board. Bet small: it also protects your hand and stops him stabbing the turn.</li><li><b>Dry board vs an Aggro Fish, your weak ace has stable SDV.</b> A c-bet would be +EV, but check/calling is better: he bets wider than he calls, and few turns hurt you. Plan to call down, and play your other calling hands the same way.</li></ol><p>Review your own c-bet spots from your database the same way: frequency makes this the best use of study time early on. Then drill endless dealt spots that use these factors and the sizing guide: <a href="#ranges/mix-C-bet">C-bet spots</a>.</p>`],
],
quiz:[
