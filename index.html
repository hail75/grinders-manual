['Which board type is the best for a light c-bet with no equity?',['Type 1, bone dry like K♣7♦2♥','Type 3, semi-wet like J♠8♠6♦','Type 4, wet like 9♥8♥6♦','Type 5, soaking like J♣9♣7♣'],0,'Bone-dry boards miss almost every range, so fold equity is high even with air.'],
['On a soaking board like Q♦J♠T♠ with no equity, you should usually…',['c-bet small','c-bet large','check','overbet'],2,'Villain rarely misses these flops, so without equity a light c-bet is close to always wrong.'],
['When you count outs for a c-bet, count them against…',['Villain’s whole flop range','the hands that call your c-bet','the nuts only','a random hand'],1,'Your outs only matter when he calls; if he folds you’ve already won.'],
['About how much equity do 10 outs give you from flop to river?',['20%','28%','38%','50%'],2,'Outs × 4 is about 40%; the table says 38%.'],
['On J♥T♣4♦, which is the better light c-bet: 77 or AQ?',['77: it is ahead now','AQ: 10 outs when called, 4 to the nuts','Both the same','Neither'],1,'77 has only about 2 dirty outs when called; AQ has about 38% equity.'],
['A loose Fish (60% VPIP) calls your BU open. Flop 6♣4♦2♥. True or false: he usually hits this board.',['True: he plays low cards','False: his wide range is mostly higher cards and misses','True: Fish always hit','It depends only on his fold-to-cbet'],1,'The fish flop fallacy. Junk dilutes his range, and he has fewer pocket pairs; he misses low boards a lot.'],
['A tight Nit flats your open on the BU. On which flop is a light c-bet worst?',['A♠7♦2♣','K♥Q♣J♦','K♦6♠2♥','Q♣4♦4♥'],1,'His range of medium pairs, AK, AQ and suited broadways hits a K-Q-J board hard.'],
['Which hand type should usually CHECK rather than c-bet?',['Air with backdoors','A vulnerable third pair','A stable, medium-strength made hand','A set'],2,'Stable SDV doesn’t need protection, so checking controls the pot and invites bluffs.'],
['Betting a vulnerable pair “for protection” only makes sense when…',['Villain has hands with real equity that fold to the bet','Villain never folds','you are multiway','the board is soaking'],0,'Protection means folding out hands that could outdraw you. If they call anyway, it is a value bet; if they don’t exist, there is nothing to protect.'],
['Three straightforward players each fold 70%. How often do all three fold?',['70%','49%','34%','21%'],2,'0.7 × 0.7 × 0.7 ≈ 34%.'],
['Why is a light c-bet better in position?',['You can take a free turn card and Villain folds more','The pot is bigger','Villain can’t raise','Position lowers RFE'],0,'In position you can check behind on the turn, see his action first, and he calls light less often out of position.'],
['Larger c-bet sizing fits best with…',['dry boards and weak ranges','wet boards and strong ranges','multiway pots with air','out-of-position bluffs'],1,'Value wants money in early on wet boards, your range there is stronger, and draws pay more.'],
['Against a regular, how should you size c-bets on a given board?',['Big with value, small with bluffs','One balanced size for the whole range','Always pot','Min-bet everything'],1,'Aware players spot size tells, so stay balanced. Save unbalanced sizing for fit-or-fold Fish.'],
['You c-bet ½ pot. How often must it work with zero equity?',['25%','33%','40%','50%'],1,'RFE = 0.5 / (1 + 0.5) = 33%.'],
['Dry board, you hold a weak ace with stable SDV against an Aggro Fish. Best line?',['C-bet small','C-bet big','Check and call down','Check/fold'],2,'He bets wider than he calls, so checking lets him bluff into your stable hand: more EV than a +EV c-bet.'],
]},
{id:'value',ch:'5',title:'Value betting',mins:25,sum:'When a hand is strong enough to bet for value, when the pot needs building, when to slowplay, and how big to bet.',tool:'value',toolAt:'The three questions',
blocks:[
['Where the money comes from',`<p>To beat the rake you need a big edge, and most of it comes from Fish, not Regs. Fish have many leaks, but the main one is <b>calling too much</b>: they put money in with marginal hands and struggle to fold.</p><p>Against players who don't fold, your job is not to bluff them. It is to get paid when you have the better hand. This chapter answers four questions: what a value bet is, when your hand is strong enough, when the pot needs building, and when another line gets more value than betting.</p>`],
['What a value bet is',`<p>A bet is for <b>value</b> only if you are ahead of the hands that <b>call</b> it. Being ahead of Villain's whole range is not enough: if the worse hands fold and the better ones call, the bet loses.</p>${KEYBOX('Ahead vs ahead when called','You can have the best hand most of the time and still not have it when called. What counts is your equity against his calling range.')}<p>Some value bets are clear (you are well ahead when called); others are close to 50%. Sometimes the pot badly needs to grow; sometimes it's already big enough. Sometimes Villain is passive and you must bet; sometimes he is a maniac who bets for you.</p>`],
['The three questions',`<p>The book turns all of this into a flowchart. Ask in order:</p><ol><li><b>Q1. Is my relative hand strength sufficient?</b> Am I ahead of the range that calls? No → check.</li><li><b>Q2. Do I need to build the pot?</b> Yes → value bet.</li><li><b>Q3. Should I slowplay?</b> Will checking get more money in? No → value bet. Yes → check.</li></ol><p>So: yes-yes → bet; yes-no-no → bet; yes-no-yes → check; no → check. Try it with the flowchart below.</p>${KEYBOX('The procedural check','When you were not the aggressor on the last street, you normally check to the player who was. Skip the flowchart in these spots and check; leading into the aggressor is for special cases covered later.')}`],
['Q1: relative hand strength',`<p><b>Absolute</b> strength is how good a hand is in general; <b>relative</b> strength is how it does against this Villain's range on this board. A flush can be worth three streets, or a bluff-catcher to fold.</p><ul><li>A straight that is the nuts: clear yes to Q1.</li><li>The same straight on ${FL('9♠ 8♠ 6♠')}: any spade beats it and better straights exist. Almost no worse hand calls: no to Q1, check.</li></ul><p><b>Villain type can outweigh texture.</b> You bet an overpair three-way and a flush card comes on the turn:</p><ul><li>If the <b>Fish</b> called the flop, his range is wide and full of weak pairs and random draws that still call. You're still ahead when called: bet again.</li><li>If the <b>Reg</b> called, he called tightly (into a Fish, three-way), so his range has more flush draws and fewer weak pairs, and he folds those weak pairs to a second bet on a flush card. You're behind when called: check.</li></ul><p>This is why most of your money comes from Fish: they make the big mistakes, like not folding a weak ace on that turn.</p>`],
['Q2: building the pot',`<p>The bigger the pot, the bigger you can bet while still offering a price people call. Bigger bets win more. So against players who call too much, the pot almost always needs building.</p><p>${P('blue','WTSD')} (went to showdown) shows how often a player sees a showdown once he sees the flop. The higher it is, the thinner you can value-bet and the bigger you can size. Passive Fish have high WTSD and won't build the pot for you; an Aggro Fish who can't stop clicking bet will, which is the rare exception.</p>${KEYBOX('The Exponential Mistake','Skip a value bet on the flop and your turn bet must be a fraction of the size, so the river pot is far smaller, and so is the river bet. In the book’s pair of hands, the player who checked the flop could only bet about a third as much on the river. Don’t fix it with a huge river overbet: even Fish fold more to a bad price. Build gradually with large but normal bets from the flop.')}`],
['Q3: when slowplaying is wrong',`<p>Q2 is a “no” mostly when stacks are short relative to the pot: one or two bets get everything in. Even then, betting is often still best. Example: a 15bb effective stack against a passive Fish on a very wet flop with your strong hand. Betting is right:</p><ul><li>Passive players call wider than they bet, so betting gets your money in with him in worse shape than checking and calling his bet later.</li><li>A free card loses a street from naked draws that would call now but not on the river.</li><li>It lets him outdraw you with hands that would have folded (protection).</li><li>A scary turn can stop him calling with the worse pairs you could have got value from.</li></ul><p>Flop and turn are often the best streets for the last bets to go in. No need to build the pot only means a check is possible, not that it is better.</p>`],
['Q3: when slowplaying is right',`<p>Check only with <b>yes</b> to Q1, <b>no</b> to Q2 and <b>yes</b> to Q3. Remember: if you check when last to act, the pot does not grow on that street. The book's three spots:</p><ol><li><b>Out of position vs an aggressive Villain.</b> He bets when checked to (a high ${P('purple','Float Flop')}), so the pot grows anyway and he bets air too.</li><li><b>Short effective stack, dry board.</b> You have a street to spare and few free cards hurt you.</li><li><b>Crushing the deck.</b> You hold the cards he needs to call (two of the remaining queens on a Q-high board), so a bet gets almost no calls. Check, let him bluff or improve, and get value later, ideally in position.</li></ol>`],
['Thick and thin value',`<p><b>Thick</b> value: clearly ahead when called. Most of your value bets. <b>Thin</b> value: ahead a bit more than half the time when called. Finding thin value is what separates good players from great ones.</p><p>In position on the river, you can bet thin or check behind and win whenever you're best. Bet thinner when:</p><ul><li>Villain calls down light;</li><li>the board is safe, so he has less reason to fold;</li><li>his range is <b>capped</b>. If he checked the turn when he would have bet his strong hands, he rarely has them now; his range is weighted to the medium hands your thin bet beats.</li></ul><p>When both ranges are <b>uncapped</b> and a scary river (a flush card) improves the hands you were beating, thin value turns into a check.</p>${KEYBOX('Two streets or three?','If you can only get two streets of value, bet the turn rather than the river: draws still call the turn but fold the river when they miss.')}`],
['River lines out of position',`<p>With a once-strong hand that is now marginal on the river out of position, you have three lines:</p><ul><li><b>Bet/fold</b> (thin value): when Villain’s calling range is weaker than the range he would bet if you checked, and you are ahead often enough when called.</li><li><b>Check/call</b> (bluff-catch): when his betting range after your check is weaker than his calling range, and you have the required equity to call.</li><li><b>Check/fold</b>: when the hands that call a bet beat you and the hands that bet after a check beat you too. You can still win when he checks back worse.</li></ul>`],
['Sizing value bets',`<p><b>Value c-bets.</b> Against Regs, keep the balanced sizes from Ch. 4. Against Fish, go bigger with value: they call with any piece of the board whatever the size, so bigger bets build the pot faster, while your light c-bets stay small.</p><p><b>Odd stacks.</b> With short or unusual effective stacks, count how many bets get the money in and size each street so you don't leave an awkward bet for later.</p>`],
['Elasticity',`<p>A range is <b>elastic</b> when it folds more as the bet grows, and <b>inelastic</b> when it calls about as often whatever the size.</p><figure class="elast" role="img" aria-label="Calls by bet size: an elastic range falls steeply, an inelastic range stays flat"><svg viewBox="0 0 220 110"><line x1="30" y1="90" x2="210" y2="90" class="eax"/><line x1="30" y1="10" x2="30" y2="90" class="eax"/><path d="M30 18 C80 22 120 60 205 84" class="ce"/><path d="M30 26 L205 34" class="ci"/><text x="120" y="104" text-anchor="middle">bet size →</text><text x="12" y="52" transform="rotate(-90 12 52)" text-anchor="middle">calls</text></svg><figcaption><span><i class="sw-ci"></i>Inelastic: calls about as often</span><span><i class="sw-ce"></i>Elastic: folds more to bigger bets</span></figcaption></figure><ul><li><b>Inelastic</b> (most Fish: top pair, draws, even second pair): size <b>up</b> for value, size <b>down</b> with bluffs. “I don't want to blow him off his hand” is the wrong worry.</li><li><b>Elastic</b> (a solid Reg with a wide range of weak hands, e.g. blind vs blind): size <b>smaller</b> for thin value so his worse hands still call.</li></ul><p>Example from the book: AA against a loose Fish, big bets on flop and turn. On a river that pairs the board, his top pairs became full houses that never fold, and his missed draws fold to any size. His range is inelastic, so shove (75bb). With air in the same spot, a small bluff would fold the draws just as well.</p>`],
['Milking syndrome',`<p>Betting tiny for fear of a fold is a costly habit. Compare the EV of sizes:</p><p class="formula">EV ≈ bet × how often it’s called</p><p>A Nit with full houses calls a 7bb river bet every time: 7 × 100% = 7bb. He folds 60% to a 20bb bet: 20 × 40% = 8bb. The bigger bet wins more even though he folds more often. Run this check on your own river sizes; usually bigger is better against inelastic ranges.</p><p>Drill the three questions and sizing on dealt turns and rivers: <a href="#ranges/mix-Value%20bet">Value bet spots</a>.</p>`],
],
quiz:[
['Which is the definition of a value bet?',['Betting when you’re ahead of Villain’s whole range','Betting when you’re ahead of the range that calls','Betting a strong absolute hand','Betting to protect'],1,'You must be ahead of the hands that continue.'],
['You hold a straight on a monotone board where any card of that suit makes a flush. Q1 (relative strength sufficient?) is…',['Yes: a straight is strong','No: few worse hands call and many beat you','Yes if you’re in position','Only yes vs Fish'],1,'Absolute strength is high, relative strength is poor on this board.'],
['Overpair, three-way flop bet, a flush card turns. Who are you more happy to bet again into?',['The Reg who called the flop','The Fish who called the flop','Both the same','Neither'],1,'The Fish’s wide range still has many weak pairs that call; the Reg’s range is stronger and folds his weak pairs.'],
['Q1 = yes, Q2 = no, Q3 (slowplay?) = no. Action?',['Check','Value bet','Check-raise','Fold'],1,'Even when the pot doesn’t urgently need building, bet if slowplaying isn’t better.'],
['You check top pair on the flop against a passive Station to “trap”. What error is this?',['Procedural error','The Exponential Mistake','Fish flop fallacy','Ghost equity'],1,'The missed flop bet shrinks every future bet, so you win far less overall.'],
['A high WTSD stat tells you to…',['bluff more','value-bet thinner and bigger','slowplay','fold more'],1,'He goes to showdown a lot, so weaker hands get paid and bigger bets still get called.'],
['15bb effective, very wet flop, strong hand against a passive Fish. Best play?',['Check to trap','Bet: passive players call wider than they bet, and free cards hurt you','Shove the turn only','Fold'],1,'No need to build the pot doesn’t make checking better; betting gets value and protection.'],
['Out of position, you flop a strong hand against a player with a high Float Flop stat. Why might checking be better than betting?',['It never is','He bets when checked to, so the pot still grows and he bets air too','Checking protects your hand','To get to showdown cheaply'],1,'That is the first slowplay spot: Villain builds the pot for you and widens the range that pays you.'],
['What makes thin value bets better?',['Villain’s range being capped','Villain’s range being uncapped','A scary river card','Being out of position'],0,'If he has few strong hands left, your medium hand is ahead of more of his calls.'],
['You can only get two streets of value with a draw-heavy board. Bet…',['flop and river','flop and turn','turn and river','only the river'],1,'Draws call the turn but fold the river when they miss.'],
['River, out of position, marginal hand. Villain bets wide when checked to but calls only with better. Best line?',['Bet/fold','Check/call','Check/fold','Overbet'],1,'His betting range is weaker than his calling range, so check/call to catch bluffs.'],
['A Fish’s calling range is mostly…',['Elastic: size down for value','Inelastic: size up for value','Elastic: overbet','Irrelevant to sizing'],1,'Inelastic ranges call similar amounts regardless of size, so bigger value bets earn more.'],
['A Nit calls a 7bb river bet 100% of the time and a 20bb bet 40%. Which earns more?',['7bb: 7','20bb: 8','The same','Can’t tell'],1,'7 × 100% = 7bb; 20 × 40% = 8bb. Don’t fall for milking syndrome.'],
]},
{id:'call',ch:'6',title:'Calling opens',mins:22,sum:'The gap concept, the four reasons to call an open, set mining, and how each seat defends.',
blocks:[
['The gap concept',`<p>You need a stronger hand to <b>call</b> an open than to <b>open</b> it yourself. You open ATo from the CO, but you rarely call a HJ open with it. Three reasons:</p><ol><li>The opener's range is already narrowed to the top X%, and ATo does badly against an early-position top X%.</li><li>You have no initiative: you face the c-bet instead of making it, so you have less fold equity and the hand needs more skill.</li><li>You 3-bet your best hands, so your calling range is <b>capped</b> and harder to defend against squeezes and post-flop pressure, while the opener's range is uncapped.</li></ol>`],
['Four reasons to call',`<p>Calling puts you in a worse spot than opening, so you need a reason:</p><ol><li><b>Good shape</b>: your hand does well against his opening range, but not against the range that continues vs a 3-bet. Call rather than turn it into a bluff.</li><li><b>Implied odds</b>: you rarely hit, but win big when you do.</li><li><b>Weaker players</b> are likely to join the pot.</li><li><b>Pot odds</b> make calling better than folding (mostly in the BB).</li></ol>`],
['Reason 1: good shape',`<p>Whether a hand is in good shape depends on <b>where he opened from</b> (a CO steal is far easier to be ahead of than a UTG range) and <b>who he is</b> (his RFI from that seat: wider openers make more hands callable).</p>${KEYBOX('The key question','Can this hand often flop something that beats a good part of his <i>value</i> range (top pair, overpairs and better)? You fold many flops, so beating only his weak hands and bluffs is not enough.')}<p>Against a 14% UTG open:</p><ul><li><b>QJo</b>: about 35% equity, and the pairs it flops are often dominated by KQ, KJ, AQ, AJ and JJ+. Even good flops cost money: <b>reverse implied odds</b>. Fold.</li><li><b>KQo, AJo</b>: better (44-48%), but still often dominated. Marginal.</li><li><b>99-JJ</b>: in good shape <i>and</i> able to flop sets. Powerful hybrid calls.</li></ul><p>Judge how a hand plays post-flop, not just its raw equity.</p>`],
['Reason 2: implied odds and set mining',`<p>A pocket pair flops a set (or quads) <b>11.8%</b> of the time, about 1 in 8.5. Sets are strong and disguised, so they can win a whole stack. Small pairs that miss are hard to continue with (“no set, no bet”), so calling them is <b>set mining</b>.</p>${KEYBOX('The set-mining rule','You hit about 1 time in 9. Round that to 1 in 10 to make a profit after rake and the rare set-over-set: you need to win about <b>10× your call</b> on average when you hit (the pot plus what you get from his stack). Calling 3bb needs about 30bb.')}<p>Whether you’ll get that depends on the implied odds factors:</p>`+GB(['Small investment','Flop a big hand often','Villain\'s range is strong','Stacks deep','Villain doesn\'t fold','Multiway','Good position'],['Large investment','Rarely flop a big hand','Villain\'s range is weak','Stacks shallow','Villain folds','Heads-up','Bad position'])+`<p>Facing a 3bb UTG open in position with 100bb stacks: the pot already holds 7.5bb if you call, so you need about 22.5bb more from a strong range that often pays off. Very achievable. The book’s chart calls 66+ from the HJ and adds the smallest pairs (22-44) from the BU, where position and fewer players behind add implied odds; with Fish behind, more pairs become set mines.</p>`],
['Reason 3: weaker players',`<p>Your edge is bigger post-flop when weak players are in the pot, so a hand that fails reasons 1 and 2 can still call.</p><p>Example: 87s facing a UTG open is a fold at a table of Regs. With two Fish in the blinds likely to come along and play badly out of position, it's a call: more implied odds, and the multiway pot forces UTG to play fit-or-fold. You can toss your hand when UTG c-bets a bad flop, and value-bet the Fish when he checks.</p><p>Watch the details: a short-stacked Fish, a Fish in position on you, or an active squeezer behind all cut the value of the call.</p>`],
['Reason 4: pot odds',`<p>Pot odds compare the pot with what you must put in. Facing a 3bb UTG open:</p><ul><li><b>From the HJ</b>: call 3 into 4.5 → 1.5:1.</li><li><b>From the BB</b>: call 2 into 4.5 → 2.25:1. Your blind is already in the pot; it isn't part of your decision.</li></ul><p>Better odds don't make every hand a call: being out of position offsets a lot of it.</p><p><b>A check that calling beats folding.</b> In the BB vs a 2bb BU open, you call 1 into 3.5, so you'd break even winning just 1 / 4.5 = 22% of the time. The book’s example, a king-high hand, has about 44% equity against a wide BU range and pairs its king on the flop 17% of the time. Real play (c-bets, folds, value when you hit) should beat 22% easily: call.</p>`],
['Cold calling in position',`<p>In position you play better post-flop, but you pay a worse price than the blinds and players behind can squeeze. Guidelines:</p><ul><li>The closer to the BU, the better: stronger position and fewer squeezers behind.</li><li>Against <b>tight</b> (early) ranges, implied-odds hands like 44 gain.</li><li>Against <b>loose</b> (late) ranges, top-pair hands like KQo gain.</li><li>Smaller opens are more callable for both kinds of hand.</li></ul><p>Build default flatting ranges for common spots so the decision is automatic. They are tied to your 3-bet ranges (Ch. 10). Drill the book’s charts: <a href="#ranges/call-HJvUTG">vs UTG</a>, <a href="#ranges/call-COvHJ">vs HJ</a>, <a href="#ranges/call-BUvCO">vs CO</a>.</p>`],
['The blinds',`<p><b>Big blind.</b> You close the action at a discount, so you defend wider as the opener gets later and as the open gets smaller: far more vs a 2x BU open than vs 3x. Drop the small pairs vs early 3x opens: set value suffers out of position.</p><p><b>Small blind.</b> Two problems: worse pot odds (only half a blind is in) and you don’t close the action, so you get squeezed or play three-way out of position. Default to <b>3-bet or fold</b> vs CO and BU opens. The book’s three calling exceptions:</p><ol><li>vs UTG and HJ 3x opens: a small, strong flatting range;</li><li>vs CO/BU with a <b>Fish in the BB</b>: wider, for the implied odds against him;</li><li>vs CO/BU with a <b>tight non-squeezer</b> in the BB: only the most playable hands. Small pairs like 55-66 still fold: they miss the set 88% of the time and get paid too little out of position.</li></ol><p><b>BB vs SB.</b> In position against a single opponent, the BB defends very wide, especially vs small opens. Against a min-raise, hardly fold.</p><p>Drill them: <a href="#ranges/bb-BU2">BB vs BU by size</a>, <a href="#ranges/call-SBvUTG">SB calling spots</a>, <a href="#ranges/bb-SB3">BB vs SB</a>.</p>`],
],
quiz:[
['You’d open ATo from the HJ. UTG opens and you hold ATo in the HJ. Usually…',['Call, it’s in your range','Fold or 3-bet; the gap concept says calling ranges are tighter','Always 3-bet','Limp'],1,'Opening and calling are different: the opener’s range is strong and you lack initiative.'],
['Why is a calling range usually capped?',['Calls are always weak','Your best hands go into 3-bets','Position caps it','The rake'],1,'Strong hands 3-bet, so the flats are the hands below them.'],
['Against a tight UTG open, QJo is a fold mainly because…',['it has no equity','its pairs are often dominated: reverse implied odds','it’s offsuit','UTG never c-bets'],1,'When it hits, it often loses a big pot to KQ, AQ, AJ or an overpair.'],
['How often does a pocket pair flop a set or better?',['~6%','~12%','~20%','~33%'],1,'About 11.8%, roughly 1 in 8.5.'],
['By the set-mining rule, calling 3bb to set-mine needs you to win about…',['3bb','10bb','30bb','100bb'],2,'About 10× the call on average when you hit.'],
['Which favours calling for implied odds?',['Short stacks','Villain’s range is weak','Villain rarely folds once he connects','Large investment'],2,'You need someone to pay you off when you hit.'],
['UTG opens. With two Fish in the blinds, 87s on the BU becomes…',['a fold','a call: weaker players add implied odds','a 3-bet','an open-shove'],1,'Reason 3: the Fish add implied odds and push UTG into fit-or-fold play.'],
['Facing a 3bb UTG open, what are your pot odds from the BB?',['1.5:1','2:1','2.25:1','3:1'],2,'Call 2 into 4.5 (open + both blinds).'],
['BB vs a 2bb BU open: you call 1 into 3.5. How often must you win the pot to break even?',['13%','22%','29%','35%'],1,'1 / (1 + 3.5) ≈ 22%.'],
['Against a loose late-position opener, which hand gains most as a flat in position?',['44','KQo','72o','A2o'],1,'Top-pair hands do better against wide ranges; small pairs gain against tight ones.'],
['Why does the SB flat less than the BB against the same open?',['It has position','Worse pot odds, and it doesn’t close the action','It has more chips in','Rake'],1,'Half a blind in gives a worse price, and the BB can still squeeze behind.'],
['Why drop small pairs in the BB vs an early-position 3x open?',['They have no equity','Out of position it’s harder to get paid when you hit','They’re always dominated','The pot odds are bad'],1,'Set value relies on implied odds, which are lower out of position.'],
]},
{id:'eoa',ch:'7',title:'Facing bets: end of action',mins:18,sum:'How to decide a river call: required equity first, then four questions and your reads.',tool:'req',toolAt:'Part 1: required equity',
blocks:[
['What counts as end of action',`<p>You face a bet and your call or fold <b>closes the betting</b>: a river bet, or an all-in. There is no later street to worry about, so pure equity maths works. (Raising as a bluff is possible but left for later; here the choice is call or fold.)</p><p>These are the spots players get wrong most. A typical bad thought process:</p><blockquote>“He bet really big, so he might think I think he’s bluffing… or he’s trying to push me off my hand… he’d bet smaller with value, so I call.”</blockquote><p>That is guessing at a stranger's thoughts, and it skips the one number that matters: how often you need to be right.</p>`],
['The two-part process',`<ol><li><b>Part 1. What is my required equity to call?</b></li><li><b>Part 2. Do I have that much equity on average?</b></li></ol><p>Always in that order: the target first, then whether Villain bluffs (or value-bets worse) often enough to meet it.</p>`],
['Part 1: required equity',`<p class="formula">RE = ATC / (ATC + TP)</p><p>ATC is the amount to call; TP is the total pot <i>including Villain's bet</i>. Example: Villain bets 26 into 40.5. TP = 66.5, so RE = 26 / (26 + 66.5) = <b>28.1%</b>.</p><p>At the table, don't calculate: use the milestones.</p><div class="tbl"><table><tr><th>Bet faced</th><th class="num">Required equity</th></tr><tr><td>Into an empty pot</td><td class="num">50%</td></tr><tr><td>Pot</td><td class="num">33%</td></tr><tr><td>¾ pot</td><td class="num">30%</td></tr><tr><td>⅔ pot</td><td class="num">29%</td></tr><tr><td>½ pot</td><td class="num">25%</td></tr><tr><td>⅓ pot</td><td class="num">20%</td></tr><tr><td>¼ pot</td><td class="num">17%</td></tr><tr><td>⅕ pot</td><td class="num">14%</td></tr></table></div><p>Learn these until they come without thinking.</p>`],
['Part 2: four questions',`<p>You can’t compute your equity against a range at the table, so ask:</p><ol><li><b>Can Villain value-bet worse hands?</b> If you beat some of his value bets, you need far fewer bluffs to call: usually a quick call.</li><li><b>Can he have any air?</b> If every hand that reaches the river has improved or has showdown value, he has nothing to bluff with: usually a quick fold. (Example: you bet flop and turn and a draw completes on the river: his range is often airless.)</li><li><b>Does his line make sense for value?</b> If an aggressive player checks back the turn, capping his range, then raises the river representing the nuts, call lighter, if you're sure he always bets his strong hands on the turn. Careful: passive Fish slowplay big hands, so their check-check-shove means something else.</li><li><b>What do my reads say?</b> Most of the time questions 1-3 don't settle it: his line makes sense, he can have air, and he doesn't value-bet worse. Then reads decide.</li></ol>`],
['Three levels of read',`<p>From most to least precise:</p><ul><li><b>Player reads</b>: what this Villain has done: past hands, showdowns, notes, HUD stats.</li><li><b>Player-type reads</b>: what his kind of player does. Regs rarely slowplay the nuts for two streets; Fish call with a wider range than they bet; Aggro Fish bluff a lot, even with showdown value.</li><li><b>Population reads</b>: what the players in your games do. Maybe they fold too much to c-bets, or rarely bluff the river after three streets.</li></ul><p>Use the most precise read you have, but never say “I know nothing”: build a store of population reads for your games.</p>`],
['Worked spot: the bluff-catcher fold',`<p>A Reg bets three streets on a board where you hold TT, a pure bluff-catcher. The river bet asks for <b>28%</b>.</p><ul><li>Q1: he doesn't value-bet worse three times. No quick call.</li><li>Q2: he can have air (missed draws). No quick fold.</li><li>Q3: his line makes sense for overpairs, top pairs and sets.</li><li>Reads: none specific, so population. At most low stakes, Regs who bet three times are heavily weighted to value.</li></ul><p>Fold. And don't worry about being bluffed this once: your river range also has stronger hands (AQ, sets) that call. He can only exploit you if you fold <i>too often</i>, not if you fold the bottom of your range.</p>`],
['Worked spots: two calls',`<ul><li><b>Blind vs blind, scare card.</b> A king turns, which helps Villain's perceived range far more than yours, so he bluffs it widely. You hold A9 and need about 32% on the river. Your ace blocks AA and AK, and his large river size discounts thin value. Bluffs are a big share of his range: call.</li><li><b>Half-pot river.</b> You need just over 25%. On a scary turn he will bet a wide range and can value-bet hands like TT or A9 that you beat. Q1 answers it: a quick call, and he can have air too.</li></ul>`],
['Stats for river decisions',`<p>Read ${P('blue','CBet Flop')}, CBet Turn and CBet River <i>together</i>. The more light c-bets he makes on the flop, the more air he takes to later streets; how often he keeps firing shows how much of it reaches the river. Someone who c-bets the flop a lot but rarely fires the turn and river gives up his air early; someone who fires all three often arrives with plenty of bluffs.</p><p>WWSF (won when saw flop) shows how hard he fights for pots overall, and settles faster than street-by-street stats. Turn and river stats need big samples before you trust them.</p>`],
],
quiz:[
['In an end-of-action spot, what should you work out first?',['Whether he’s bluffing','Your required equity','His bet-size tell','Your hand’s absolute strength'],1,'Find the target first, then judge whether you meet it.'],
['Villain bets pot on the river. Required equity to call?',['25%','33%','50%','66%'],1,'Call 1 into a total of 3: 1/3.'],
['Villain bets ½ pot. Required equity?',['17%','20%','25%','33%'],2,'Call 0.5 into 2: 25%.'],
['Pot is 20bb, Villain bets 10bb. ATC/(ATC+TP) = ?',['10/30','10/40','10/20','20/40'],1,'TP includes his bet and your call: 20 + 10 + 10 = 40.'],
['Villain bets 26 into 40.5. Your required equity is about…',['20%','28%','33%','39%'],1,'26 / (26 + 66.5) ≈ 28%.'],
['River: Villain could be value-betting many hands worse than yours. Usually…',['a quick fold','a quick call','a raise for value','a tough guess'],1,'If he bets worse for value, you don’t need many bluffs in his range to call.'],
['Villain’s line leaves him no air on the river. Usually…',['a quick call','a quick fold','a raise','irrelevant'],1,'Without air he has few bluffs, so a bluff-catcher folds.'],
['A passive Fish checks flop and turn, then shoves the river. Compared with an aggressive player doing the same…',['it’s more likely a bluff','it’s more likely a slowplayed big hand','it’s the same','Fish never shove'],1,'Passive Fish slowplay; the “line makes no sense for value” read applies to aggressive players who bet their strong hands.'],
['You know this specific villain never bluffs rivers. This is a…',['Population read','Player-type read','Player read','Ghost read'],2,'Specific knowledge about this villain is the most precise read.'],
['You fold the bottom of your river range and Villain shows a bluff. Were you exploited?',['Yes, always fold less','Not necessarily: he only exploits you if you fold too much of your range','Yes, call everything','Only if he’s a Reg'],1,'Judge your whole range, not one hand.'],
['Which pair of stats best shows how much air Villain brings to the river?',['VPIP and PFR','CBet Flop with CBet Turn and CBet River','WTSD alone','3-bet and fold to 3-bet'],1,'Read the three c-bet stats together to see where he gives up.'],
]},
{id:'oa',ch:'8',title:'Facing bets: open action',mins:26,sum:'Calling, raising and folding on the flop and turn: true vs ghost equity, floats and chases, raising ranges and donk bets.',
blocks:[
['Open-action spots',`<p>You face a bet on the flop or turn: call, raise or fold, with more betting possible afterwards. That possibility changes everything. In Ch. 7 the first step (required equity) was simple; here it is not, because what happens on later streets decides how much of your equity you can actually use.</p><p>This chapter covers made hands, then draws (pot odds, implied odds and future fold equity), raising ranges, the summary flowchart, the turn, and donk bets.</p>`],
['Why the formula fails: ghost equity',`<p>A player who has just read Ch. 7 faces a half-pot c-bet out of position from an aggressive BU and thinks: “I need about 26%, I have 48% against his range, call.” That would be right if the bet were all-in. It isn't.</p>${KEYBOX('Ghost equity','Equity you will often have to fold before showdown. An aggressive Villain bets again on the turn with his value and his semi-bluffs, and his betting range gets stronger each street, so you fold hands that were ahead. Equity that never reaches showdown was never real.')}<p>ATC / (ATC + TP) assumes you reach showdown at no extra cost. That is only true at the end of the action. On the flop and turn, judge how much of your equity is <b>true equity</b>, equity you can actually realise.</p>`],
['Calling with made hands',`<p>Four factors decide whether a made hand can call:</p>`+GB(['Good or true equity','Outs when behind','Invulnerable SDV','In position'],['Poor or ghost equity','No outs when behind','Vulnerable SDV','Out of position'])+`<ul><li><b>A weak pair out of position vs an aggressive opener</b>: mostly ghost equity, 2 outs when behind, and he is drawing live when you're ahead. Fold.</li><li><b>Middle pair paired with the board vs a wide BU c-bet</b>: semi-vulnerable, about 5 outs against top pair, more of its equity is true. Call.</li><li><b>A strong one-pair hand on a dry board vs a wide range</b>: well over 50%, few hands draw live against it, and you'll rarely fold before the river. Call down.</li></ul>${KEYBOX('Don’t overfold','Folding everything but strong hands tells him to c-bet 100% of his range against you. Defend enough of your range; your calling range also holds much better hands than the marginal one in front of you.')}`],
['Raising made hands',`<p>Raise a made hand for <b>value</b>, when worse hands call the raise. Raising medium hands “to see where I'm at” or “for protection” is usually wrong:</p><ul><li>Being ahead of his whole range doesn't mean being ahead of the range that continues after you build a big pot. Better hands call or re-raise; worse ones fold.</li><li>Protection matters only when he has many hands with real equity that fold. Against draws with 6 or 8 outs at best, it rarely does.</li><li>A medium hand catches bluffs best by <b>calling</b>: it lets him keep betting his worse hands on later streets.</li></ul>`],
['Draws: floating vs chasing',`<p>A draw can't usually win unimproved, so pot odds, implied odds and fold equity matter more than with a weak pair. And draws get <i>better</i> on later streets, while weak pairs get worse.</p><ul><li><b>Float</b>: a call that relies on <b>fold equity later</b> to be +EV.</li><li><b>Chase</b>: a call made +EV by <b>pot odds and implied odds</b> alone.</li></ul>${KEYBOX('The trade-off','Implied odds and fold equity work against each other. A player who pays you off when you hit rarely folds when you miss, and one who folds a lot rarely pays you off.')}`+GB(['Good equity','Good pot odds','Good implied odds','Future fold equity','In position'],['Poor equity','Bad pot odds','Bad implied odds','No future fold equity','Out of position'])+`<p><b>Count only what one call buys.</b> A gutshot facing a flop bet usually sees just the turn before the next bet: 4/47 ≈ <b>8.5%</b>, not the 16% it has to the river. Example: calling 7bb into 9.5bb out of position with a gutshot against an Aggro Fish who won't fold a pair and is too short to pay off big: bad pot odds, poor implied odds, little future fold equity, bad position. Fold.</p>`],
['Raising draws',`<p>Raising a draw is a semi-bluff. These factors favour raising over calling:</p>`+GB(['Fold equity','Out of position','No SDV','Bad pot odds to call','Getting 3-bet is okay'],['No fold equity','In position','SDV','Good pot odds to call','Getting 3-bet is bad'])+`<ul><li><b>Position works backwards here</b>: out of position, floating is worse, so taking the pot now with a raise gains.</li><li><b>Pot odds too</b>: good odds favour calling; bad odds favour raising.</li><li><b>Draws with a small pair or ace-high</b> already win some showdowns and usually play better as calls than as pot-bloating raises.</li><li>Pure bluff-raises with little equity need a lot of fold equity or an opponent who won't adjust.</li></ul>`],
['Having a raising range',`<p>Against Regs, decide whether you want a raising range on this flop at all:</p>`+GB(['No severe range disadvantage','Value is urgent','No Fish behind','Capped calling range is okay','Can represent good hands'],['Severe range disadvantage','Value not urgent','Fish behind','Capped calling range is bad','Can\'t represent good hands'])+`<ul><li><b>Range advantage</b>: if his range hits the board far harder than yours, raising represents hands you rarely have.</li><li><b>Urgency of value</b>: on wet boards your strong hands want money in now; on dry boards they can wait.</li><li><b>Fish behind</b>: you want them in the pot, not folded out.</li><li><b>Capped calling range</b>: if you raise all your strong hands, your calls are capped; fine on some boards, costly on others.</li><li><b>Can you represent good hands?</b> Your bluff-raises need a believable value range behind them.</li></ul>`],
['The summary flowchart',`<p>On the flop:</p><ul><li><b>Against a Reg</b>: do I want a raising range here? If yes, does this hand belong in it, for value or as a bluff? → <b>raise</b>. If not, can I call? → <b>call</b>, otherwise <b>fold</b>.</li><li><b>Against a Fish</b>: balance doesn't matter. Find the most +EV line for this hand and take it.</li></ul>`],
['Pyramidal calling',`<p>Defend like a pyramid: a wide base on the flop, narrowing on the turn, narrowing again on the river. Keep each level <b>uncapped</b> (include some strong hands), but never make terrible calls just to keep it neat. Your requirements for calling a later street are always stricter than for an earlier one.</p>`],
['Defending the turn',`<p>Villain’s betting range shrinks from flop to turn, so calling the flop and folding the turn is often right. “I called the flop so I must call the turn” is a fallacy.</p><ul><li>Ask where your hand sits in your range <i>on this turn</i>. If it’s near the bottom, folding is fine as long as enough of your range continues.</li><li>Turns that improve your range let more of it continue; turns that complete Villain’s draws let less.</li><li>Calling every street with your whole flop range is <i>more</i> exploitable: Villain could value-bet and never bluff. The pyramid must narrow.</li><li>${P('blue','CBet Turn')} needs a bigger sample than flop stats before you trust it.</li></ul>`],
['Donk bets',`<p>A donk bet is a lead into the pre-flop raiser. Usually it's a weak player with a wide range; in multiway pots, a Reg's lead can be strong. Eight truths:</p><ol><li>The donker usually has no range advantage: an opportunity.</li><li>You are always in position against a donk bet.</li><li>Fish subtype matters most: aggressive ones barrel and bluff (so your weak hands' equity is less real); passive ones donk/fold more (so raise more).</li><li>On wet boards, expect less fold equity: Fish want to see the next card.</li><li>A Fish who folds to many c-bets but donks is checking his weak hands and leading his better ones: play straightforwardly.</li><li>${P('blue','Donk Flop')} shows how wide his donking range is.</li><li>Donking ranges are <b>depolarised</b> (medium hands): bluff-catch with real showdown value, not bad ace-high, and value-raise wider.</li><li>Donking ranges are often <b>capped</b>: Fish rarely donk the nuts, so raise wider for value and pressure.</li></ol><p>A <b>min-donk</b> is so small it's close to a check.</p>`],
],
quiz:[
['What is ghost equity?',['Equity from backdoor draws','Equity you’ll often have to fold before showdown','Equity against a range of air','Equity from blockers'],1,'If you can’t realise it, it isn’t real.'],
['Why does ATC/(ATC+TP) mislead on the flop?',['It ignores rake','It assumes you reach showdown at no further cost','It overstates pot odds','It only works for raises'],1,'More betting can force you to fold, so not all your equity counts.'],
['Which made hand is the best flop call vs a wide BU c-bet?',['A weak pair with 2 outs out of position vs an aggressive opener','Middle pair with about 5 outs when behind and true equity','Ace-high out of position on a wet board','Bottom pair multiway'],1,'More outs when behind and more true equity.'],
['You raise a medium pair “to see where you’re at”. The problem?',['Nothing','Better hands continue and worse ones fold, so you isolate yourself against better','It’s too small','It wins too often'],1,'Medium hands catch bluffs best by calling.'],
['A call that relies on future fold equity to be +EV is a…',['chase','float','value call','hero call'],1,'A chase is made +EV by pot and implied odds alone.'],
['Implied odds and fold equity are…',['the same thing','inversely related','unrelated','both bad out of position only'],1,'Players who pay you off rarely fold, and vice versa.'],
['Facing one flop bet with a gutshot, how much equity should you count?',['About 16% (to the river)','About 8.5% (the turn only)','About 4%','About 32%'],1,'One call usually buys one card: 4/47.'],
['Which factor favours raising a draw over calling?',['In position','Good pot odds','Out of position','Strong SDV'],2,'Out of position, calling is harder to realise, so raising gains value.'],
['Against a Fish, the summary flowchart says…',['always keep a balanced raising range','find the most +EV line and take it','never raise','always call'],1,'Balance only matters against players who adjust.'],
['Pyramidal calling means…',['calling every street with the same range','a range that narrows street by street but stays uncapped','raising more each street','only calling with the nuts'],1,'Wide base, narrower each street, with some strong hands at every level.'],
['You call a flop c-bet and the turn completes many of Villain’s draws. Your hand is near the bottom of your range. Folding is…',['always wrong after calling the flop','fine: his turn range is stronger and enough of your range continues','only right vs Fish','a sign you shouldn’t have called the flop'],1,'Ranges contract each street. Folding the bottom of your range on a bad turn is part of a sound pyramid.'],
['A Fish donks into you. His range is usually…',['polarised: nuts or air','depolarised and capped','always the nuts','always a bluff'],1,'Medium hands, rarely the nuts: raise wider for value, bluff-catch with real showdown value.'],
['A Fish min-donks into you on the flop. General approach?',['Fold everything but sets','Treat it almost like a check and raise wider','Always call','Shove'],1,'Min-donks are tiny and the range is usually capped and weak.'],
]},
{id:'combos',ch:'9',title:'Combos and blockers',mins:18,sum:'Counting hand combinations to weigh ranges, comparing value to bluffs, and what your cards block.',
blocks:[
['What a combo is',`<p>A <b>combo</b> is one exact pair of cards: 8♣8♦ is one combo of 88 (the order doesn't matter). There are <b>1326</b> combos in all, each equally likely, but starting hands are not:</p><div class="tbl"><table><tr><th>Hand type</th><th class="num">Combos</th></tr><tr><td>Pocket pair (e.g. QQ)</td><td class="num">6</td></tr><tr><td>Suited (e.g. AKs)</td><td class="num">4</td></tr><tr><td>Offsuit (e.g. AKo)</td><td class="num">12</td></tr><tr><td>Any unpaired hand (AK)</td><td class="num">16</td></tr><tr><td>All starting hands</td><td class="num">1326</td></tr></table></div><p>An unpaired hand is dealt more than twice as often as a pair. A range of just AA and 72 holds AA only 6 / (6 + 16) = <b>27%</b> of the time.</p><p>You'll use combos two ways: to weigh <b>Villain's range</b> and decide against it, and to build <b>your own ranges</b> (Ch. 10 onwards).</p>`],
['Combos pre-flop: the QQ shove',`<p>You 4-bet QQ on the BU and the BB shoves. Say his range is exactly [KK+ AK]. “I’m either flipping or crushed, how can I call?”</p><p>First, the end-of-action step: the call is 76 into a total of 124.5, so <b>RE = 37.9%</b>. You don’t need to be ahead half the time.</p><p>Then weigh the range: AA (6) + KK (6) = 12 combos that crush you, against AK (16 combos) where you are a small favourite. The range leans towards AK, so QQ has <b>39.9%</b>: a call.</p>${KEYBOX('Lesson','“He only shoves strong hands” is not enough. Count how many combos of each he has, then compare your equity with your required equity.')}`],
['Combos post-flop',`<p>Cards on the board and in your hand remove combos:</p><ul><li>A pair that matches <b>one</b> board card: 3 combos left (choose 2 of the 3 remaining). On ${FL('K♠ 7♦ 2♣')}, KK has 3 combos.</li><li>A pair matching <b>two</b> board cards (the board paired): 1 combo.</li><li>An unpaired hand with one card on the board: 3 × 4 = <b>12</b> combos (AK on an ace-high flop).</li><li>Your own cards remove more: holding a J, JJ has just 1 combo left if a J is also on the board.</li></ul>`],
['Comparing value to bluffs',`<p>To decide a river bluff-catch, count both parts of Villain's range. A worked spot: you hold AJ on ${FL('J♠ 6♥ 2♥')}. A tight Reg raises the flop and bets turn and river, and the river pairs the 2. His line is polarised: big hands or draws.</p><ol><li><b>Value</b>: JJ and two pairs are unlikely (he'd 3-bet JJ, rarely flats J6s or 62s, and you hold a J). That leaves sets: 66 has <b>3</b> combos, 22 only <b>1</b> (two 2s are out). <b>4 value combos.</b></li><li><b>Bluffs</b>: missed heart draws. Of the suited hands he flats pre-flop, only one combo each has two hearts, minus any with the J♥, 6♥ or 2♥: about <b>31</b> flush draws. Assume he bluffs only half: <b>about 15</b>.</li><li>He has the best hand 4 / 19 = <b>21%</b> of the time, so you have about 79%. You need 30%: call, easily.</li></ol>`],
['Balance considerations',`<p>In that spot Villain has only 4 value combos, so a balanced river range could hold only a couple of bluffs. Any more and calling becomes clearly profitable. When you see few value combos in a line, expect the player to be <b>over-bluffing</b> unless he is unusually tight.</p><p>The same counting tells you when <i>your</i> lines have too few value hands to be believable.</p>`],
['Blockers',`<p>A <b>blocker</b> is a card that makes certain hands less likely for Villain because it's in your hand (or on the board). In the spot above, the flop's 6 and 2 cut 66 and 22 from 6 combos to 3, and your J cut JJ to 1.</p><ul><li>Good blockers for <b>bluffs</b> remove his strong, calling hands (holding A♠ on three spades means he can never have the nut flush).</li><li>Bad blockers for bluffs remove his <b>folding</b> hands: then he folds less.</li><li>For <b>bluff-catching</b>, it's the reverse: block his value, not his bluffs.</li></ul>`],
['Two effects of a blocker',`<p>AKo on the BU faces a BB 3-bet; you 4-bet and he shoves [JJ+ AK AQs]. Holding 4♣4♦ his range would be 44 combos (24 pairs + 16 AK + 4 AQs). Holding AK you block three AA, three KK and seven AK combos: <b>31 left</b>. That helps twice:</p><ol><li><b>Fold equity</b>: fewer value hands means he folds more often to the 4-bet: 31 / (31 + bluffs) instead of 44 / (44 + bluffs).</li><li><b>Equity when called</b>: the only hands that crush AK are AA and KK, which you block. Against the shove you have about 42%, plenty for the price.</li></ol><p>That's why AK is a standard 4-bet/call: it blocks the hands that hurt it and grabs dead money from the rest. Ch. 10 uses the same idea to choose 3-bet bluffs like AJo, KQo and suited aces.</p>`],
],
quiz:[
['How many combos of AKo?',['4','6','12','16'],2,'4 × 4 = 16 total AK, minus 4 suited = 12.'],
['How many combos of a pocket pair?',['4','6','12','16'],1,'Choose 2 of 4 suits = 6.'],
['A range of only AA and 72. How often does it hold AA?',['50%','27%','6%','73%'],1,'6 AA combos vs 16 of 72: 6/22 ≈ 27%.'],
['QQ vs a shoving range of [KK+ AK]. Why can calling be +EV?',['QQ is always a favourite','AK has 16 combos vs 12 for AA+KK, so the range leans to AK','He might fold','Pot odds don’t matter'],1,'Weighted by combos, QQ has about 40% equity, and needs about 38%.'],
['Flop K♠7♦2♣. How many combos of KK remain?',['1','3','6','4'],1,'One K is on the board, so choose 2 of the remaining 3 = 3.'],
['Board A♥8♣4♦. How many AK combos are possible?',['16','12','9','8'],1,'3 aces left × 4 kings = 12.'],
['Villain’s polarised river line has 4 value combos and about 15 bluff combos. How often is he ahead?',['79%','50%','21%','4%'],2,'4 / 19 ≈ 21%, so a bluff-catcher has about 79%.'],
['For a river bluff, it’s good to block…',['his folding range','his calling range','nothing','your own outs'],1,'Blocking his calls means he folds more often.'],
['You hold AKo. How many combos of [JJ+ AK AQs] can Villain have?',['44','37','31','24'],2,'You block 3 AA, 3 KK and 7 AK combos: 44 − 13 = 31.'],
['Holding AK helps a 4-bet/call in which two ways?',['It raises your fold equity and your equity when called','It makes him fold AA','It lowers the pot','None'],0,'It removes the hands that call and crush you.'],
]},
{id:'3bet',ch:'10',title:'3-betting',mins:26,sum:'Polar and linear 3-bet ranges: when to use each, how to pick value hands, calls and bluffs, how many bluffs, squeezes and sizing.',tool:'polar',toolAt:'First question: polar or linear?',
blocks:[
['First question: polar or linear?',`<p>Before choosing hands, decide the <b>shape</b> of your 3-bet range, like knowing whether you're building a factory or a castle before laying bricks. Building ranges for a spot, rather than reacting to one hand, prepares you for any two cards.</p><ul><li><b>Polar</b>: strong value hands plus bluffs, with a flatting range in between.</li><li><b>Linear</b>: 3-bet the top of your playing range, and flat little or nothing.</li></ul><p>The shape depends heavily on whether you want to flat the open (Ch. 6): from the SB you often flat nothing at all. Try the helper below.</p>`],
['The polar model',`<p>A polar range splits every hand into four groups, from weak to strong:</p><div class="spec"><span>Fold<small>the rest</small></span><span>3-bet bluff<small>top of the folds</small></span><span>Call<small>good enough to flat</small></span><span>3-bet value<small>ahead of his continues</small></span></div><ul><li><b>Value</b>: ahead of the range that <i>continues</i> against your 3-bet, not just his opening range. Find the cut-off; against some players KQs is just good enough and KQo isn't.</li><li><b>Call</b>: not strong enough to 3-bet for value, but good enough to flat. Never waste these as bluffs: you'd fold more hands overall.</li><li><b>Bluff</b>: hands just too weak to call, chosen for <b>blockers</b> (an A or K cuts AA, KK, AK, AQ) and <b>playability</b> when called (suited, connected; suited aces can flop the nut flush draw).</li></ul>`],
['Condition 1: fold equity',`<p>Polar needs bluffs, and bluffs need folds. If the opener rarely folds to 3-bets, or players behind cold-call 3-bets wide, don't bluff and don't go polar.</p><p>The key stat is ${P('purple','Fold to PF 3Bet After Open')}. Around <b>50%</b> is the line where a polar range starts to work; above it, add more bluffs. With a small sample, use the population average for Regs; against a Fish, assume low fold equity.</p><p>Why 50%? BU opens 3bb, you make it 9bb in the BB: you risk 8 (your blind is already in) to win 4.5 → raw RFE = 8 / 12.5 = <b>64%</b>. A bluff with a suited ace or connector still wins some pots when called, so it needs clearly less than that, which lands near 50%.</p>`],
['Condition 2: wanting a calling range',`<p>Polar also needs hands you'd rather flat than 3-bet or fold: hands in good shape against his opening range, or with implied odds (Ch. 6). In position against a Reg who folds enough, both conditions usually hold. From the SB, with short stacks, or with squeezers behind, you often don't want to flat at all, and the range goes linear.</p>`],
['Long-term EV: don’t over-bluff',`<p>If he folds too much, 3-betting any two cards may be +EV in a vacuum. Don't. If you 3-bet 84o you must also be 3-betting 85o, 97o, T4o and the rest, and even a slow player notices and starts playing back. You won't know when that started or how far it has gone.</p>${KEYBOX('Spend your bluffs well','For each value 3-bet you get only so many bluffs before you become exploitable. It doesn’t matter much whether you use them this orbit or the next; it matters which hands you use. Take them from the top of your folding range, with the best blockers and playability.')}<p>Against overfolders, over-bluff, but not so far that your own hole becomes bigger than his.</p>`],
['Choosing 3-bet bluffs',`<p>In the book's BU vs HJ example, the bluffs come in three groups:</p><ul><li><b>Double blockers</b> (AJo, KQo): too weak to flat vs a HJ range, but they cut his strong continuing hands (AA, KK, QQ, JJ, AK, AQ, AJs, KQs) and have two overcards to his 88-TT calls. First choice for fold equity.</li><li><b>Suited aces</b> (A9s, A5s): blockers plus playable equity; A9s covers 9-high boards and A5s low ones.</li><li><b>Suited connectors and gappers</b> (QTs, 98s, 87s): playability when called.</li></ul><p>The more Villain folds, the more blockers matter; the more he calls and sees flops, the more board coverage and playability matter.</p>`],
['How many bluffs?',`<p>A balanced range makes his 4-bet bluffs break even. Say you 3-bet to 8bb over a 3bb open and he 4-bets to about 19bb (2.2-2.5× is typical). His 4-bet bluff risks 16 to win 12.5: RFE = 16 / 28.5 = <b>56%</b>.</p><p>So fold about 56% of your 3-bet range to a 4-bet and continue with 44%: about <b>1.27 bluff combos for every value combo</b>.</p><p>In the book's BU vs HJ range, the value is QQ+ and AK: <b>34 combos</b>. That calls for about 43 bluffs, and the chosen bluffs come to 44: AJo and KQo (24), plus A9s, A5s, QTs, 98s and 87s (20). Drill it: <a href="#ranges/3b-BUvHJ">BU vs HJ</a>; against an overfolding Reg the book uses far more bluffs: <a href="#ranges/3b-BBvBU">BB vs BU</a>.</p>`],
['Linear 3-betting',`<p>Go linear when either condition for polar fails:</p><ul><li><b>Little fold equity</b>: Villain folds to 3-bets well under 50%. Facing Fish is the common case.</li><li><b>No wish to flat</b>: you're in the SB, the effective stack is very short, or known squeezers sit behind.</li></ul><p><b>Against a Fish</b>, 3-bet only for value, but not too tightly: isolating him with hands rich in frequent strength (Ch. 3) is very profitable. Open up more the more he plays fit-or-fold after the flop, and the wider he opens (he defends a lot against 3-bets either way). Don't 3-bet small pairs like 33 to bloat a pot where you'll flop an underpair 87% of the time. Book example: <a href="#ranges/3b-COvUTG">CO vs a UTG Aggro Fish</a>, with a calling range kept for hands that play better as flats.</p><p><b>From the SB</b> against a CO who folds a lot, 3-bet or fold, splitting the range into hands that shove over a 4-bet and hands that fold to one. The range is still linear because there is no flatting range: <a href="#ranges/3b-SBvCO">SB vs CO</a>.</p>`],
['An in-game flowchart',`<p><b>Polar</b>: good enough to 3-bet for value? → 3-bet. If not, good enough to call? → call. If not, a good 3-bet bluff? → 3-bet, else fold.</p><p><b>Linear</b>: good enough to 3-bet? → 3-bet. If not, do I want to call? → call, else fold.</p><p>Drill the book’s ranges: <a href="#ranges/mix-3-bet">3-bet spots</a>.</p>`],
['Squeezing',`<p>A 3-bet after an open and one or more callers. The caller's range is capped, so fold equity is often good. Squeezes are sized larger since there's more dead money and more players.</p><p>Three kinds: <b>bluff-bluff</b> (fold equity against both), <b>value-bluff</b> (value vs a calling Fish, a bluff vs a Reg who folds: it isolates the Fish) and <b>value-value</b> (ahead of both when called).</p><p>Multiway changes hand values. Hands with nut potential (JTs, 55) gain and prefer to flat cheaply. Big offsuit hands lose value multiway, so they make good double-blocker squeeze bluffs.</p>`],
['3-bet sizing',`<div class="tbl"><table><tr><th>Spot</th><th class="num">vs 2bb</th><th class="num">vs 2.5bb</th><th class="num">vs 3bb</th><th class="num">vs 4bb</th></tr>
<tr><td>In position</td><td class="num">6.5</td><td class="num">7</td><td class="num">8</td><td class="num">11</td></tr>
<tr><td>Out of position</td><td class="num">7</td><td class="num">8</td><td class="num">10</td><td class="num">12</td></tr>
<tr><td>IP squeeze</td><td class="num">8</td><td class="num">10</td><td class="num">11</td><td class="num">12</td></tr>
<tr><td>OOP squeeze</td><td class="num">9</td><td class="num">11</td><td class="num">12</td><td class="num">13</td></tr></table></div><p>Bigger out of position, bigger with callers in, and adjusted for stack depth (vs short stacks, size so a light shove isn't cheap).</p>`],
['Sizing concepts',`<ul><li><b>RFE vs FE</b>: tiny 3-bets need few folds but get few; huge ones get folds but need too many. Aim for the size where a bluff earns most.</li><li><b>Balanced sizing</b>: against Regs use one size for value and bluffs.</li><li><b>Pot and implied odds</b>: too small a size lets Villain set-mine and call with suited connectors.</li><li><b>Position</b>: bigger out of position. Against bigger opens you can size relatively smaller, as the SPR is already lower.</li></ul>`],
],
quiz:[
['A reg opens CO and folds to 3-bets 65%. You’re on the BU and want to flat some hands. Range shape?',['Linear','Polar','Call only','Fold everything'],1,'Fold equity plus a desire to flat points to polar.'],
['A loose passive Fish opens. Your 3-bet range should usually be…',['Polar with many bluffs','Linear, built for value','Only AA/KK','Never 3-bet'],1,'Limited fold equity means you 3-bet hands that are ahead, not bluffs.'],
['In the polar model, which hands become 3-bet bluffs?',['The weakest hands you’re dealt','The best hands that are too weak to call','Hands good enough to call','Only suited connectors'],1,'Fold → bluff → call → value: bluffs come from the top of the folds.'],
['A 3-bet is for value when your hand is ahead of…',['his opening range','the range that continues against the 3-bet','a random hand','his folding range'],1,'Same rule as any value bet: ahead of the calls.'],
['About what Fold to 3-Bet stat makes a polar range start to work?',['20%','35%','50%','80%'],2,'Around 50%: raw RFE is higher, but bluffs with playability win some pots when called.'],
['BU opens 3bb, you 3-bet to 9bb from the BB. Raw RFE?',['50%','56%','64%','75%'],2,'Risk 8 (your blind is already in) to win 4.5: 8 / 12.5 = 64%.'],
['He folds too much to 3-bets. Why not 3-bet 84o?',['It has no blockers','You’d have to bluff a huge range; he’d notice and adjust, so spend your limited bluffs on better hands','It’s illegal','It’s too strong'],1,'Long-term EV: pick the best bluffs, don’t widen without limit.'],
['Villain’s 4-bet bluff needs 56% folds. For balance, roughly how many bluff combos per value combo?',['0.5','1','1.27','3'],2,'Fold 56%, continue 44%: 56/44 ≈ 1.27.'],
['Which hands does the book pick first as 3-bet bluffs for fold equity?',['Small pairs','Double blockers like AJo and KQo','Any two suited','Hands that would call anyway'],1,'They block the strong hands Villain continues with.'],
['Why use a linear range from the SB more often?',['The SB has position','You rarely want to flat from the SB','SB opens are always weak','You can’t 4-bet from the SB'],1,'Flatting out of position with the BB still to act is unattractive, so 3-bet or fold.'],
['In a multiway squeeze spot, which hand is better flatted than squeezed as a bluff?',['AJo','KQo','JTs','ATo'],2,'Nut-potential hands gain multiway and like a cheap flop; big offsuit hands make the better bluffs.'],
['IP 3-bet size vs a 2.5bb open?',['6.5bb','7bb','8bb','10bb'],1,'From the sizing table: 7bb.'],
['Why use the same 3-bet size for value and bluffs against Regs?',['It’s required by the rules','Different sizes give away your hand','Bluffs need bigger sizes','To lower rake'],1,'Balanced sizing keeps aware players from reading your range by the size.'],
]},
{id:'f3b',ch:'11',title:'Facing 3-bets',mins:24,sum:'Flatting, 4-betting, minimum defence, preemptive adjustments, squeezes and cold 3-bets.',
blocks:[
['From hunter to prey',`<p>Move up a level and it can feel as if every open gets 3-bet: call and you miss and fold a big pot, 4-bet and they shove, fold and you're being run over. This chapter builds the tools: what makes a flat +EV, polar 4-bet ranges, how much of your range to defend, and the adjustments that stop it happening in the first place.</p>${KEYBOX('The EV goal','When you open 3bb and fold to the 3-bet, you lose 3bb. A defence only has to lose <b>less</b> than that from the point you decide. Marginal opens are meant to lose money when 3-bet; that doesn’t mean they should fold.')}`],
['Flatting 3-bets',`<p>Check the factors from the top; implied odds come last:</p>`+GB(['In position','Frequent strength good vs Villain\'s range','Good versatility','Known post-flop weaknesses in Villain'],['Out of position','Frequent strength poor vs Villain\'s range','Poor versatility','No known post-flop weaknesses'])+`<ul><li><b>Position</b> is a huge factor: floating, getting to showdown and picking up pots when both miss are all easier.</li><li><b>Frequent strength</b> must be judged against his <i>3-bet</i> range. KQo dominates an 18% BB 3-bettor and is crushed by a 4% one. Use his 3-bet stat by position, not his overall number.</li><li><b>Versatility</b>: hands that flop draws as well as pairs (A8s) defend better than rigid ones.</li><li><b>Villain's weaknesses</b>: if he c-bets and gives up, or over-barrels, your calls gain.</li><li><b>Implied odds</b> last: paying 6-8bb to see a flop with 100bb stacks rarely gives the ~10× payout the set-mining rule needs, so rigid hands like 77 are often folds.</li></ul>`],
['Polar 4-betting',`<p>Against Regs, 4-bet a <b>polar</b> range: value hands, plus bluffs from the top of your folding range. A hand like AQo that can't flat a 3-bet profitably out of position makes a good 4-bet bluff: it blocks his value [QQ+ AK]. Suited hands with an ace, like A5s, add playability.</p><ul><li>4-bet to about <b>2.2-2.5× the 3-bet</b>.</li><li>Raw RFE example: 4-bet risking 19 to win 13.5 needs 19 / 32.5 = <b>58%</b> folds, less once you count the times he flats.</li><li>AK is the classic 4-bet/call: its blockers cut his shoving range and its equity against it (Ch. 9).</li></ul>`],
['Minimum defence frequency (MDF)',`<p>If Villain's 3-bet bluffs need X% folds to break even, defending (calling + 4-betting) about 1 − X of your opening range stops automatic profit. Opening ranges that you can't defend properly invite exploitation, so open a bit tighter against frequent 3-bettors.</p>`],
['Building a balanced defence',`<p>Work out how often you must defend so that Villain’s light 3-bets break even. In the book’s CO vs SB model, the SB risks 8.5bb to win 4bb: RFE 68%. Knock off 10-15% for the equity his bluffs keep when called, so he profits if you fold more than about 55%: <b>defend about 45%</b> of your opening range.</p><p>Fill that 45% with value 4-bets, flats, and 4-bet bluffs taken from the top of your folding range (best blockers and playability), without letting the bluffs outnumber the value by too much. Drill it: <a href="#ranges/f3-COvSB">CO vs SB</a>.</p>`],
['Unbalanced defence',`<p>Leave balance when:</p><ul><li>Villain is a <b>passive Fish</b>: tighten up and drop 4-bet bluffs completely (<a href="#ranges/f3-HJvSB">HJ vs SB Fish</a>);</li><li>a Reg 3-bets wildly: defend <b>more</b> than MDF (<a href="#ranges/f3-BUvBB">BU vs BB</a>);</li><li>the pool rarely folds to 4-bets: use a <b>linear</b> 4-bet range you can call a shove with.</li></ul><p>Against unaware players, the best play in a vacuum is also best in the long run.</p>`],
['When to leave balance',`<p>Exploit instead of balancing when: (A) Villain is badly unbalanced, (B) the pot is big, (C) the spot is rare, or (D) Villain isn't the type to notice or adjust.</p>`],
['Preemptive adjustments',`<p>The best defence is not to be in the spot. Before you open into light 3-bettors:</p><ol><li><b>Open tighter</b>, especially out of position or with several aggressive Regs behind. If the BU 3-bets 15% and the SB 13%, a CO open gets 3-bet 1 − (0.85 × 0.87) = <b>26%</b> of the time before counting the BB. The weakest opens can't survive that.</li><li><b>Open smaller.</b> Opening 2bb instead of 3bb means folding costs less. It also gives the 3-bettor a dilemma: a 6.5bb 3-bet keeps his RFE about the same (65%) but leaves you a deeper stack-to-pot ratio and more implied odds; an 8bb 3-bet takes those away but raises his RFE to 8 / 11.5 = 70%.</li><li><b>Flat more in position</b>: light 3-bettors often c-bet once and give up.</li><li><b>Move table</b> if the spot is bad enough: position and table selection beat fighting uphill.</li></ol><p>You don't have to tighten when a more profitable counter exists, such as being in position against a Reg who folds too much to 4-bets.</p>`],
['Facing squeezes',`<p>With 100bb stacks you fold more vs a squeeze than vs a plain 3-bet: the effective stack is smaller relative to the call, so implied odds shrink. Favour <b>frequent strength</b> (KQs, JJ) over implied odds (98s, 77).</p><ul><li><b>As the opener</b> (uncapped range): either a polar 4-bet range with a capped calling range, or no 4-bets and flat everything you continue with. Flat-only suits spots where a weak caller will often stay in the pot.</li><li><b>As the caller</b> (capped range): you have no value to 4-bet, so it’s call or fold, and you’ll fold a lot. That’s fine: the opener carries most of the defence.</li></ul>`],
['Facing a 3-bet cold',`<p>You have only a blind in when the 3-bet reaches you.</p><ul><li><b>Steal spots</b> (CO or later opened): ranges are wide, so <b>4-bet or fold</b>. Don’t cold-call: your range is capped, a player still acts behind, and the price with 1bb in is poor. The book’s range: value AA-JJ and AK, bluffs AQ, AJ, KQ for their blockers.</li><li><b>Non-steal spots</b> (UTG or HJ opened): ranges are strong and Regs 3-bet mostly for value. Cold 4-bet bluffs don’t work; flat only a tiny strong range (the book: JJ+ and AK) and fold the rest.</li></ul>`],
],
quiz:[
['You open 3bb and get 3-bet. A call is worthwhile if…',['it wins money overall','it loses less than the 3bb folding loses','you hold a premium','you’re in the blinds'],1,'Judge from your point of decision: less red than folding is enough.'],
['Which factor most favours flatting a 3-bet?',['Out of position','Poor versatility','Being in position','Villain has no leaks'],2,'Position makes realising equity much easier.'],
['KQo facing a 3-bet. It’s a much better flat against…',['a 4% 3-bettor','an 18% 3-bettor','anyone','a Fish who never 3-bets'],1,'Frequent strength is relative to his 3-bet range.'],
['Why are implied odds a weak reason to flat a 3-bet 100bb deep?',['Sets are rarer after a 3-bet','You pay 6-8bb to see the flop, so the payout needed is huge','3-bettors never pay off','They’re the strongest reason'],1,'The set-mining rule needs about 10× the call, which deep enough stacks rarely give here.'],
['Which hand makes a good 4-bet bluff vs a [QQ+ AK] value range?',['76s','AQo','22','KJs'],1,'It blocks AA, AK and QQ-type value, and is too weak to flat profitably out of position.'],
['Typical 4-bet size relative to the 3-bet?',['1.5x','2.2–2.5x','3–4x','Always shove'],1,'Around 2.2–2.5x the 3-bet is standard at 100bb.'],
['Villain needs you to fold 55% for his light 3-bets to break even. Roughly how much of your opening range should you defend?',['25%','45%','55%','100%'],1,'MDF is 100% minus the folds he needs: about 45%.'],
['When is leaving balance to exploit most justified?',['Common small pots vs aware regs','Rare, big spots vs players who won’t adjust','Always','Never'],1,'Big, rare spots vs unaware players have little long-term downside.'],
['BU 3-bets 15% and SB 13%. How often does your CO open meet a 3-bet from one of them?',['13%','15%','26%','28%'],2,'1 − (0.85 × 0.87) ≈ 26%.'],
['Against a very light 3-bettor, one preemptive adjustment is…',['Open bigger with weak hands','Open tighter and/or smaller','Limp more','Never fold to 3-bets'],1,'Tighter, smaller opens are easier to defend and cheaper to fold.'],
['BU opens, SB 3-bets, you’re in the BB with only your blind in. Default plan?',['Cold-call a wide range','4-bet or fold','Call everything','Always fold'],1,'In steal spots, cold-calling leaves you capped with a poor price, so 4-bet (value and blocker bluffs) or fold.'],
['Facing a squeeze with 100bb stacks, which is the better defend?',['77','98s','KQs','54s'],2,'Implied odds shrink vs a squeeze, so frequent strength beats set-mining.'],
]},
{id:'barrel',ch:'12',title:'Bluffing the turn and river',mins:24,sum:'Which hands keep bluffing after a called c-bet, triple barrels, delayed c-bets, turn probes and bluff-raises.',
blocks:[
['Vacuum or long term?',`<p>Once a light c-bet is called, which hands should keep bluffing? This chapter covers double and triple barrels, delayed c-bets, probing the turn when you didn't raise pre-flop, and bluff-raising.</p><p>Two ways to decide:</p><ul><li><b>Best in a vacuum</b>: against unaware Fish, and in rare spots nobody can learn from.</li><li><b>Best long-term range</b>: against competent players and in spots that recur so often that even weak players see patterns.</li></ul>${KEYBOX('Results lie','A bluff that gets a fold isn’t proof it was good; it depends on which part of his range he held. Judge bluffs by their factors, not the outcome.')}`],
['Double barrel factors',`<p>The factors differ by opponent, because fold equity depends so much on who you face:</p><div class="tbl"><table><tr><th>vs Regs: good</th><th>vs Regs: bad</th><th>vs Fish: good</th><th>vs Fish: bad</th></tr>
<tr><td>Turn improves Hero's range</td><td>Turn doesn't</td><td>Turn looks scary</td><td>Turn doesn't</td></tr>
<tr><td>Good equity</td><td>Poor equity</td><td>Good equity</td><td>Poor equity</td></tr>
<tr><td>River fold equity</td><td>None</td><td>Scary river cards exist</td><td>None</td></tr>
<tr><td>Fit-or-fold Reg (tight, folds to 3-bets 65-75%, low WTSD)</td><td>Warring Reg (3-bets a lot, WTSD 27%+, WWSF 50%+)</td><td>Timid Fish (e.g. 41/9, folds to c-bets 60%+)</td><td>Non-timid Fish (e.g. 80/45, 55/7)</td></tr>
<tr><td>Low fold to F Cbet</td><td>High fold to F Cbet</td><td>Low fold to F Cbet</td><td>High fold to F Cbet</td></tr>
<tr><td>No SDV</td><td>SDV</td><td>No SDV</td><td>SDV</td></tr></table></div>`],
['Factor 1: the turn card',`<p><b>Regs</b> read your <i>range</i>. On ${FL('J♠ T♦ 4♣')}, a 9♦ turn gives your JT a straight and J9 or T9 showdown value, so a second barrel holds less air than it would on a 4: a competent Reg folds A8 more often. <b>Fish</b> try to put you on one hand. They fold to obvious scare cards (a big overcard: “he has AK”; a flush card), not to cards that only improve your range on paper.</p><ul><li>A <b>blank</b> turn barely changes a Fish's flop calling range: he rarely folds.</li><li>Against Regs with no read, your betting range should shrink from flop to turn on every card. Turns that improve your range let you keep more bluffs; others mean fewer, chosen for equity.</li><li>Against Fish, barrel mainly for value, unless you know he can fold a weak pair or draw.</li></ul>`],
['Factors 2 and 3: equity and river fold equity',`<p><b>Equity</b> makes a turn bluff far cheaper. Raw RFE for betting 8 into 11 is 8 / 19 = <b>42%</b>, but a hand that makes a near-nut hand on 12 of 46 rivers (26%) wins the pot plus a river bet when it gets there, so it needs only a sliver of fold equity. Choosing turn bluffs by equity also keeps your bluffing frequency under control.</p><p><b>River fold equity</b>: barrel the turn more when many rivers will scare Villain's calls (overcards and scare cards that fit your range).</p>`],
['Factors 4-6: player, floats and SDV',`<ul><li><b>Fit-or-fold Reg</b> (e.g. 19/16, folds to 3-bets 65-75%, WTSD under ~25%): widen your bluffs and turn more weak showdown value into bluffs.</li><li><b>Warring Reg</b> (3-bets a lot, WTSD 27%+, WWSF 50%+): tighten bluffs and widen value. Don't fight fire with fire.</li><li><b>Timid Fish</b> (e.g. 41/9 or 34/11, folds to c-bets 60%+): more fold equity than most Fish, on big texture changes only.</li><li><b>Non-timid Fish</b> (e.g. 80/45, 55/7, 49/36): hate folding; barely bluff them.</li></ul><p><b>Fold to F Cbet</b>: someone who calls flops wide (a low stat) has a weak turn range, so barrel lighter. Competent Regs float wide in position, so don't give up on every safe turn; a roughly 1:1 bluff-to-value turn range is a sound start (Ch. 13).</p><p><b>SDV</b>: the less your hand can win at showdown, the more it gains by bluffing.</p>`],
['Triple barrels',`<p>Many low-stakes Regs fire the third barrel only with value. That works against Fish, who call rivers because showdown is one click away, but it is very exploitable by solid players. River factors:</p><ul><li><b>The river card</b>: now only <i>made</i> hands improve your range; a four-flush is useless with no cards to come.</li><li><b>SDV</b>: no protection on the river, so any showdown value is a reason to check, not bluff.</li><li><b>Blockers</b>: bluff with hands that block his <i>calls</i> and not his <i>folds</i>. On a river where flushes and KJ are his calling hands, A♥J♠ (blocking the nut flush and KJ) is a far better bluff than 8♣5♣, though both have no showdown value.</li><li>Against Fish blockers matter less: they call with hands you'd never expect.</li></ul>`],
['Delaying the c-bet',`<p>Check the flop, bet the turn. Checking is a range-limiting action, not a procedural one, and three reasons make it better than an immediate c-bet:</p><ol><li><b>A flop c-bet is -EV, a delayed one isn't.</b> His range hits the flop too well, but checked to, he leads his value hands on the turn. If he checks again, he rarely has the top of his range.</li><li><b>A flop c-bet is +EV, the delay is better.</b> Against rigid fit-or-fold players with no turn bluffs, checking first gathers information before you take the fold equity.</li><li><b>You planned to give up, but the turn improves your range</b> and with it your fold equity.</li></ol>`],
['Probing the turn',`<p>The pre-flop raiser checks back the flop and you lead the turn. Many Regs, even at 100NL-200NL, check back too weak a range and fold the turn too often, so probe actively on boards where they play fit-or-fold.</p>`+GB(['His check-back range is mostly air','Good equity','No SDV','Turn card doesn\'t help him'],['His check-back range is mostly SDV','Poor equity','SDV','Turn card helps him'])+`<ul><li><b>His check-back range</b> depends on texture and player: on great c-bet boards most players bet their air, so a check means showdown value; passive Fish and nitty players check air more.</li><li><b>Equity</b> helps a lot when the spot is close.</li><li><b>SDV</b>: don't bluff with hands that already beat everything that folds, unless it's vulnerable and you bet for protection.</li><li><b>The turn card</b>: some turns improve his checked range; probe those less.</li></ul>`],
['Bluff-raising the turn and river',`<p>A flop float often has to be cashed in by raising, because Villain bets again rather than checking the pot to you.</p><ul><li>Bluff-raise the turn when your draw no longer has the odds to call, more often <b>out of position</b>, where calling is worse.</li><li>In position you can often wait and do your raising on the river instead.</li><li>Only against players who can fold. Passive Fish rarely barrel wide, and don't fold what they barrel.</li></ul><p>Example: a weak-tight Reg opens HJ, c-bets, then makes a small scared bet when the turn completes the obvious draw. His range is capped around overpairs (99, JJ-AA, ATs, KTs). With a big draw in position, <b>raise</b>: calling and bricking the river leaves one bet against his bluff-catchers; raising now folds hands that beat you on most rivers.</p>`],
],
quiz:[
['Against a Station Fish, multi-street bluffs are usually…',['Great','Poor; he doesn’t fold','Fine with SDV','Required'],1,'Non-timid Fish hate folding; barrel them for value.'],
['Vs a reg, which turn card is good for a double barrel?',['One that improves your perceived range','One that pairs the bottom card and helps his calls','A blank that changes nothing','Any card'],0,'Barrel cards that shift range advantage to you.'],
['Against a Fish, which turn gives your bluff most fold equity?',['A blank','A card that only improves your range on paper','An obvious scare card like an ace','A low card that pairs the board'],2,'Fish fold to cards that scream “he has it”, not to subtle range shifts.'],
['Betting 8 into 11 has a raw RFE of 42%. With 12 clean outs to a near-nut hand on the river, the fold equity you need is…',['higher','about 42%','much lower','zero always'],2,'You win the pot plus a river bet 26% of the time when called.'],
['Against a Warring Reg who 3-bets a lot and goes to showdown often, your turn barrels should be…',['more bluff-heavy','value-heavy, with fewer bluffs','the same as vs anyone','only with air'],1,'Don’t fight fire with fire: tighten bluffs and widen value.'],
['A low Fold to F Cbet stat means Villain’s turn range is…',['stronger','weaker: he called the flop wide','irrelevant','always a draw'],1,'Wide flop calls leave more weak hands to fold on the turn.'],
