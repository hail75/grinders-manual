['On the river, a hand with some showdown value should usually…',['bluff for protection','check rather than bluff','overbet','fold'],1,'No protection on the river: any SDV is a reason not to bluff.'],
['For a river bluff, it’s good to block…',['his folding range','his calling range','nothing','your own outs'],1,'Blocking his calls means he folds more often.'],
['Which river bluff is better on a board where flushes and KJ call: A♥J♠ or 8♣5♣?',['8♣5♣: less SDV','A♥J♠: it blocks his calling hands','Both the same','Neither can bluff'],1,'Both have no SDV relative to his range; A♥J♠ blocks the nut flush and KJ.'],
['A delayed c-bet works when the flop c-bet is -EV because…',['he leads his value hands on the turn, so a second check shows weakness','delayed bets are bigger','he can’t call twice','it’s always balanced'],0,'Checking lets him show strength; when he doesn’t, fold equity rises.'],
['A turn probe works best when his flop check-back range is…',['weighted toward SDV','weighted toward air','very strong','unknown'],1,'Air gives up to the probe.'],
['When is a turn bluff-raise better than calling with a draw?',['In position with great odds','Out of position, when calling no longer pays and he can fold','Against a passive Fish','Never'],1,'Out of position calling realises less, and fold equity is needed.'],
]},
{id:'3bp',ch:'13',title:'3-bet pots and balance',mins:24,sum:'C-betting, value betting and bluffing at low stack-to-pot ratios, and balancing your betting and calling ranges.',
blocks:[
['Size first',`<p>In earlier chapters you decided whether to c-bet, then how big. In 3-bet pots, reverse it: the stack is small relative to the pot, so <b>choose the size first</b>, then which hands bet it.</p><p>In a single raised pot of about 6bb, a ⅔-pot c-bet and a pot-sized turn bet still leave an overbet of 75-80bb for the river. In a 3-bet pot of about 20bb, a c-bet of just 9bb makes a 36bb turn pot, easy to set up a river shove from.</p><p>Small c-bets lower the RFE of your light c-bets and cost your value hands nothing, so 3-bet pots are often <b>more</b> c-bettable than single raised pots. Against players who stab a lot when checked to (high Float Flop), keep a checking range and check/call some flops.</p>`],
['C-betting light',`<p>Lower RFE lets you c-bet wider, but not always. A Villain who flats your 3-bet <b>out of position</b> has a tight, strong, uniform range (pairs, AK, AQ, good suited broadways). On boards that hit it, most of your fold equity takes more than one street to collect, so be selective and check some air.</p><p>A Reg who flats very wide on the <b>BU vs your BB</b> has many unpaired hands. On low boards that miss them, c-bet light freely. Few of his small pairs or baby suited hands flat 3-bets at all.</p>`],
['Value in 3-bet pots',`<p>Value ranges for getting stacks in are <b>wider</b> than in single raised pots:</p><ul><li>The lower stack-to-pot ratio commits Villain with weaker hands too.</li><li>His flatting range is often capped below the hands that beat you, so you can value-bet with impunity.</li></ul><p>Top pair is often enough to go all in. The more often you hold the best hand, the thinner you can bet.</p>`],
['Bluffing: the balancing principle',`<p>Ranges in 3-bet pots are smaller and easier to count. On the river, a balanced polar bet makes Villain indifferent to calling: the <b>share of bluffs in your betting range equals Villain’s required equity</b>.</p><p class="formula">bluffs / (value + bluffs) = RE</p><p>Example: shoving 59 into 82.5 gives Villain an RE of 29.4%. With 16 value combos you want X / (16 + X) = 0.294, so about <b>7 bluff combos</b>. Bigger river bets raise his RE and let you bluff more, which is why polar ranges like big sizes.</p><p>Template: 1) is a polar bet right here? 2) count your value combos; 3) solve for the bluffs; 4) pick the bluffs.</p><p>Don't skip bluffs out of fear alone: it can just as easily turn out there was plenty of fold equity.</p>`],
['Choosing the bluffs',`<p>Two guidelines:</p><ol><li><b>Less showdown value</b> bluffs better: a hand that wins at showdown gains little by betting.</li><li><b>Block his calls, not his folds.</b></li></ol><p>Worked example: on the turn you bet AA, KK, A2s, A3s and KQo. The river is the 2♥. A3s makes a straight and moves into your value range, and A2s drops to 3 combos (one 2 is gone). Your bluff candidates are KQo (4) and A2s (3): exactly the <b>7</b> the formula asks for, so on this river you follow through with all of them.</p>`],
['Before the river',`<p>On the turn your bluffs still have outs, so the river formula undercounts them. The book's <b>semi-bluffing adjustment</b>: add about 10% to Villain's RE before you solve for bluffs.</p><p>Example: betting 22 into 38.5 gives a raw RE of 22 / 82.5 = 27%; with KQo (6 outs) and A2s-A3s (7 outs) as semi-bluffs the target becomes about <b>37%</b>. Betting bluffs and value 1:1 (50% bluffs) is more than that, so a bluff-catcher's call is +EV for him: either drop some bluffs or bet bigger to raise his RE.</p>`],
['Bluff-heavy 3-betting vs overfolders',`<p>Against a player who folds to 3-bets 68% of the time, the book 3-bets BB vs UTG with only 12 value combos and 40 bluffs, a ratio of 3.33:1. Very exploitative, but justified by how much he folds and how rarely the spot reveals your range. Bluffs again come from the best of your would-be folds: A2s-A5s beat A8s-A9s because they flop more straight draws and keep the same blocker.</p>`],
['As the defender',`<p>Your calling range is balanced when Villain’s bluffs are 0EV for him. On the river that gives a simple rule:</p>${KEYBOX('Calling to make him indifferent','Work out his RFE for the bet, then call (100 − RFE)% of your river range, choosing the calls by showdown value first and blockers second.')}<p>Book example: Villain bets 55 into 89.5 → RFE = 55 / 144.5 = <b>38%</b>. Your river range is 43 combos (eight suited aces = 24, AQo and AJo = 18, and quads 1), so call 62% of them: about <b>27 combos</b>.</p><ul><li>Call with the hands that beat the most bluffs.</li><li>Prefer hands that block his value range and don't block his bluffs. Against a fully polarised range (flushes or air) every bluff-catcher has the same SDV, so the one that blocks flushes most calls first.</li></ul><p>Pre-flop, a default CO vs BB defence is just under half of a ~30% CO open. On the flop defend Ax, the better pairs and some broadways with backdoor draws; light 3-bettors often c-bet once and give up, so floating in position is strong.</p>`],
['Balance vs exploitation',`<p>Use balance against aware Regs in common spots. Leave it when Villain is badly unbalanced, the pot is big, the spot is rare, or he won't adjust: then the best play in a vacuum is also best in the long run.</p>`],
],
quiz:[
['Why can smaller c-bets work in 3-bet pots?',['Fish fold more','The low SPR still lets stacks go in by the river, with lower RFE','The rake is lower','They’re always balanced'],1,'With less behind, a smaller bet still threatens stacks.'],
['Villain flats your 3-bet out of position with a tight range. On a board that hits it, you should…',['c-bet your whole range','be selective and check some air','always shove','fold'],1,'His uniform strong range doesn’t fold enough to one bet.'],
['Why can you stack off lighter in a 3-bet pot?',['3-bet pots have less rake','The low SPR commits Villain with weaker hands, and his range is often capped','Villain always bluffs','You can’t'],1,'Smaller relative stacks mean weaker hands get it in.'],
['River: Villain needs 25% equity to call your polar shove. Balanced, what share of your shoving range is bluffs?',['10%','25%','50%','75%'],1,'The balancing principle: bluff share = Villain’s required equity.'],
['You have 16 value combos and Villain’s RE is about 29%. Roughly how many bluff combos balance the bet?',['3','7','16','29'],1,'X / (16 + X) = 0.294 gives X ≈ 6.7.'],
['Which makes the better river bluff?',['A hand with some SDV that blocks his folds','A hand with no SDV that blocks his calls','Any hand','The strongest hand you have'],1,'Low SDV gains most from a bluff; blocking calls adds fold equity.'],
['On the turn, why bet more bluffs than the river formula allows?',['Turns are bigger','Your bluffs still have outs: add about 10% to his RE','To get stacks in','Villain always folds turns'],1,'The semi-bluffing adjustment.'],
['Villain bets with an RFE of 38%. Balanced, how much of your river range should call?',['38%','50%','62%','100%'],2,'Call 100 − RFE: 62%.'],
['As the defender, which hand makes the best bluff-catcher?',['One that blocks his bluffs','One that blocks his value hands and not his bluffs','The weakest hand you have','Any pair'],1,'Blocking value and unblocking bluffs raises the share of bluffs you face.'],
['Against a light 3-bettor who c-bets and gives up, in position you should…',['fold more','defend wider and float more','4-bet everything','check-raise always'],1,'Make his single barrels unprofitable.'],
]},
{id:'stack',ch:'14',title:'Stack depth',mins:22,sum:'How deep and shallow stacks change pre-flop and post-flop play, with the maths for short-stack shoves.',
blocks:[
['Deep pre-flop: more implied odds',`<p>With more behind, implied odds grow. You need to hit big less often for a call to pay, so flat more opens and more 3-bets with <b>nut-potential</b> hands: pairs, suited connectors, suited aces.</p><p>Example: 86s against a Fish's open. At 100bb it's a fairly quick fold; 200bb deep, in position, you can win far more when you hit (big flop raises, big pots), so it becomes a call. The same goes for a hand like 44 facing a 3-bet: it either flops the world or nothing, and deep stacks pay the world.</p>`],
['Deep pre-flop: edges grow',`<p>Implied odds aren't the only thing that grows. <b>Skill edges</b> and <b>positional edges</b> grow with the stack too. That makes bloating big pots out of position without a clear equity edge undesirable against competent players.</p><ul><li>Thin value 3-bets get worse deep: QQ is a happy 3-bet and get-in at 100bb, but deep and out of position against a strong range it may play better as a call or a smaller pot.</li><li>One-pair hands lose value; nut potential and versatility gain.</li><li>Sitting 300bb deep with a tough aggressive Reg on your left? Often just leave.</li></ul>`],
['Shallow pre-flop: short stacks',`<p><b>10-20bb “pest” stacks</b> shove or fold. When one sits in the blinds, keep opening your playable hands, but <b>open small (about 2x)</b>: you lose less when he shoves and you fold, and he can't flat profitably with so little behind. Calling his shove is an end-of-action spot: call 14 into 20.5 needs 40.5% equity, and against a 20% shoving range 98s has about 37%, so fold.</p><p><b>40bb 3-bettors.</b> When you open and a 40bb stack 3-bets, a shove risks 37.5bb to win 10bb: raw RFE 79%. Still, hands with decent equity shove profitably:</p><p class="formula">55 vs a 15% 3-bettor who calls with the top 7.5%: folds 50% → +5bb; called 50% with 37% of 81.5bb → −3.67bb; total +1.33bb</p><p>Open bigger and you get a better price to shove (defend wider, but tighten your opens); open smaller and calling gains. In general shallow play favours good pair potential, linear 3-bet/shove ranges and fewer speculative calls.</p>`],
['Deep post-flop',`<ul><li><b>In position, build away</b>: raise flops with sets, straights and nut draws (the nut flush draw thrives deep: Villain can't turn the nuts against it), and use position to apply pressure on later streets. Your positional “hammer” is worth most when stacks are deep.</li><li><b>Out of position, control the pot</b>: don't check/call a huge stack away with one pair against unknown bluffing. Make one hard decision in a controlled pot rather than three.</li><li>Big pots need big hands: be careful stacking off with one pair. Expect bigger swings.</li></ul>`],
['Shallow post-flop',`<ul><li><b>Room to check</b>: with fewer bets left, you can check a flop or turn and still get stacks in later. In a 4-bet pot you can even check your whole range on the flop without being exploitable.</li><li><b>Stack off lighter</b>: top pair and decent draws are often good enough to get it in. A short-stacked all-in often just means “I have a pair or a draw”.</li><li><b>Play draws as semi-bluffs</b>: shoving takes any fold equity and guarantees you see all five cards, so you realise your full equity. With a strong draw that would have to check/call anyway, the shove is usually better.</li></ul>`],
['Why it matters',`<p>Avoiding non-standard stacks gives up EV. Favourable deep and shallow spots are where a lot of money is. Learn to adapt instead: review your own deep and short-stacked hands and build ranges for the depths you meet most.</p>`],
],
quiz:[
['Which attribute gains most value when stacks get deeper?',['Good pair potential','Nut potential','High card strength','Suitedness only'],1,'Bigger pots need bigger hands, so nut potential rises.'],
['200bb deep in position vs a Fish, which hand gains most as a flat?',['ATo','KJo','86s','QTo'],2,'Deep stacks reward nut potential: implied odds go up.'],
['Why are thin value 3-bets out of position worse deep?',['Rake','Skill and positional edges grow with the stack','Deep players never fold','They aren’t'],1,'Bloating pots out of position hands the bigger edge to the player in position.'],
['A 15bb stack sits behind you and shoves a lot. Your open size should be…',['bigger, to punish him','smaller, around 2x','a limp','unchanged'],1,'Opening small loses less each time he shoves and you fold.'],
['Calling a short-stack shove needs 40.5% equity. You have 37% against his range. You should…',['call','fold','raise','it depends on position'],1,'End of action: below your required equity, fold.'],
['Shoving 37.5bb to win 10bb has a raw RFE of about…',['50%','64%','79%','90%'],2,'37.5 / 47.5 ≈ 79%, but equity when called lowers what you need.'],
['With 25bb effective, set mining a 3x open is…',['better than usual','worse; implied odds are small','unchanged','required'],1,'Not enough behind to get paid when you hit.'],
['Deep and in position with the nut flush draw on the flop, the book prefers to…',['fold','check behind','raise and build the pot','min-bet'],2,'Nut draws thrive deep and position lets you apply pressure later.'],
['Shallow post-flop with a big draw and some fold equity, the book prefers to…',['check/call and see','shove as a semi-bluff','fold','min-bet'],1,'The shove adds fold equity and lets you realise your whole equity.'],
]},
];

function toolHTML(t){
  if(t==='steal')return `<div class="tool"><h3>Steal calculator</h3>
  <div class="row"><div class="field"><label for="st-pos">Seat</label><select id="st-pos"><option value="BU">Button</option><option value="SB">Small blind</option></select></div>
  <div class="field"><label for="st-size">Open size (bb)</label><select id="st-size"><option>2</option><option selected>2.5</option><option>3</option></select></div></div>
  <div class="row" style="margin-top:10px"><div class="field" id="st-sbf"><label for="st-sb">SB Fold vs BTN Open: <span id="st-sbv"></span></label><input type="range" id="st-sb" min="20" max="95" value="76"></div>
  <div class="field"><label for="st-bb">BB fold vs steal: <span id="st-bbv"></span></label><input type="range" id="st-bb" min="20" max="95" value="83"></div></div>
  <div class="readout"><div class="stat"><div class="n" id="st-rfe"></div><div class="l">RFE</div></div><div class="stat"><div class="n" id="st-fe"></div><div class="l">Fold equity</div></div><div class="stat"><div class="n" id="st-gap"></div><div class="l">Gap</div></div></div>
  <div class="verdict" id="st-v"></div></div>`;
  if(t==='iso')return `<div class="tool"><h3>ISO size calculator</h3>
  <div class="row"><div class="field"><label for="is-n">Limpers</label><select id="is-n"><option>1</option><option>2</option><option>3</option></select></div>
  <div class="field"><label for="is-oop">Position vs limper</label><select id="is-oop"><option value="0">In position</option><option value="1">Out of position</option></select></div>
  <div class="field"><label for="is-adj">Players behind</label><select id="is-adj"><option value="0">Normal</option><option value="1">Loose callers (+1)</option><option value="-1">Light 3-bettors (−1)</option></select></div></div>
  <div class="readout"><div class="stat"><div class="n" id="is-out"></div><div class="l">ISO to</div></div></div><p class="small muted" id="is-why" style="margin:8px 0 0"></p></div>`;
  if(t==='rfe')return `<div class="tool"><h3>Bet size vs. RFE</h3>
  <div class="field"><label for="rf-s">Bet size: <span id="rf-sv"></span> of pot</label><input type="range" id="rf-s" min="10" max="200" step="5" value="50"></div>
  <div class="row" style="margin-top:8px"><div class="field"><label for="rf-o">Your outs when called</label><input type="range" id="rf-o" min="0" max="15" value="0"></div></div>
  <div class="readout"><div class="stat"><div class="n" id="rf-r"></div><div class="l">RFE (no equity)</div></div><div class="stat"><div class="n" id="rf-e"></div><div class="l">Equity when called (to river)</div></div><div class="stat"><div class="n" id="rf-c"></div><div class="l">Villain needs to call</div></div></div>
  <p class="small muted" style="margin:8px 0 0">Equity when called lowers the folds you really need. The more outs and implied odds, the further below RFE you can go.</p></div>`;
  if(t==='req')return `<div class="tool"><h3>Required equity (end of action)</h3>
  <div class="row"><div class="field"><label for="rq-p">Pot before the bet (bb)</label><input type="number" id="rq-p" value="20" min="1"></div><div class="field"><label for="rq-b">Villain bets (bb)</label><input type="number" id="rq-b" value="10" min="0"></div><div class="field"><label for="rq-e">Your estimated equity %</label><input type="number" id="rq-e" value="30" min="0" max="100"></div></div>
  <div class="readout"><div class="stat"><div class="n" id="rq-o"></div><div class="l">ATC / (ATC + TP)</div></div></div><div class="verdict" id="rq-v"></div></div>`;
  if(t==='value')return `<div class="tool"><h3>Value-bet flowchart</h3><div class="flow" id="vf"></div></div>`;
  if(t==='polar')return `<div class="tool"><h3>3-bet shape helper</h3>
  <div class="row"><div class="field"><label for="pl-f">Villain Fold to 3-bet after open %</label><input type="number" id="pl-f" value="60" min="0" max="100"></div>
  <div class="field"><label for="pl-t">Villain type</label><select id="pl-t"><option value="reg">Regular</option><option value="fish">Fish</option></select></div>
  <div class="field"><label for="pl-w">Do you want a flatting range?</label><select id="pl-w"><option value="1">Yes (in position, no squeezers)</option><option value="0">No (SB, short stack, squeezers behind)</option></select></div></div>
  <div class="verdict" id="pl-v"></div></div>`;
  return '';
}
function bindTool(t){
  if(t==='steal'){const f=()=>{const pos=$('#st-pos').value,size=+$('#st-size').value,sb=+$('#st-sb').value/100,bb=+$('#st-bb').value/100;
    $('#st-sbf').hidden=pos==='SB';$('#st-sbv').textContent=Math.round(sb*100)+'%';$('#st-bbv').textContent=Math.round(bb*100)+'%';
    const risk=pos==='SB'?size-0.5:size;const rfe=risk/(risk+1.5);const fe=pos==='SB'?bb:sb*bb;const gap=fe-rfe;
    $('#st-rfe').textContent=pct(rfe);$('#st-fe').textContent=pct(fe);$('#st-gap').textContent=(gap>=0?'+':'')+pct(gap);
    const m=pos==='SB'?[0.03,0.07]:[0.05,0.10];const v=$('#st-v');
    if(gap>=0){v.className='verdict good';v.textContent='Meets RFE. Profitable in a vacuum with any two cards. Still fold the worst junk against aware regs who will adjust.';}
    else if(-gap<=m[0]){v.className='verdict good';v.textContent=`Within ${m[0]*100}% of RFE. With neutral steal factors, open.`;}
    else if(-gap<=m[1]){v.className='verdict warn';v.textContent=`${Math.round(-gap*100)}% short. Open only if steal factors are good: playable hand, blinds call rather than 3-bet, fit-or-fold or weak blinds.`;}
    else{v.className='verdict bad';v.textContent=`${Math.round(-gap*100)}% short. Needs a strong hand or a big post-flop edge (e.g. a Fish in the blinds) to open.`;}};
    ['st-pos','st-size','st-sb','st-bb'].forEach(i=>$('#'+i).oninput=f);f();}
  if(t==='iso'){const f=()=>{const n=+$('#is-n').value,o=+$('#is-oop').value,a=+$('#is-adj').value;$('#is-out').textContent=(3+n+o+a)+'bb';$('#is-why').textContent=`3bb + ${n} for limper${n>1?'s':''}${o?' + 1 OOP':''}${a>0?' + 1 for loose callers':a<0?' − 1 vs 3-bettors':''}`;};['is-n','is-oop','is-adj'].forEach(i=>$('#'+i).oninput=f);f();}
  if(t==='rfe'){const f=()=>{const s=+$('#rf-s').value/100,o=+$('#rf-o').value;$('#rf-sv').textContent=Math.round(s*100)+'%';$('#rf-r').textContent=pct(s/(1+s));$('#rf-e').textContent=pct(eq2(o));$('#rf-c').textContent=pct(s/(1+2*s));};['rf-s','rf-o'].forEach(i=>$('#'+i).oninput=f);f();}
  if(t==='req'){const f=()=>{const p=+$('#rq-p').value||0,b=+$('#rq-b').value||0,e=(+$('#rq-e').value||0)/100;const r=b/(p+2*b||1);$('#rq-o').textContent=pct(r);const v=$('#rq-v');v.className='verdict '+(e>=r?'good':'bad');v.textContent=e>=r?`Call: ${Math.round(e*100)}% ≥ ${pct(r)} needed.`:`Fold: ${Math.round(e*100)}% < ${pct(r)} needed.`;};['rq-p','rq-b','rq-e'].forEach(i=>$('#'+i).oninput=f);f();}
  if(t==='value'){const qs=[['Q1. Is my relative hand strength sufficient? (Ahead of his calling range)'],['Q2. Do I need to build the pot?'],['Q3. Should I slowplay? (Will checking get more in?)']];
    const st={i:0,path:[]};const r=()=>{const el=$('#vf');let html=st.path.map((p,k)=>`<div class="small muted">${qs[k][0]} → <b>${p?'Yes':'No'}</b></div>`).join('');
      let res=null;if(st.path[0]===false)res=['bad','CHECK. Not strong enough relative to his calling range.'];else if(st.path[1]===true)res=['good','VALUE BET. Start building the pot.'];else if(st.path[2]===false)res=['good','VALUE BET. Slowplaying isn\'t better.'];else if(st.path[2]===true)res=['warn','CHECK. Let him put the money in (e.g. vs an Aggro Fish who bluffs).'];
      if(res)html+=`<div class="verdict ${res[0]}">${res[1]}</div><div><button class="btn" id="vf-r">Start again</button></div>`;
      else html+=`<div class="q">${qs[st.path.length][0]}</div><div class="row"><button class="btn" id="vf-y">Yes</button><button class="btn" id="vf-n">No</button></div>`;
      el.innerHTML=html;const y=$('#vf-y'),n=$('#vf-n'),rr=$('#vf-r');if(y)y.onclick=()=>{st.path.push(true);r();};if(n)n.onclick=()=>{st.path.push(false);r();};if(rr)rr.onclick=()=>{st.path=[];r();};};r();}
  if(t==='polar'){const f=()=>{const fo=+$('#pl-f').value,ty=$('#pl-t').value,w=$('#pl-w').value==='1';const v=$('#pl-v');
    if(ty==='reg'&&fo>50&&w){v.className='verdict good';v.textContent='POLAR: 3-bet value + bluffs (suited Ax, suited connectors with blockers), flat the middle.';}
    else if(ty==='fish'||fo<=50){v.className='verdict warn';v.textContent=`LINEAR: fold equity is limited${ty==='fish'?' vs a Fish':''}. 3-bet the top of your playing range for value${w?', flat some hands behind it':''}.`;}
    else{v.className='verdict warn';v.textContent='LINEAR: you have fold equity but don\'t want to flat. 3-bet a linear range (some 3-bet/fold, some 3-bet/get it in).';}};['pl-f','pl-t','pl-w'].forEach(i=>$('#'+i).oninput=f);f();}
}
function eq2(o){if(o<=0)return 0;return 1-((47-o)/47)*((46-o)/46);}

/* ---------- math drill generators ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mkOpts(ans,fmt,spread){const s=new Set([fmt(ans)]);let guard=0;while(s.size<4&&guard++<50){const d=ans+(Math.random()<.5?-1:1)*spread*(1+Math.floor(Math.random()*3));if(d>0&&d<1.0)s.add(fmt(d));}
  const arr=[...s];arr.sort(()=>Math.random()-.5);return {opts:arr,a:arr.indexOf(fmt(ans))};}
const P0=x=>Math.round(x*100)+'%';
const MATH={
  rfe:{label:'RFE of a bet',gen(){const pot=rnd(4,40);const f=pick([0.25,0.33,0.5,0.66,0.75,1,1.5]);const b=Math.round(pot*f*2)/2;const a=b/(b+pot);const o=mkOpts(a,P0,0.07);return {q:`You bet <b>${b}bb</b> into <b>${pot}bb</b> with no equity. How often must Villain fold?`,...o,why:`RFE = ${b} / (${b} + ${pot}) = ${P0(a)}.`};}},

/* Your hand against the board. cls: strong (two pair or better using your cards), over (overpair), top (top pair),

/* Outs when called, the Ch. 4 way: flush draw 9, open-ender 8, gutshot 4 (one less each with a flush draw),

  if(fd&&board.length<5){outs+=9;parts.push(hole.some(c=>c[1]===fd&&c[0]==='A')?'a nut flush draw (9)':'a flush draw (9)');}

  else if(n===1){outs+=fd?3:4;parts.push(fd?'a gutshot (3 more)':'a gutshot (4)');}

/* ---------- spaced repetition for the trainer ----------

   then about 15 spots later, then after 1, 3 and 7 days. A right answer moves it up one step, a miss sends it back to

/* ---------- lesson ---------- */
let LS={id:null,step:0,max:0,qi:0,score:0,answered:null,res:[],want:null};
function renderLesson(id){
  const l=LESSONS.find(x=>x.id===id);if(!l){go('home');return;}
  if(LS.id!==id)Object.assign(LS,{id,step:0,max:0,qi:0,score:0,answered:null,res:[]});
  LS.max=Math.max(LS.max,LS.step);
  const n=l.blocks.length,steps=[...l.blocks.map(b=>b[0]),'Quiz'],idx=LESSONS.indexOf(l);
  const prev=LESSONS[idx-1],nxt=LESSONS[idx+1];
  const stepBtns=cls=>steps.map((s,i)=>`<button class="${i===LS.step?'on':''}${i!==LS.step&&(i<=LS.max||(i===n&&lessonDone(l.id)))?' seen':''}" data-s="${i}" aria-label="${i<n?'Part '+(i+1)+': ':''}${esc(s.replace(/<[^>]+>/g,''))}"${i===LS.step?' aria-current="step"':''}>${cls?esc(s):''}</button>`).join('');
  let body;
  if(LS.step<n){
    const b=l.blocks[LS.step],last=LS.step===n-1;
    body=`<article class="box reading">${LS.step===0?`<p class="lede">${esc(l.sum)}</p>`:''}<div class="block"><h3>${b[0]}</h3>${b[1]}</div>${l.tool&&LS.step===toolStep(l)?toolHTML(l.tool):''}</article>
    <div class="actions">${LS.step===0?`<a class="btn alt" href="#home">Course</a>`:`<button class="btn alt" id="prevB">← Back</button>`}<button class="btn" id="nextB">${last?'Take the quiz →':'Next →'}</button></div>`;
  } else body=quizHTML(l);
  $('#v-lesson').innerHTML=`<div class="lesson">
    <div class="toc" aria-label="Contents">${stepBtns(true)}<hr>${prev?`<button data-go="lesson-${prev.id}">← Ch. ${prev.ch} ${esc(prev.title)}</button>`:''}${nxt?`<button data-go="lesson-${nxt.id}">Ch. ${nxt.ch} ${esc(nxt.title)} →</button>`:''}</div>
    <div class="lesson-main">
      <a class="backlink" href="#home">‹ All chapters</a>
      <div class="lhead"><div class="eyebrow">Chapter ${l.ch} · ${l.mins} min</div><h2>${esc(l.title)}</h2></div>
      <div class="steps">${stepBtns(false)}</div>
      <div class="stepname">${LS.step<n?`Part ${LS.step+1} of ${n} · ${steps[LS.step]}`:`Quiz · ${l.quiz.length} questions`}</div>
      ${body}
    </div></div>`;
  $$('#v-lesson [data-s]').forEach(b=>b.onclick=()=>{const s=+b.dataset.s;if(s===LS.step)return;LS.step=s;if(s===n){LS.qi=0;LS.score=0;LS.res=[];LS.answered=null;}renderLesson(id);scrollTop();});
  $$('#v-lesson [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  const p=$('#prevB'),nb=$('#nextB');
  if(p)p.onclick=()=>lessonStep(-1);
  if(nb)nb.onclick=()=>lessonStep(1);
  if(l.tool&&LS.step===toolStep(l))bindTool(l.tool);
  if(LS.step===n)bindQuiz(l);
  markDay();
}
function toolStep(l){const i=l.toolAt?l.blocks.findIndex(b=>b[0]===l.toolAt):-1;return i<0?l.blocks.length-1:i;}
function scrollTop(){const t=$('#v-lesson .lhead');if(t&&t.getBoundingClientRect().top<0)window.scrollTo(0,0);}
function lessonStep(d){const l=LESSONS.find(x=>x.id===LS.id);const s=LS.step+d;if(s<0||s>l.blocks.length)return;LS.step=s;if(s===l.blocks.length){LS.qi=0;LS.score=0;LS.res=[];LS.answered=null;}renderLesson(LS.id);window.scrollTo(0,0);}
function quizHTML(l){
  const t=l.quiz.length;
  if(LS.qi>=t){
    const s=LS.score,f=s/t,idx=LESSONS.indexOf(l),nxt=LESSONS[idx+1];
    const missed=l.quiz.map((q,i)=>LS.res[i]===false?`<div><b>${q[0]}</b>Answer: <span>${q[1][q[2]]}</span><br><span class="muted" style="color:var(--muted);font-weight:400">${q[3]}</span></div>`:'').join('');
    return `<div class="result ${s===t?'good':f>=.7?'warn':'bad'}"><small>Chapter ${l.ch} quiz</small><b>${s}/${t}</b><p>${s===t?'Clean sweep. On to the next chapter.':f>=.7?'Solid. Look over the misses below, then move on.':'Worth another pass through the chapter before moving on.'}</p></div>
    ${missed?`<div class="sec">What you missed</div><div class="missed">${missed}</div>`:''}
    <div class="actions"><button class="btn alt" id="retry">Retry</button>${nxt?`<a class="btn" href="#lesson-${nxt.id}">Chapter ${nxt.ch} →</a>`:`<a class="btn" href="#ranges">Trainer →</a>`}</div>`;
  }
  const q=l.quiz[LS.qi],a=LS.answered;
  const dots=l.quiz.map((_,i)=>`<i class="${LS.res[i]===true?'r':LS.res[i]===false?'w':''}${i===LS.qi?' c':''}"></i>`).join('');
  return `<div class="box qcard"><div class="qmeta"><span>Question ${LS.qi+1} of ${t}</span><span class="dots" aria-label="${LS.score} right so far">${dots}</span></div>
    <div class="qt">${q[0]}</div>
    <div class="opts">${q[1].map((o,i)=>optHTML(o,i,a===null?'':(i===q[2]?'right':i===a?'wrong':'dim')+(i===a?' picked':''))).join('')}</div>
    ${a!==null?whyHTML(a===q[2],' '+q[3]):''}</div>
    <div class="actions"><button class="btn alt" id="backRead">Reread</button>${a!==null?`<button class="btn" id="qnext">${LS.qi===t-1?'See result →':'Next question →'}</button>`:''}</div>`;
}
function bindQuiz(l){
  const r=$('#retry');if(r)r.onclick=()=>{LS.qi=0;LS.score=0;LS.res=[];LS.answered=null;renderLesson(l.id);window.scrollTo(0,0);};
  const br=$('#backRead');if(br)br.onclick=()=>{LS.step=0;renderLesson(l.id);window.scrollTo(0,0);};
  if(LS.qi>=l.quiz.length)return;
  if(LS.answered!==null)$$('#v-lesson .opt').forEach(b=>b.disabled=true);
  else $$('#v-lesson .opt').forEach(b=>b.onclick=()=>answerQuiz(+b.dataset.i));
  const n=$('#qnext');if(n){n.onclick=nextQuiz;n.focus({preventScroll:true});}
}
function answerQuiz(i){
  const l=LESSONS.find(x=>x.id===LS.id);if(LS.answered!==null||LS.qi>=l.quiz.length||i>=l.quiz[LS.qi][1].length)return;
  const ok=i===l.quiz[LS.qi][2];LS.answered=i;LS.res[LS.qi]=ok;if(ok)LS.score++;logAnswer(ok);
  renderLesson(LS.id);
}
function nextQuiz(){
  const l=LESSONS.find(x=>x.id===LS.id);if(LS.answered===null)return;
  LS.qi++;LS.answered=null;
  if(LS.qi>=l.quiz.length){S.lessons[l.id]=1;S.quiz[l.id]=Math.max(S.quiz[l.id]||0,LS.score);save();}
  renderLesson(l.id);
  const q=$('#v-lesson .qcard,#v-lesson .result');if(q&&q.getBoundingClientRect().top<0)q.scrollIntoView({block:'start'});
}

/* ---------- range trainer ---------- */
const SPOTS=Object.assign({},MODES,PMODES);   // pre-flop chart spots and the generated post-flop spots
const GROUPS=[...new Set(Object.values(SPOTS).map(x=>x.grp))];
const SEATS6=['UTG','HJ','CO','BU','SB','BB'];
let RT={mode:'open-UTG',cur:'open-UTG',hand:null,suits:null,ps:null,rev:null,since:REV_GAP,answered:null,peek:false,streak:0,sc:0,sn:0};
const grpOf=m=>m.startsWith('mix-')?m.slice(4):SPOTS[m].grp;
const modeKeys=m=>m.startsWith('mix-')?Object.keys(SPOTS).filter(k=>SPOTS[k].grp===m.slice(4)):[m];
const dueHere=()=>revDue(S.rev,modeKeys(RT.mode),Date.now(),S.rvN).length;
function inSet(m,h){return answerOf(m,h)!=='f';}
/* Hands next to a hand with a different answer: where the decisions are. */
function edgeHands(m,pool){const P=new Set(pool),out=[];for(let i=0;i<13;i++)for(let j=0;j<13;j++){const h=cellName(i,j);if(!P.has(h))continue;const nb=[[i-1,j],[i+1,j],[i,j-1],[i,j+1]].filter(([a,b])=>a>=0&&b>=0&&a<13&&b<13).map(([a,b])=>cellName(a,b)).filter(x=>P.has(x));if(nb.some(x=>answerOf(m,x)!==answerOf(m,h)))out.push(h);}return out;}
/* A new spot: a due review from this topic (at most one spot in four), else a fresh one. */
function dealHand(){
  RT.answered=null;RT.fresh=true;RT.rev=null;RT.ps=null;S.rvN=(S.rvN||0)+1;
  const keys=modeKeys(RT.mode);
  if(RT.since>=REV_GAP){const due=revDue(S.rev,keys,Date.now(),S.rvN);
    if(due.length){const it=due[0];RT.rev=it.id;RT.cur=it.k;RT.since=0;
      if(PMODES[it.k])RT.ps=it.s;else{RT.hand=it.s.h;RT.suits=it.s.u;}return;}}
  RT.since++;
  RT.cur=keys[Math.floor(Math.random()*keys.length)];
  if(PMODES[RT.cur]){RT.ps=PMODES[RT.cur].gen();return;}
  const pool=MODES[RT.cur].pool||allHands();let h;
  const e=edgeHands(RT.cur,pool);
  if(e.length&&Math.random()<0.6)h=e[Math.floor(Math.random()*e.length)];
  else{let tot=0;const w=pool.map(x=>tot+=combos(x));const r=Math.random()*tot;h=pool[w.findIndex(x=>x>r)];}
  const su=['s','h','d','c'];const a=su[Math.floor(Math.random()*4)];let b;
  if(h.length===2||h[2]==='o'){do b=su[Math.floor(Math.random()*4)];while(b===a);}else b=a;
  RT.hand=h;RT.suits=[a,b];
}
const SUIT={s:'♠',h:'♥',d:'♦',c:'♣'};
function cardHTML(r,s,x){return `<div class="pc${s==='h'||s==='d'?' r':''}${x||''}" aria-label="${r==='T'?'10':r} of ${{s:'spades',h:'hearts',d:'diamonds',c:'clubs'}[s]}">${r==='T'?'<span class="ten">10</span>':r}<small aria-hidden="true">${SUIT[s]}</small></div>`;}
const bb=x=>(x%1?x.toFixed(1):x)+'';
/* The table for a spot. scene: bets (chips in front), did (what each player did), me (your chips when you opened
   first), after (you opened and now face a 3-bet: everyone who did not act has folded). Without a scene, the original
   spots: blinds posted and, for a call spot, a 3bb raise from md.vill. Folded blinds' chips sit in the pot. */
function tableHTML(md){
  const sc=md.scene||{bets:md.vill?{[md.vill]:3}:{},did:md.vill?{[md.vill]:'Raise 3'}:{}};
  const hi=SEATS6.indexOf(md.seat),n=6,chips=Object.assign({SB:.5,BB:1},sc.bets);
  if(sc.me)chips[md.seat]=sc.me;
  const pot=Object.values(chips).reduce((a,b)=>a+b,0);
  let h=`<div class="ptable" role="img" aria-label="${md.info.replace(/"/g,'')}"><div class="oval"></div><div class="tcenter"><span class="pot"><small>Pot</small><b>${bb(pot)}bb</b></span></div>`;
  SEATS6.forEach((s,j)=>{
    const a=(90+(j-hi)*360/n)*Math.PI/180,cx=Math.cos(a),cy=Math.sin(a);
    const you=j===hi,did=sc.did&&sc.did[s],fold=!you&&!did&&(sc.after||j<hi);
    const sub=you?(sc.after?'You · '+bb(sc.me):'You'):did||(fold?'Fold':'');
    h+=`<div class="st${you?' you':''}${fold?' fold':''}${did?' acted':''}" style="left:${(50+43*cx).toFixed(1)}%;top:${(50+41*cy).toFixed(1)}%">${s==='BU'?'<span class="dbtn" aria-label="dealer button">D</span>':''}<b>${s}</b><i>${sub}</i></div>`;
    if(chips[s]&&!fold)h+=`<span class="stk ${chips[s]>=2?'d2':'d1'}" style="left:${(50+25*cx).toFixed(1)}%;top:${(50+21*cy).toFixed(1)}%">${bb(chips[s])}</span>`;
  });
  return h+'</div>';
}
const SWATCH={in:'background:var(--cell-r1)',in2:'background:var(--cell-r2)',in3:'background:var(--cell-r3)',cl:'background:var(--cell-c1)',cl2:'background:var(--cell-c2)',cl3:'background:var(--cell-c3)','':'background:var(--cell-fold)',
  dyn:'background:repeating-linear-gradient(135deg,var(--cell-fold) 0 3px,var(--cell-r3) 3px 5px)',nr:'background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)'};
function gridHTML(m,cur){
  const md=MODES[m];let h='<div class="rg" role="img" aria-label="'+md.label+' range chart">';
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){const n=cellName(i,j),t=tierOf(m,n);
    const c=t?t[1]:md.pool?'nr':'';h+=`<div class="rc ${c}${n===cur?' cur':''}">${n}</div>`;}
  h+='</div>';
  const seen=new Set(),items=[];
  md.tiers.forEach(t=>{const k=t[1]+'|'+t[2];if(t[1]===''||seen.has(k))return;seen.add(k);items.push([t[1],t[2]]);});
  items.push(['','Fold']);if(md.pool)items.push(['nr','Not in your opening range']);
  const tag=md.pool?`${pct(md.set.reduce((a,x)=>a+combos(x),0)/md.pool.reduce((a,x)=>a+combos(x),0))} of your range plays on`:`${pct(rangePct(md.set))} of hands`;
  return h+`<div class="legend">${items.map(([c,l])=>`<span><i style="${SWATCH[c]}"></i>${l}</span>`).join('')}<span class="tag">${tag}</span></div>`;
}
/* Three parts that redraw on their own, so a tap only changes what it should:
   the picker (on a spot change), the spot (new hand or answer) and the chart (peek or answer).
   Cards play the deal animation only when a new hand is dealt (RT.fresh). */
function renderRanges(){
  if(!RT.hand&&!RT.ps)dealHand();
  const g=grpOf(RT.mode);
  $('#v-ranges').innerHTML=`
  <div class="seg gseg" role="group" aria-label="Spot type">${GROUPS.map(x=>`<button data-g="${x}" aria-pressed="${x===g}">${x}</button>`).join('')}</div>
  <div class="chips" role="group" aria-label="Spot">${[['mix-'+g,'Mix']].concat(Object.entries(SPOTS).filter(([k,v])=>v.grp===g).map(([k,v])=>[k,v.label])).map(([k,t])=>`<button class="chip" data-m="${k}" aria-pressed="${k===RT.mode}">${t}</button>`).join('')}</div>
  <div class="drill"><div class="left" id="rt-spot"></div><div class="box chartbox" id="rt-chart"></div></div>`;
  $$('#v-ranges [data-g]').forEach(b=>b.onclick=()=>setMode('mix-'+b.dataset.g));
  $$('#v-ranges [data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $$('#v-ranges [aria-pressed="true"]').forEach(sel=>{const pr=sel.parentNode.getBoundingClientRect(),r=sel.getBoundingClientRect();if(r.right>pr.right-14)sel.parentNode.scrollLeft+=r.right-pr.right+28;});
  drawSpot();drawChart();
}
function drawSpot(){
  if(RT.ps)return drawPost();
  const m=RT.cur,md=MODES[m],a=RT.answered,st=S.drills[m]||{c:0,n:0},right=answerOf(m,RT.hand);
  const ok=a!==null&&a===right,deal=RT.fresh?' deal':'';RT.fresh=false;
  const btn=([k,t],i)=>`<button class="opt${i===0?' go':''}${a===null?'':(k===right?' right':k===a?' wrong':' dim')+(k===a?' picked':'')}" data-k="${k}"${a!==null?' disabled':''}><span class="k" aria-hidden="true">${i+1}</span>${t}</button>`;
  const tr=tierOf(m,RT.hand),lab=(md.opts.find(o=>o[0]===right)||md.opts[md.opts.length-1])[1];
  const why=md.opts.length===2&&!md.scene?` ${RT.hand} is ${right!=='f'?(md.act==='Call'?'a call':'a '+md.act.toLowerCase().replace(/ .*/,''))+' in this spot: it sits inside the '+pct(rangePct(md.set))+' range.':'a fold in this spot'+(tr&&tr[1]==='dyn'?': it opens at a normal table, not with this player behind you.':': it is outside the '+pct(rangePct(md.set))+' range.')}`
    :` ${RT.hand}: ${right==='f'?'fold.':tr[2].toLowerCase()===lab.toLowerCase()?lab.toLowerCase()+'.':`${lab.toLowerCase()} (“${tr[2]}” in the book’s chart).`}`;
  $('#rt-spot').innerHTML=`<div class="spot">
      ${sheadHTML(md.label,st)}
      ${tableHTML(md)}
      <div class="hand">${cardHTML(RT.hand[0],RT.suits[0],deal)}${cardHTML(RT.hand[1],RT.suits[1],deal)}<span class="badge">${RT.hand}</span></div>
      <p class="sinfo">${md.info}</p>
      <div class="acts${md.opts.length===3?' n3':''}">${md.opts.map(btn).join('')}</div>
      ${a!==null?whyHTML(ok,why):''}
    </div>
    ${a!==null?nextBtn('Next hand →'):''}`;
  $$('#rt-spot [data-k]').forEach(b=>b.onclick=()=>answerRT(b.dataset.k));
  const nx=$('#rt-next');if(nx)nx.onclick=nextRT;
}
function drawChart(){
  if(RT.ps)return drawRead();
  const m=RT.cur,md=MODES[m],a=RT.answered,show=a!==null||RT.peek;
  $('#rt-chart').innerHTML=`<div class="ch"><b>${md.label} chart</b>${a===null?peekBtn():''}</div>
    ${show?gridHTML(m,RT.hand):`<div class="hidden-chart">The chart is hidden while you decide. It opens after each answer.</div>`}
    ${chartNote(md)}`;
  const pk=$('#rt-peek');if(pk)pk.onclick=()=>{RT.peek=!RT.peek;drawChart();$('#rt-peek').focus({preventScroll:true});};
}
function chartNote(md){
  const f=md.fig?`Book figure ${md.fig}. `:'';
  if(md.grp==='Open')return md.fig?`<p class="note">${f}Striped and gold squares are the book’s dynamic hands: they change with who is at the table.</p>`:'';
  if(md.grp==='3-bet')return `<p class="note">${f}From Ch. 10. Each range is built for the reads in the spot description; other opponents call for other ranges.</p>`;
  if(md.grp==='vs 3-bet')return `<p class="note">${f}From Ch. 11. Outlined squares are hands you would not have opened, so they are never dealt here.</p>`;
  return `<p class="note">${f}These are the book’s Ch. 6 calling charts, before 3-betting is introduced. Ch. 10 moves some of the top hands into 3-bet ranges depending on the spot.</p>`;
}
const nextBtn=t=>`<div class="actions"><button class="btn" id="rt-next">${t}</button></div>`;
const peekBtn=()=>`<button class="peek" id="rt-peek" aria-pressed="${RT.peek}">${RT.peek?'Hide':'Peek'}</button>`;
function sheadHTML(label,st){const due=dueHere();
  return `<div class="shead"><span class="topic">${RT.rev?'<span class="rvtag">Review</span>':''}${label}</span><span class="stag"><span>Streak <b>${RT.streak}</b></span><span>Here <b>${st.n?pct(st.c/st.n):'–'}</b></span>${due?`<span title="Missed spots due again in this topic">Due <b>${due}</b></span>`:''}</span></div>`;}
/* Post-flop table: pot and board in the middle, you and the players in the hand, everyone else folded. */
function postTableHTML(p,deal){
  const hi=SEATS6.indexOf(p.seat),inn=new Set([p.seat,...p.vill.map(v=>v.seat)]);
  let h=`<div class="ptable post" role="img" aria-label="${esc(p.info.replace(/<[^>]+>/g,''))}"><div class="oval"></div><div class="tcenter"><span class="pot"><small>Pot</small><b>${bb(p.pot)}bb</b></span><span class="pboard">${p.board.map(c=>cardHTML(c[0],c[1],' mini'+deal)).join('')}</span></div>`;
  SEATS6.forEach((s,j)=>{
    const a=(90+(j-hi)*360/6)*Math.PI/180,cx=Math.cos(a),cy=Math.sin(a),you=s===p.seat,inh=inn.has(s);
    const sub=you?'You':inh?(p.sub[s]+(p.did[s]==='Check'?' · Check':'')):'Fold';
    h+=`<div class="st${you?' you':''}${inh?'':' fold'}${inh&&!you?' acted':''}" style="left:${(50+43*cx).toFixed(1)}%;top:${(50+41*cy).toFixed(1)}%">${s==='BU'?'<span class="dbtn" aria-label="dealer button">D</span>':''}<b>${s}</b><i>${sub}</i></div>`;
  });
  return h+'</div>';
}
const handName=h=>{const v=h.map(pfV).sort((a,b)=>b-a);return pfRV(v[0])+pfRV(v[1])+(v[0]===v[1]?'':h[0][1]===h[1][1]?'s':'o');};
function drawPost(){
  const p=RT.ps,md=PMODES[RT.cur],a=RT.answered,st=S.drills[RT.cur]||{c:0,n:0},ok=a!==null&&a===p.ans,deal=RT.fresh?' deal':'';RT.fresh=false;
  const lab=k=>{const o=p.opts.find(x=>x[0]===k);return o[1].replace(/^Bet ([½⅔])$/,'bet $1 pot')+(o[2]&&o[2]!=='all-in'?' ('+o[2]+')':'');};
  const btn=([k,t,sub],i)=>`<button class="opt${a===null?'':(k===p.ans?' right':k===a?' wrong':' dim')+(k===a?' picked':'')}" data-k="${k}"${a!==null?' disabled':''}><span class="k" aria-hidden="true">${i+1}</span><span class="ol">${t}${sub?`<small>${sub}</small>`:''}</span></button>`;
  const why=a===null?'':` <b class="verd">${p.verdict}</b> ${p.why}${!ok?`<span class="wnot"><b>Why not ${lab(a).toLowerCase()}?</b> ${p.notes[a]}</span>`:''}<span class="wprin">${p.principle}</span>`;
  $('#rt-spot').innerHTML=`<div class="spot">
      ${sheadHTML(md.grp+' · '+md.label,st)}
      ${postTableHTML(p,deal)}
      <div class="hand">${cardHTML(p.hole[0][0],p.hole[0][1],deal)}${cardHTML(p.hole[1][0],p.hole[1][1],deal)}<span class="badge">${handName(p.hole)}</span></div>
      <p class="sinfo">${p.info}</p><p class="pfhud">${p.hud}</p>
      <div class="acts pacts">${p.opts.map(btn).join('')}</div>
      ${a!==null?whyHTML(ok,why):''}
    </div>
    ${a!==null?nextBtn('Next spot →'):''}`;
  $$('#rt-spot [data-k]').forEach(b=>b.onclick=()=>answerRT(b.dataset.k));
  const nx=$('#rt-next');if(nx)nx.onclick=nextRT;
}
/* The read: Ch. 4's factor checklist and Figure 22's sizing zones, or Ch. 5's three questions. Hidden until you answer. */
function drawRead(){
  const p=RT.ps,a=RT.answered,show=a!==null||RT.peek,cb=p.kind==='cb';
  let body='';
  if(show&&cb){
    const zone=['s','m','l'].map(k=>`<span class="${k===p.sz.k&&p.ans!=='x'?'on':''}">${{s:'Small<small>½–⅗ pot</small>',m:'Medium<small>⅗–⅔ pot</small>',l:'Large<small>⅔–1× pot</small>'}[k]}</span>`).join('');
    body=`${p.read?`<p class="pread">${p.read}</p>`:''}${p.factors.length?`<ul class="chk">${p.factors.map(([g,t])=>`<li data-v="${g?'+':'-'}">${t}</li>`).join('')}</ul>`:''}
      ${p.need!=null?`<div class="fmeter"><div><span>Expected folds</span><b>${p.fold}%</b></div><div><span>Folds needed</span><b>${p.need}%</b></div></div>`:''}
      ${p.ans!=='x'?`<div class="zones" aria-label="C-bet sizing guide">${zone}</div>`:''}
      <p class="note">${p.ans==='x'?'':p.sz.fish?'Against Fish who don’t watch sizes: big with value, small with light c-bets.':'Drier board and weaker range → smaller; wetter and stronger → bigger (Figure 22).'}</p>`;
  }else if(show){
    body=`<ol class="qflow">${p.q.map(([q,y,w])=>`<li class="${y?'y':'n'}"><b>${q}</b><span class="yn">${y?'Yes':'No'}</span></li>`).join('')}<li class="end"><b>${p.verdict}</b></li></ol>
      ${p.size?`<p class="note">${p.size}</p>`:''}`;
  }
  const lk=cb?'<a href="#lesson-cbet">Ch. 4 C-betting</a>':'<a href="#lesson-value">Ch. 5 Value betting</a>';
  $('#rt-chart').innerHTML=`<div class="ch"><b>${cb?'The read':'The three questions'}</b>${a===null?peekBtn():''}</div>
    ${show?body:`<div class="hidden-chart">The read of this spot is hidden while you decide. It opens after each answer.</div>`}
    <p class="note">Spots are dealt by code from ${lk}. ${cb?'Fold estimates start from his HUD stat and move with the board, his range and position: rough, like reads at the table.':'Your hand, his type and the runout decide each answer.'}</p>`;
  const pk=$('#rt-peek');if(pk)pk.onclick=()=>{RT.peek=!RT.peek;drawRead();$('#rt-peek').focus({preventScroll:true});};
}
function setMode(m){if(m===RT.mode)return;RT.mode=m;RT.streak=0;RT.since=REV_GAP;dealHand();history.replaceState(null,'','#ranges/'+m);renderRanges();}
function nextRT(){dealHand();drawSpot();drawChart();const s=$('#v-ranges .spot');if(s&&s.getBoundingClientRect().top<0)s.scrollIntoView({block:'start'});}
function answerRT(k){
  const opts=RT.ps?RT.ps.opts:MODES[RT.cur].opts;if(RT.answered!==null||VIEW!=='ranges'||!opts.some(o=>o[0]===k))return;
  const right=(RT.ps?RT.ps.ans:answerOf(RT.cur,RT.hand))===k;
  const st=S.drills[RT.cur]||{c:0,n:0};st.n++;if(right)st.c++;S.drills[RT.cur]=st;
  if(RT.rev)revAnswer(S.rev,RT.rev,right,Date.now(),S.rvN);
  else if(!right)revAdd(S.rev,RT.cur,RT.ps||{h:RT.hand,u:RT.suits},Date.now(),S.rvN);
  logAnswer(right);markDay();
  RT.streak=right?RT.streak+1:0;RT.answered=k;drawSpot();drawChart();
  const nx=$('#rt-next');if(nx)nx.focus({preventScroll:true});
}

/* ---------- math drills ---------- */
let MT={type:'rfe',cur:null,answered:null,score:0,n:0};
function renderMath(){
  if(!MT.cur)MT.cur=MATH[MT.type].gen();
  const c=MT.cur,a=MT.answered,st=S.math[MT.type]||{c:0,n:0};
  $('#v-math').innerHTML=`<div class="chips" role="group" aria-label="Drill type" style="padding-top:0">${Object.entries(MATH).map(([k,v])=>`<button class="chip" data-t="${k}" aria-pressed="${k===MT.type}">${v.label}</button>`).join('')}</div>
  <div class="drill"><div class="left">
    <div class="box qcard"><div class="qmeta"><span>${MATH[MT.type].label}</span><span>Session <b class="num" style="color:var(--ink)">${MT.score}/${MT.n}</b> · all time ${st.n?pct(st.c/st.n):'–'}</span></div>
      <div class="qt">${c.q}</div>
      <div class="opts">${c.opts.map((o,i)=>optHTML(o,i,a===null?'':(i===c.a?'right':i===a?'wrong':'dim')+(i===a?' picked':''))).join('')}</div>
      ${a!==null?whyHTML(a===c.a,' '+c.why):''}</div>
    <div class="actions"><button class="btn" id="mnext">${a===null?'Skip':'Next →'}</button></div>
  </div>
  <div class="box"><b class="num" style="font-size:17px">Milestones to memorise</b>
    <div class="tbl" style="margin-top:10px"><table><tr><th>Bet</th><th class="num">Fold eq. needed</th><th class="num">Equity to call</th></tr>
    ${[[.25,'¼ pot'],[.33,'⅓ pot'],[.5,'½ pot'],[.66,'⅔ pot'],[.75,'¾ pot'],[1,'Pot'],[1.5,'1.5× pot'],[2,'2× pot']].map(([f,l])=>`<tr><td>${l}</td><td class="num">${P0(f/(1+f))}</td><td class="num">${P0(f/(1+2*f))}</td></tr>`).join('')}</table></div>
    <p class="small muted">Outs: ×4 on the flop (to the river), ×2 on the turn. Fold equity needed = bet ÷ (bet + pot). Equity to call = call ÷ (call + pot after the call).</p></div></div>`;
  $$('#v-math [data-t]').forEach(b=>b.onclick=()=>{MT.type=b.dataset.t;MT.cur=MATH[MT.type].gen();MT.answered=null;renderMath();});
  if(a===null)$$('#v-math .opt').forEach(b=>b.onclick=()=>answerMath(+b.dataset.i));else $$('#v-math .opt').forEach(b=>b.disabled=true);
  $('#mnext').onclick=nextMath;
}
function answerMath(i){
  const c=MT.cur;if(MT.answered!==null||i>=c.opts.length)return;MT.answered=i;const ok=i===c.a;MT.n++;if(ok)MT.score++;
  const st=S.math[MT.type]||{c:0,n:0};st.n++;if(ok)st.c++;S.math[MT.type]=st;logAnswer(ok);markDay();
  renderMath();$('#mnext').focus({preventScroll:true});
}
function nextMath(){MT.cur=MATH[MT.type].gen();MT.answered=null;renderMath();const q=$('#v-math .qcard');if(q&&q.getBoundingClientRect().top<0)q.scrollIntoView({block:'start'});}

/* ---------- progress ---------- */
function renderProgress(){
  const now=new Date(),today=dayStr(now),studied=new Set(S.days);
  const ago=k=>{const d=new Date(now);d.setDate(d.getDate()-k);return d;};
  // this week: the last seven days
  let wn=0,wc=0,wd=0;const strip=[];
  for(let k=6;k>=0;k--){const d=ago(k),ds=dayStr(d),x=S.log[ds];if(x){wn+=x.n;wc+=x.c;}if(studied.has(ds))wd++;
    strip.push(`<span class="${k===0?'now':''}"><i class="${studied.has(ds)?'on':''}"></i>${'SMTWTFS'[d.getDay()]}</span>`);}
  // activity: 16 weeks, shaded by the number of answers that day
  const start=new Date(now);start.setDate(start.getDate()-start.getDay()-7*15);const cells=[];
  for(let i=0;i<16*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=dayStr(d),n=(S.log[ds]||{n:0}).n;
    const lv=d>now?'fut':n>=60?'l4':n>=20?'l3':n>0?'l2':studied.has(ds)?'l1':'';
    cells.push(`<i class="${lv}${ds===today?' today':''}" title="${ds}${n?' · '+plural(n,'answer'):''}"></i>`);}
  // what to work on next
  const items=[];
  const dueAll=revDue(S.rev,Object.keys(SPOTS),Date.now(),S.rvN);
  GROUPS.map(g=>[g,dueAll.filter(it=>SPOTS[it.k].grp===g).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,2)
    .forEach(([g,n])=>items.push(['Review',`#ranges/mix-${g}`,`${g}: ${plural(n,'missed spot')} due`,'Spaced repetition: missed spots come back until you get them right']));
  Object.entries(SPOTS).map(([k,m])=>[k,m,S.drills[k]]).filter(([k,m,x])=>x&&x.n>=8&&x.c/x.n<.85).sort((a,b)=>a[2].c/a[2].n-b[2].c/b[2].n).slice(0,3)
    .forEach(([k,m,x])=>items.push(['Trainer',`#ranges/${k}`,`${PMODES[k]?m.grp+' · ':''}${m.label}`,`${pct(x.c/x.n)} over ${plural(x.n,'spot')} · ${m.grp}`]));
  LESSONS.filter(l=>S.quiz[l.id]!=null&&S.quiz[l.id]/l.quiz.length<.7).slice(0,2)
    .forEach(l=>items.push(['Quiz',`#lesson-${l.id}`,`Ch. ${l.ch} ${esc(l.title)}`,`Best score ${S.quiz[l.id]}/${l.quiz.length}: reread and retake`]));
  Object.entries(MATH).filter(([k])=>(S.math[k]||{n:0}).n>=5&&S.math[k].c/S.math[k].n<.75).slice(0,2)
    .forEach(([k,v])=>items.push(['Math','#math',v.label,`${pct(S.math[k].c/S.math[k].n)} over ${plural(S.math[k].n,'question')}`,k]));
  GROUPS.filter(g=>!Object.entries(SPOTS).some(([k,m])=>m.grp===g&&(S.drills[k]||{n:0}).n)).slice(0,2)
    .forEach(g=>items.push(['New',`#ranges/mix-${g}`,`Try the ${g} spots`,'Not played yet']));
  // the trainer by group
  const groups=GROUPS.map(g=>{const ms=Object.entries(SPOTS).filter(([k,m])=>m.grp===g);let n=0,c=0;ms.forEach(([k])=>{const x=S.drills[k];if(x){n+=x.n;c+=x.c;}});
    return `<details class="gcard"><summary><span class="pn">${g}<small>${plural(ms.length,'topic')} · ${plural(n,'spot')}</small></span>${n?barHTML(c/n):'<span></span>'}<span class="pv">${n?pct(c/n):'–'}</span></summary>
      <div class="glist">${ms.filter(([k])=>S.drills[k]).sort((a,b)=>S.drills[a[0]].c/S.drills[a[0]].n-S.drills[b[0]].c/S.drills[b[0]].n).map(([k,m])=>{const x=S.drills[k];return `<a class="prow" href="#ranges/${k}"><span class="pn">${m.label}<small>${plural(x.n,'spot')}</small></span>${barHTML(x.c/x.n)}<span class="pv">${pct(x.c/x.n)}</span></a>`;}).join('')}
      ${ms.some(([k])=>!S.drills[k])?`<div class="unplayed">Not played yet: ${ms.filter(([k])=>!S.drills[k]).map(([k,m])=>`<a href="#ranges/${k}">${m.label}</a>`).join(' ')}</div>`:''}</div></details>`;}).join('');
  const maths=Object.entries(MATH).map(([k,v])=>{const x=S.math[k]||{c:0,n:0};return `<a class="tile" href="#math" data-mt="${k}"><b>${x.n?pct(x.c/x.n):'–'}</b><span>${v.label}<br>${plural(x.n,'question')}</span></a>`;}).join('');
  const lv=c=>`<i class="${c}" style="${c?'':'background:var(--track)'}"></i>`;
  $('#v-progress').innerHTML=`<div class="sec" style="margin-top:6px">This week<span>last 7 days</span></div>
  <div class="box"><div class="week"><div><b>${wn}</b><span>answers</span></div><div><b>${wn?pct(wc/wn):'–'}</b><span>correct</span></div><div><b>${wd}/7</b><span>days studied</span></div></div>
    <div class="wdays" aria-label="Days studied this week">${strip.join('')}</div></div>
  <div class="sec">Work on next</div>
  ${items.length?items.slice(0,5).map(([kind,href,what,why,mt])=>`<a class="nextrow" href="${href}"${mt?` data-mt="${mt}"`:''}><span class="kind">${kind}</span><span class="what">${what}<small>${why}</small></span><span class="go" aria-hidden="true">›</span></a>`).join('')
    :`<div class="box small muted">Nothing weak yet. Spots show up here once you’ve played 8 of them below 85%, a quiz under 70%, or a math drill under 75%.</div>`}
  <div class="sec">Trainer<span>${S.rev.length?plural(S.rev.length,'missed spot')+' in review · ':''}tap a group</span></div>${groups}
  <div class="sec">Math drills</div><div class="mtiles">${maths}</div>
  <div class="sec">Activity<span>last 16 weeks</span></div>
  <div class="box"><div class="heat" aria-label="Study days, last 16 weeks">${cells.join('')}</div>
    <div class="heatkey">Less ${lv('')}${lv('l1')}${lv('l2')}${lv('l3')}${lv('l4')} More</div></div>`;
  $$('#v-progress [data-mt]').forEach(a=>a.onclick=()=>{MT.type=a.dataset.mt;MT.cur=null;MT.answered=null;});
}

/* ---------- settings ---------- */
function buildLine(){let t;try{t=new Date(BUILD.at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});}catch(e){t=BUILD.at;}return 'v'+BUILD.v+' · built '+t;}
function renderSettings(){
  $('#v-settings').innerHTML=`<div class="sec" style="margin-top:6px">Appearance</div>
  <div class="group"><div class="srow"><div><b>Theme</b><small>Auto follows your phone</small></div><div class="seg" role="group" aria-label="Theme">${['auto','light','dark'].map(t=>`<button data-th="${t}" aria-pressed="${S.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div></div>
  <div class="sec">Your data<span>saved on this device only</span></div>
  <div class="group">
    <div class="srow"><div><b>Back up progress</b><small>Download a file you can import on another device</small></div><button class="btn alt sm" id="exp">Export</button></div>
    <div class="srow"><div><b>Restore progress</b><small>Replaces what is saved here</small></div><label class="btn alt sm" for="impf" style="cursor:pointer">Import</label><input type="file" id="impf" accept="application/json,.json" hidden></div>
    <div class="srow"><div><b>Reset everything</b><small>Lessons, quiz scores and drill stats</small></div><button class="btn alt sm danger" id="reset">Reset</button></div>
  </div>
  <div class="kbd-only"><div class="sec">Keyboard</div>
  <div class="group"><div class="srow"><div><small><b style="display:inline">1–4</b> answer · <b style="display:inline">Enter</b> next · <b style="display:inline">← →</b> lesson pages · <b style="display:inline">R / C / F</b> raise, call or fold in the range trainer</small></div></div></div></div>
  <div class="sec">About</div>
  <div class="group"><div class="srow"><div><small>A study companion for <i>The Grinder’s Manual</i> by Peter Clarke: lessons and quizzes in chapter order, the book’s default range charts and maths drills. Lesson text is a summary in our own words; the book itself is not included. Install it from your browser menu (Add to Home Screen) to use it offline.</small></div></div></div>
  <p class="ver">${buildLine()}</p>`;
  $$('#v-settings [data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyTheme();renderSettings();});
  $('#exp').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='grinders-manual-progress-'+dayStr()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress exported');};
  $('#impf').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!d.lessons||!d.quiz)throw 0;S=Object.assign(BLANK(),d);save();applyTheme();renderSettings();updateChrome();toast('Progress restored');}catch(x){toast('That file is not a progress backup');}};r.readAsText(file);};
  $('#reset').onclick=()=>{const b=$('#reset');if(b.dataset.armed){const th=S.theme;S=BLANK();S.theme=th;save();LS.id=null;renderSettings();updateChrome();toast('Progress reset');}else{b.dataset.armed=1;b.textContent='Tap again to erase';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reset';}},4000);}};
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.target.matches('input,select,textarea'))return;
  const k=e.key,onBtn=e.target.matches('button,a,[role="button"]');
  if((k==='Enter'||k===' ')&&onBtn)return;
  const num=/^[1-4]$/.test(k)?+k-1:-1;
  if(VIEW==='lesson'){
    const l=LESSONS.find(x=>x.id===LS.id);if(!l)return;
    if(LS.step===l.blocks.length&&LS.qi<l.quiz.length){if(num>=0)answerQuiz(num);else if(k==='Enter')nextQuiz();}
    else if(LS.step<l.blocks.length){if(k==='ArrowRight'){e.preventDefault();lessonStep(1);}else if(k==='ArrowLeft'){e.preventDefault();lessonStep(-1);}}
  }else if(VIEW==='ranges'){
    const op=RT.ps?RT.ps.opts:MODES[RT.cur].opts,lk=k.toLowerCase();
    if(/^[1-4]$/.test(k)&&op[+k-1])answerRT(op[+k-1][0]);
    else if(RT.ps){if(lk==='x')answerRT('x');}
    else if(lk==='r')answerRT(op[0][0]);else if(lk==='c')answerRT('c');else if(lk==='f')answerRT('f');
    else if((k==='Enter'||k===' ')&&RT.answered!==null){e.preventDefault();nextRT();}
  }else if(VIEW==='math'){
    if(num>=0)answerMath(num);else if(k==='Enter'&&MT.answered!==null)nextMath();
  }
});

/* ---------- start ---------- */
applyTheme();route();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload();}});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});});
}
</script>
</body>
</html>
