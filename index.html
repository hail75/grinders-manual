const GROUPS=[...new Set(Object.values(MODES).map(x=>x.grp))];
const SEATS6=['UTG','HJ','CO','BU','SB','BB'];
let RT={mode:'open-UTG',cur:'open-UTG',hand:null,suits:null,answered:null,peek:false,streak:0,sc:0,sn:0};
const grpOf=m=>m.startsWith('mix-')?m.slice(4):MODES[m].grp;
function inSet(m,h){return answerOf(m,h)!=='f';}
/* Hands next to a hand with a different answer: where the decisions are. */
function edgeHands(m,pool){const P=new Set(pool),out=[];for(let i=0;i<13;i++)for(let j=0;j<13;j++){const h=cellName(i,j);if(!P.has(h))continue;const nb=[[i-1,j],[i+1,j],[i,j-1],[i,j+1]].filter(([a,b])=>a>=0&&b>=0&&a<13&&b<13).map(([a,b])=>cellName(a,b)).filter(x=>P.has(x));if(nb.some(x=>answerOf(m,x)!==answerOf(m,h)))out.push(h);}return out;}
function dealHand(){
  if(RT.mode.startsWith('mix-')){const ks=Object.keys(MODES).filter(k=>MODES[k].grp===grpOf(RT.mode));RT.cur=ks[Math.floor(Math.random()*ks.length)];}else RT.cur=RT.mode;
  const pool=MODES[RT.cur].pool||allHands();let h;
  const e=edgeHands(RT.cur,pool);
  if(e.length&&Math.random()<0.6)h=e[Math.floor(Math.random()*e.length)];
  else{let tot=0;const w=pool.map(x=>tot+=combos(x));const r=Math.random()*tot;h=pool[w.findIndex(x=>x>r)];}
  const su=['s','h','d','c'];const a=su[Math.floor(Math.random()*4)];let b;
  if(h.length===2||h[2]==='o'){do b=su[Math.floor(Math.random()*4)];while(b===a);}else b=a;
  RT.hand=h;RT.suits=[a,b];RT.answered=null;RT.fresh=true;
}
const SUIT={s:'♠',h:'♥',d:'♦',c:'♣'};
function cardHTML(r,s,x){return `<div class="pc${s==='h'||s==='d'?' r':''}${x||''}" aria-label="${r==='T'?'10':r} of ${{s:'spades',h:'hearts',d:'diamonds',c:'clubs'}[s]}">${r==='T'?'<span class="ten">10</span>':r}<small aria-hidden="true">${SUIT[s]}</small></div>`;}
const bb=x=>(x%1?x.toFixed(1):x)+'';
/* The table for a spot. scene: bets (chips in front), did (what each player did), me (your chips when you opened
   first), after (you opened and now face a 3-bet: everyone who did not act has folded). Without a scene, the original
   spots: blinds posted and, for a call spot, a 3bb raise from md.vill. Folded blinds' chips sit in the pot. */
function tableHTML(md){
  const sc=md.scene||{bets:md.vill?{[md.vill]:3}:{},did:md.vill?{[md.vill]:'Raise 3'}:{}};
  const hi=SEATS6.indexOf(md.seat),n=6,chips=Object.assign({SB:.5,BB:1},sc.bets);
  if(sc.me)chips[md.seat]=sc.me;
  const pot=Object.values(chips).reduce((a,b)=>a+b,0);
  let h=`<div class="ptable" role="img" aria-label="${md.info.replace(/"/g,'')}"><div class="oval"></div><div class="tcenter"><span class="pot"><small>Pot</small><b>${bb(pot)}bb</b></span></div>`;
  SEATS6.forEach((s,j)=>{
    const a=(90+(j-hi)*360/n)*Math.PI/180,cx=Math.cos(a),cy=Math.sin(a);
    const you=j===hi,did=sc.did&&sc.did[s],fold=!you&&!did&&(sc.after||j<hi);
    const sub=you?(sc.after?'You · '+bb(sc.me):'You'):did||(fold?'Fold':'');
    h+=`<div class="st${you?' you':''}${fold?' fold':''}${did?' acted':''}" style="left:${(50+43*cx).toFixed(1)}%;top:${(50+41*cy).toFixed(1)}%">${s==='BU'?'<span class="dbtn" aria-label="dealer button">D</span>':''}<b>${s}</b><i>${sub}</i></div>`;
    if(chips[s]&&!fold)h+=`<span class="stk ${chips[s]>=2?'d2':'d1'}" style="left:${(50+25*cx).toFixed(1)}%;top:${(50+21*cy).toFixed(1)}%">${bb(chips[s])}</span>`;
  });
  return h+'</div>';
}
const SWATCH={in:'background:var(--felt)',t2:'background:var(--cell-t2)',t3:'background:var(--cell-t3)',cl:'background:var(--cell-call)','':'background:var(--cell-fold)',
  dyn:'background:repeating-linear-gradient(135deg,var(--cell-fold) 0 3px,var(--cell-t2) 3px 5px)',nr:'background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)'};
function gridHTML(m,cur){

    const c=t?t[1]:md.pool?'nr':'';h+=`<div class="rc ${c}${n===cur?' cur':''}">${n}</div>`;}
  h+='</div>';

}

/* ---------- settings ---------- */
function buildLine(){let t;try{t=new Date(BUILD.at).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});}catch(e){t=BUILD.at;}return 'v'+BUILD.v+' · built '+t;}
function renderSettings(){
  $('#v-settings').innerHTML=`<div class="sec" style="margin-top:6px">Appearance</div>
  <div class="group"><div class="srow"><div><b>Theme</b><small>Auto follows your phone</small></div><div class="seg" role="group" aria-label="Theme">${['auto','light','dark'].map(t=>`<button data-th="${t}" aria-pressed="${S.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div></div>
  <div class="sec">Your data<span>saved on this device only</span></div>
  <div class="group">
    <div class="srow"><div><b>Back up progress</b><small>Download a file you can import on another device</small></div><button class="btn alt sm" id="exp">Export</button></div>
    <div class="srow"><div><b>Restore progress</b><small>Replaces what is saved here</small></div><label class="btn alt sm" for="impf" style="cursor:pointer">Import</label><input type="file" id="impf" accept="application/json,.json" hidden></div>
    <div class="srow"><div><b>Reset everything</b><small>Lessons, quiz scores and drill stats</small></div><button class="btn alt sm danger" id="reset">Reset</button></div>
  </div>
  <div class="kbd-only"><div class="sec">Keyboard</div>
  <div class="group"><div class="srow"><div><small><b style="display:inline">1–4</b> answer · <b style="display:inline">Enter</b> next · <b style="display:inline">← →</b> lesson pages · <b style="display:inline">R / C / F</b> raise, call or fold in the range trainer</small></div></div></div></div>
  <div class="sec">About</div>
  <div class="group"><div class="srow"><div><small>A study companion for <i>The Grinder’s Manual</i> by Peter Clarke: lessons and quizzes in chapter order, the book’s default range charts and maths drills. Lesson text is a summary in our own words; the book itself is not included. Install it from your browser menu (Add to Home Screen) to use it offline.</small></div></div></div>
  <p class="ver">${buildLine()}</p>`;
  $$('#v-settings [data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyTheme();renderSettings();});
  $('#exp').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='grinders-manual-progress-'+dayStr()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress exported');};
  $('#impf').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!d.lessons||!d.quiz)throw 0;S=Object.assign(BLANK(),d);save();applyTheme();renderSettings();updateChrome();toast('Progress restored');}catch(x){toast('That file is not a progress backup');}};r.readAsText(file);};
  $('#reset').onclick=()=>{const b=$('#reset');if(b.dataset.armed){const th=S.theme;S=BLANK();S.theme=th;save();LS.id=null;renderSettings();updateChrome();toast('Progress reset');}else{b.dataset.armed=1;b.textContent='Tap again to erase';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reset';}},4000);}};
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.target.matches('input,select,textarea'))return;
  const k=e.key,onBtn=e.target.matches('button,a,[role="button"]');
  if((k==='Enter'||k===' ')&&onBtn)return;
  const num=/^[1-4]$/.test(k)?+k-1:-1;
  if(VIEW==='lesson'){
    const l=LESSONS.find(x=>x.id===LS.id);if(!l)return;
    if(LS.step===l.blocks.length&&LS.qi<l.quiz.length){if(num>=0)answerQuiz(num);else if(k==='Enter')nextQuiz();}
    else if(LS.step<l.blocks.length){if(k==='ArrowRight'){e.preventDefault();lessonStep(1);}else if(k==='ArrowLeft'){e.preventDefault();lessonStep(-1);}}
  }else if(VIEW==='ranges'){
    const op=MODES[RT.cur].opts,lk=k.toLowerCase();
    if(/^[1-3]$/.test(k)&&op[+k-1])answerRT(op[+k-1][0]);
    else if(lk==='r')answerRT(op[0][0]);else if(lk==='c')answerRT('c');else if(lk==='f')answerRT('f');
    else if((k==='Enter'||k===' ')&&RT.answered!==null){e.preventDefault();nextRT();}
  }else if(VIEW==='math'){
    if(num>=0)answerMath(num);else if(k==='Enter'&&MT.answered!==null)nextMath();
  }
});

/* ---------- start ---------- */
applyTheme();route();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload();}});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});});
}
</script>
</body>
</html>
